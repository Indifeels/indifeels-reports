<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supplier Portal</title>
<script>
try { document.documentElement.dataset.theme = "dark"; } catch(e) {}
</script>
<style>
  :root{--bg:#0d1117;--card:#161b22;--border:#30363d;--muted:#9aa4af;--text:#e6edf3;--blue:#58a6ff;--green:#3fb950;--green-bg:#0f2d1a;--amber:#e3b341;--amber-bg:#392a00;--info:#79c0ff;--info-bg:#0c2d4d;--grey-bg:#21262d;--red:#ff7b72}
  :root[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--muted:#59626d;--text:#1f2328;--blue:#0969da;--green:#1a7f37;--green-bg:#dafbe1;--amber:#8a5a00;--amber-bg:#fff1c2;--info:#0550ae;--info-bg:#ddf4ff;--grey-bg:#eaeef2;--red:#cf222e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:0 14px 60px}
  header{padding:18px 0 8px;display:flex;align-items:center;gap:12px}
  header .hd{flex:1}
  header h1{font-size:30px;margin:0;line-height:1.15}
  header .portal{font-size:21px;font-weight:700;color:var(--muted);margin-top:2px}
  header .who{color:var(--text);font-size:18px;margin-top:6px;font-weight:600}
  button,select,input{font:inherit;font-size:15px;border:1px solid var(--border);background:var(--grey-bg);color:var(--text);border-radius:8px;padding:6px 14px}
  button{cursor:pointer}button:disabled{opacity:.45;cursor:default}
  button:hover:not(:disabled){border-color:var(--muted)}
  .primary{background:var(--blue);color:#fff;border-color:transparent;font-weight:700}
  h2.sec{font-size:20px;margin:26px 2px 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  h2.sec .n{font-size:14px;font-weight:600;color:var(--muted)}
  h2.sec .sp{flex:1}
  .hint{color:var(--muted);font-size:15px;margin:0 2px 12px}
  .mbar{position:sticky;top:0;z-index:5;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin:0 0 12px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:16px}
  .mbar label{display:flex;gap:8px;align-items:center;font-weight:600}
  .mbar input[type=checkbox],.mt input[type=checkbox]{width:19px;height:19px;accent-color:var(--blue)}
  .mbar .sp{flex:1}
  .mc{display:flex;gap:16px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
  .mc img,.mc .ph{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--border);flex:none;background:var(--grey-bg)}
  .mc .pc{flex:1;min-width:0}.mc .pc table{width:100%}.mc .pl{display:block;flex:none;line-height:0}
  .mc .pn{font-weight:800;font-size:16.5px;margin:2px 0 6px}.mc .pn a{color:var(--text);text-decoration:none}.mc .pn a:hover{color:var(--blue);text-decoration:underline}
  .mc table{flex:1;border-collapse:collapse;align-self:flex-start;min-width:0}
  .mc th{font-size:12.5px;color:var(--muted);font-weight:700;text-align:left;padding:4px 8px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.03em}
  .mc td{padding:9px 8px;border-bottom:1px solid var(--border);font-size:17px;vertical-align:middle}
  .mc tr:last-child td{border-bottom:0}
  .mc td.q{font-weight:800;text-align:center;font-size:19px}
  .mc .sub{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
  .mc td.a{text-align:right}
  .empty{padding:26px;text-align:center;color:var(--muted);font-size:16px;background:var(--card);border:1px dashed var(--border);border-radius:12px}
  .nextbox{background:var(--card);border:1px dashed var(--border);border-radius:12px;padding:14px 18px;margin-bottom:14px;font-size:16px;color:var(--muted)}
  .nextbox b{color:var(--text)}
  .tg{display:inline-block;background:var(--amber-bg);color:var(--amber);border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:700;margin-left:8px}
  button.warn{background:var(--amber-bg);color:var(--amber);border-color:var(--amber);font-weight:700}
  @media (max-width:700px){.mc{flex-direction:column}}
/*BXCSS_START*/
.bx{border-radius:14px;margin:0 0 14px;overflow:hidden;border:1px solid #05070a;box-shadow:0 8px 18px rgba(0,0,0,.38),0 2px 0 rgba(0,0,0,.35)}
.bx-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:15px 20px;cursor:pointer;user-select:none;color:#f4f5f7;
  background:linear-gradient(180deg,#434950 0%,#272b31 48%,#0d0f12 100%);border-top:1px solid rgba(255,255,255,.28);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -4px 8px rgba(0,0,0,.55)}
.bx-h:hover{filter:brightness(1.12)}
.bx-h .chev{width:16px;color:#c3c9d0;transition:transform .15s;flex:none;font-size:13px}
.bx.open .bx-h .chev{transform:rotate(90deg)}
.bx-title{font-size:21px;font-weight:800;letter-spacing:.02em}
.bx-pill{border-radius:999px;padding:3px 13px;font-size:14px;font-weight:700}
.bx-pill.op{background:#e3b341;color:#2b2100}.bx-pill.sh{background:#3fb950;color:#06240f}
.bx-sum{font-size:16px;color:#d6dae0}
.bx-right{margin-left:auto;font-size:15px;color:#e6e9ed;display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
.bx-right a{color:#9ccfff;font-weight:600}
.bx-body{display:none;padding:16px;background:var(--bg)}
.bx.open .bx-body{display:block}
.bx-prod{display:flex;gap:16px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.bx-prod img,.bx-prod .ph{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--border);flex:none;background:var(--grey-bg)}
.bx-prod table{flex:1;border-collapse:collapse;align-self:flex-start;min-width:0}
.bx-prod th{font-size:12.5px;color:var(--muted);font-weight:700;text-align:left;padding:4px 8px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.03em}
.bx-prod td{padding:8px;border-bottom:1px solid var(--border);font-size:16px;vertical-align:middle}
.bx-prod tr:last-child td{border-bottom:0}
.bx-prod td.q{font-weight:800;text-align:center;font-size:18px}
.bx-prod .sub{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.bx-ship,.bx-trk{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-top:6px}
.bx-ship label,.bx-trk label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);font-weight:600}
.bx-ship input,.bx-trk input{font-size:15px;padding:6px 10px;min-width:150px}
.bx-ship input.u,.bx-trk input.u{min-width:260px}
.bx button.x{padding:3px 10px;font-weight:800;font-size:16px;color:var(--red);flex:none}
.bx button.danger{color:var(--red);border-color:var(--red)}
.bx button.danger.arm{background:var(--red);color:#fff}
.wp{display:inline-block;background:var(--red);color:#fff;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:700;margin-left:6px}
.bx-note{font-size:14px;color:var(--muted)}
.bx-empty{padding:14px;color:var(--muted);font-size:15px}
.stp{display:inline-flex;align-items:center;gap:6px}.stp b{min-width:30px;text-align:center;font-size:18px}.stp button{padding:2px 12px;font-weight:700;font-size:17px}
.low{display:inline-block;background:var(--amber-bg);color:var(--amber);border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:700;margin-left:6px}
@media (max-width:700px){.bx-prod{flex-direction:column}.bx-right{margin-left:0}}

.bx-right button.recvbox{background:rgba(63,185,80,.18);color:#7ee787;border:1px solid rgba(63,185,80,.5);border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px}
.bx-prod td.st{text-align:right;white-space:nowrap}
.bx-prod .low{display:block;margin:3px 0 0;text-align:center;white-space:normal}
.bx-prod td.q .low{font-size:11.5px;padding:1px 8px}
@media (max-width:700px){.bx-body{padding:10px}.bx-prod{padding:10px;gap:10px}.bx-prod table{width:100%;table-layout:auto}.bx-prod th{padding:4px 4px;font-size:11px}.bx-prod td{padding:6px 4px;font-size:14.5px}.bx-prod td.q{font-size:16px}.bx-prod img,.bx-prod .ph{width:72px;height:72px}.bx-h{padding:12px 14px;gap:6px 10px}.bx-title{font-size:18px}.bx-sum,.bx-right{font-size:14px}.bx-prod td.st button{padding:4px 8px;font-size:13px}}
.bx button.arm{background:var(--red)!important;color:#fff!important;border-color:var(--red)!important}
.bx-right a.bx-trkl{background:rgba(88,166,255,.18);border:1px solid rgba(88,166,255,.5);border-radius:999px;padding:3px 12px;color:#9ccfff;text-decoration:none;font-weight:700}
.bx-body>.bx-trk{margin:0 0 12px}
/*BXCSS_END*/

.bx .bx-mvto{display:inline-flex;gap:8px;align-items:center;font-size:13px}

.bx .pl{display:block;flex:none;line-height:0}
.bx .pn{font-weight:800;font-size:16.5px;margin:2px 0 6px}.bx .pn a{color:var(--text);text-decoration:none}.bx .pn a:hover{color:var(--blue);text-decoration:underline}
.bx-prod .pc{flex:1;min-width:0}.bx-prod .pc table{width:100%}

.bx .pnrow{display:flex;gap:10px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}.bx .pnrow .pn{margin:0}
.bx .pmv{display:inline-flex;gap:10px;align-items:center}.bx .pmv .ck{display:inline-flex;gap:6px;align-items:center;font-size:13.5px;color:var(--muted);font-weight:600}
.bx .bx-mvbox{display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center}
.pact{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:2px 0 10px;padding:8px 10px;border-radius:10px;background:var(--grey-bg,rgba(128,128,128,.12))}
.pact .bx-mvto{display:inline-flex;gap:8px;align-items:center;font-size:13.5px;font-weight:600}
.pact select{font-size:14px;padding:6px 8px}
.dq{display:inline-block;font-size:12.5px;font-weight:700;padding:4px 12px;border-radius:999px;background:#b7791f;color:#fff}
.pact button.danger,.mc button.danger{color:var(--red);border-color:var(--red);font-weight:600}
.pact button.dsc{margin-left:auto;font-size:12px;padding:3px 10px;min-height:0;line-height:1.3;opacity:.85;max-width:230px;white-space:normal;text-align:center}
.pact button.dsc.arm{opacity:1}
.pact button.danger.arm,.mc button.danger.arm{background:var(--red);color:#fff}

@media (max-width:700px){
  .pact{flex-direction:column;align-items:stretch;gap:8px;grid-column:1/-1;width:100%;box-sizing:border-box}
  .pact .bx-mvto{display:flex;flex-direction:column;align-items:stretch;gap:4px}
  .pact select,.pact button{width:100%;box-sizing:border-box;min-height:42px}
}
@media (max-width:700px){
  .pact button.dsc{width:auto;min-height:0;align-self:flex-end;margin-left:auto}

<script>
function notify(msg, ok){ let b = document.getElementById('toast'); if (!b) { b = document.createElement('div'); b.id = 'toast'; b.style.cssText = 'position:fixed;left:50%;bottom:18px;transform:translateX(-50%);color:#fff;padding:10px 18px;border-radius:10px;font-size:15px;z-index:99;max-width:90%'; document.body.appendChild(b); } b.style.background = ok ? '#1a7f37' : '#8e2b25'; b.textContent = msg; b.hidden = false; clearTimeout(b._t); b._t = setTimeout(() => { b.hidden = true; }, 6000); }
const pendingCalls = new Map(); let reqId = 0;
function call(action, payload) {
  return new Promise((res, rej) => {
    const req = ++reqId, t = setTimeout(() => { pendingCalls.delete(req); rej(new Error('No answer. Please reload the page.')); }, 25000);
    pendingCalls.set(req, { res, rej, t });
    try { parent.postMessage(Object.assign({ type: 'restock-supplier', action, req }, payload || {}), '*'); } catch (e) { clearTimeout(t); rej(e); }
  });
}
window.addEventListener('message', e => {
  const d = e.data || {};
  if (d.type === 'restock-supplier-theme') document.documentElement.dataset.theme = d.theme === 'light' ? 'light' : 'dark';
  else if (d.type === 'restock-supplier-result') {
    const p = pendingCalls.get(d.req); if (!p) return;
    clearTimeout(p.t); pendingCalls.delete(d.req);
    d.ok ? p.res(d.data) : p.rej(new Error(d.error || 'Failed'));
  }
});
const Store = {
  state: () => call('state'),
  add: (ids, box, confirm) => call('add', { ids, box: box || null, confirm: !!confirm }),
  deleteBox: (box, to) => call('deletebox', { box, to }),
  remove: ids => call('remove', { ids }),
  newBox: () => call('newbox'),
  shipBox: (box, date, url, no) => call('shipbox', { box, date, url, no }),
  tracking: (box, url, no) => call('tracking', { box, url, no }),
  setQty: (id, qty) => call('setqty', { id, qty }),
  discontinue: product => call('discontinue', { product }),
  discPending: () => call('discpending'),
};

const $ = id => document.getElementById(id);
/*BXJS_START*/
const bxEsc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bxEff = r => r.ship_qty == null ? r.qty : r.ship_qty;
const bxFmt = d => d.toLocaleDateString(undefined, {day: 'numeric', month: 'short', year: 'numeric'});
const bxShipDate = b => b.ship_date ? new Date(b.ship_date + 'T00:00:00') : b.shipped_at ? new Date(b.shipped_at) : null;
const bxAgo = d => { const n = Math.max(0, Math.floor((Date.now() - d.getTime()) / 86400000)); return n === 0 ? 'today' : n + (n === 1 ? ' day' : ' days') + ' ago'; };
const bxUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
const bxLink = u => /^https:\/\//.test(u || '') ? bxEsc(u) : '';
const bxImg0 = r => { const s = r.image ? bxEsc(r.image) + (r.image.includes('?') ? '&' : '?') + 'width=200' : ''; return s ? `<img src="${s}" alt="" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=ph></div>'">` : '<div class="ph"></div>'; };
/* product image, linked to the product page (new tab) when we know it */
const bxImg = r => { const u = bxLink(r.product_url); return u ? `<a class="pl" href="${u}" target="_blank" rel="noopener noreferrer" title="Open product page">${bxImg0(r)}</a>` : bxImg0(r); };
/* product name, linked the same way */
const bxName = r => { if (!r.product_title) return ''; const u = bxLink(r.product_url), t = bxEsc(r.product_title); return `<div class="pn">${u ? `<a href="${u}" target="_blank" rel="noopener noreferrer" title="Open product page">${t} ↗</a>` : t}</div>`; };
const bxByVariant = (a, b) => String(a.variant_title).localeCompare(String(b.variant_title), undefined, {numeric: true});
function bxGroup(list) { const m = new Map(); list.forEach(r => { if (!m.has(r.product_id)) m.set(r.product_id, []); m.get(r.product_id).push(r); }); return [...m.values()]; }
const bxToday = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

/* Delete-box control: only the newest open box can be deleted; its items move to another open box or back to the master list. */
function bxDel(b, n, others, o) {
  if (o.lastOpen && o.lastOpen !== b.box_no) return `<span class="bx-note">To delete this box, delete ${bxEsc(o.lastOpen)} first.</span>`;
  const armed = o.armDel === b.box_no, sel = o.delTo || (others.length ? others[0] : '__master');
  const pick = (n && others.length) ? `<label class="bx-mvto">Move its ${n} item${n === 1 ? '' : 's'} to<select data-delto>${others.map(x => `<option value="${bxEsc(x)}"${sel === x ? ' selected' : ''}>${bxEsc(x)}</option>`).join('')}<option value="__master"${sel === '__master' ? ' selected' : ''}>↩ Master list</option></select></label>` : '';
  return pick + `<button class="danger${armed ? ' arm' : ''}" data-delbox="${bxEsc(b.box_no)}">${armed ? 'Tap again to delete' : 'Delete box'}</button>`;
}

/* Supplier-only "permanently discontinued" button (two taps). Hidden unless o.canDisc; shows a waiting pill once sent. */
const bxDisc = (pid, o) => {
  if (!o || !o.canDisc) return '';
  pid = String(pid);
  if (o.discPend && o.discPend.has(pid)) return '<span class="dq">⏳ Discontinue sent · waiting for the owner to confirm</span>';
  const a = o.armDisc === pid;
  return `<button class="danger dsc${a ? ' arm' : ''}" data-disc="${bxEsc(pid)}">${a ? 'Sure it’s permanently discontinued? Tap again' : 'Permanently discontinued?'}</button>`;
};

/* One box tile. b = box row, lines = its order lines, o = {ro, open, who, openBoxes}. */
function bxTile(b, lines, o) {
  const shipped = b.status === 'shipped', units = lines.reduce((a, r) => a + bxEff(r), 0), n = lines.length;
  const d = shipped ? bxShipDate(b) : null, url = bxUrl(b.tracking_url);
  const live = lines.filter(r => r.status === 'shipped').length, rem = o.rem || (() => 0);
  const head = `<div class="bx-h" data-bxt="${bxEsc(b.box_no)}"><span class="chev">▶</span>
    <span class="bx-title">${bxEsc(b.box_no)}${o.who ? ' · ' + bxEsc(o.who) : ''}</span>
    <span class="bx-pill ${shipped ? 'sh' : 'op'}">${shipped ? 'Shipped' : 'Open'}</span>
    <span class="bx-sum">${n} item${n === 1 ? '' : 's'} added · ${units} unit${units === 1 ? '' : 's'}</span>
    <span class="bx-right">${(o.recv && live) ? '<button class="recvbox" data-recvbox="' + bxEsc(b.box_no) + '" title="Everything in this box arrived">Whole box received</button>' : ''}${shipped && d ? '<span>🚚 Shipped ' + bxFmt(d) + ' · ' + bxAgo(d) + '</span>' : ''}${url ? '<a class="bx-trkl" href="' + bxEsc(url) + '" target="_blank" rel="noopener noreferrer">🔗 Track parcel' + (b.tracking_no ? ' · ' + bxEsc(b.tracking_no) : '') + ' ↗</a>' : (b.tracking_no ? '<span>Tracking ' + bxEsc(b.tracking_no) + '</span>' : '')}</span></div>`;
  const others = (o.openBoxes || []).filter(x => x !== b.box_no);
  const mvSel = (key, label) => `<select data-mvg="${bxEsc(key)}"><option value="">${label}</option>${others.map(x => `<option value="${bxEsc(x)}">${bxEsc(x)}</option>`).join('')}<option value="__master">↩ Back to master list</option></select>`;
  const selN = o.selP ? [...o.selP].filter(k => k.startsWith(b.box_no + '|')).length : 0;
  const rows = g => `<div class="bx-prod">${bxImg(g[0])}<div class="pc">${(!o.ro && !shipped) ? `<div class="pnrow">${bxName(g[0]) || '<div class="pn"></div>'}<span class="pmv"><label class="ck"><input type="checkbox" data-selp="${bxEsc(b.box_no + '|' + g[0].product_id)}" ${(o.selP && o.selP.has(b.box_no + '|' + g[0].product_id)) ? 'checked' : ''}> Select</label></span></div><div class="pact"><label class="bx-mvto">Move whole product (${g.length} variant${g.length === 1 ? '' : 's'}) to<select data-mvg="${bxEsc('p:' + b.box_no + '|' + g[0].product_id)}"><option value="">Choose box…</option>${others.map(x => `<option value="${bxEsc(x)}">${bxEsc(x)}</option>`).join('')}<option value="__master">↩ Back to master list</option></select></label>${bxDisc(g[0].product_id, o)}</div>` : bxName(g[0])}<table><thead><tr><th>Variant</th><th style="text-align:center">Ordered</th><th style="text-align:center">${shipped ? 'Packed' : 'Packed'}</th>${(!o.ro && !shipped) ? '<th>Move / remove</th>' : '<th></th>'}</tr></thead><tbody>
    ${g.slice().sort(bxByVariant).map(r => { const more = rem(r), recvd = r.status === 'received', canRecv = o.recv && r.status === 'shipped';
      return `<tr><td>${bxEsc(r.variant_title)}${r.wrong_pick ? '<span class="wp" title="Tagged to another supplier">⚠ wrong pick</span>' : ''}<span class="sub">Ordered ${r.saved_at ? bxFmt(new Date(r.saved_at)) : ''}</span></td><td class="q">${r.qty}${more > 0 ? '<span class="low" title="Still on the master list, not in this box">+' + more + ' more ordered</span>' : ''}</td>
      <td class="q">${(!o.ro && !shipped) ? `<span class="stp"><button data-q="-1" data-id="${bxEsc(r.id)}" ${bxEff(r) <= 0 ? 'disabled' : ''}>−</button><b>${bxEff(r)}</b><button data-q="1" data-id="${bxEsc(r.id)}" ${bxEff(r) >= r.qty ? 'disabled' : ''}>+</button></span>` : bxEff(r)}${bxEff(r) < r.qty ? '<span class="low">short ' + (r.qty - bxEff(r)) + '</span>' : ''}</td>
      <td class="st">${(!o.ro && !shipped) ? `<span style="display:inline-flex;gap:8px;align-items:center"><select data-mv="${bxEsc(r.id)}"><option value="">Move to…</option>${others.map(x => `<option value="${bxEsc(x)}">${bxEsc(x)}</option>`).join('')}<option value="__master">↩ Back to master list</option></select><button class="x" data-rm="${bxEsc(r.id)}" title="Remove from this box (back to the master list)">✕</button></span>` : recvd ? '<span class="low" style="background:var(--green-bg);color:var(--green)">✅ Received</span>' : canRecv ? `<button class="recv" data-recv="${bxEsc(r.id)}">Received</button>` : ''}</td></tr>`; }).join('')}
    </tbody></table></div></div>`;
  let body = n ? bxGroup(lines).map(rows).join('') : `<div class="bx-empty">Nothing in this box yet. Pick items from the master list and press “Add to box”.</div>`;
  if (!o.ro && !shipped) {
    body += `<div class="bx-ship" data-shipbox="${bxEsc(b.box_no)}"><label>Ship date<input type="date" class="bx-date" value="${bxToday()}"></label>
      <label>Tracking link (optional)<input type="text" class="bx-url u" placeholder="https://…" maxlength="500"></label>
      <label>Tracking number (optional)<input type="text" class="bx-no" maxlength="80"></label>
      <button class="primary" data-ship="${bxEsc(b.box_no)}" ${n ? '' : 'disabled'}>Ship this box</button>
      ${n && others.length ? `<span class="bx-mvbox">${mvSel('a:' + b.box_no, 'Move all to…')}${selN ? mvSel('s:' + b.box_no, 'Move selected (' + selN + ') to…') : ''}</span>` : ''}
      ${bxDel(b, n, others, o)}
      <span class="bx-note">When shipped, the next item you add starts the next box.</span></div>`;
  }
  let trkHtml = '';
  if (shipped) {
    trkHtml = o.ro ? ((url || b.tracking_no) ? `<div class="bx-trk"><span><b>Tracking</b> ${b.tracking_no ? bxEsc(b.tracking_no) : ''} ${url ? '<a href="' + bxEsc(url) + '" target="_blank" rel="noopener noreferrer">' + bxEsc(url.length > 60 ? url.slice(0, 57) + '…' : url) + '</a>' : ''}</span></div>` : '')
      : `<div class="bx-trk" data-trkbox="${bxEsc(b.box_no)}"><label>Tracking link<input type="text" class="bx-url u" value="${bxEsc(b.tracking_url || '')}" placeholder="https://…" maxlength="500"></label>
      <label>Tracking number<input type="text" class="bx-no" value="${bxEsc(b.tracking_no || '')}" maxlength="80"></label><button data-trk="${bxEsc(b.box_no)}">Save tracking</button></div>`;
  }
  if (trkHtml) body = trkHtml + body;
  return `<section class="bx${o.open ? ' open' : ''}" data-bx="${bxEsc(b.box_no)}">${head}<div class="bx-body">${body}</div></section>`;
}
/*BXJS_END*/
let S = {orders: [], boxes: [], active: '', identity: '', code: ''};
let armKey = '', armDel = '', delTo = '', armT = null, armDisc = '', armDiscT = null;
const discSet = () => new Set((S.disc || []).map(String));
const armD = pid => { armDisc = pid; clearTimeout(armDiscT); armDiscT = setTimeout(() => { armDisc = ''; render(); }, 7000); render(); };
const arm = (k, kind) => { if (kind === 'del') armDel = k; else armKey = k; clearTimeout(armT); armT = setTimeout(() => { armKey = ''; armDel = ''; render(); }, 6000); render(); };
const taggedOf = ids => ids.filter(id => (S.orders.find(r => r.id === id) || {}).tagged_other);
const picked = new Set(), openState = new Map();
let tgtBox = '';
const selP = new Set();       // ticked products in open boxes ("<box>|<productId>")
const sendQ = new Map(), sendOf = r => sendQ.has(r.id) ? Math.min(r.qty, Math.max(1, sendQ.get(r.id))) : r.qty;
/* after adding: save any lowered quantities ("you send") on the new box lines */
async function saveSend(ids) { for (const id of ids) { if (sendQ.has(id)) { const r = S.orders.find(x => x.id === id), n = sendQ.get(id); sendQ.delete(id); if (r && n < r.qty) await Store.setQty(id, n); } } }
const mineRows = () => masterRows().filter(r => r.tagged_mine);
const allMaster = () => S.orders.filter(r => r.status === 'saved' && !r.claimed);
let mf = '';          // 'mine' | 'all', chosen automatically on first load (mine if any product is tagged to this supplier)
const masterRows = () => mf === 'mine' ? allMaster().filter(r => r.tagged_mine) : allMaster();

function render(){
  if (!mf) mf = allMaster().some(r => r.tagged_mine) ? 'mine' : 'all';
  $('mfilter').value = mf;
  $('who').textContent = S.identity ? 'Signed in as ' + S.identity + (S.code ? ' · box code ' + S.code : '') : '';
  const m = masterRows();
  [...picked].forEach(id => { if (!m.some(r => r.id === id)) picked.delete(id); });
  const hidden = allMaster().length - m.length;
  $('mcount').textContent = m.length || hidden ? m.length + ' item' + (m.length === 1 ? '' : 's') + ' waiting' + (hidden ? ' · ' + hidden + ' others hidden' : '') : '';
  $('mbar').hidden = !(m.length || allMaster().length);
  const mine = mineRows();
  $('mall').checked = mine.length > 0 && mine.every(r => picked.has(r.id));
  $('mall').disabled = !mine.length;
  const openBox = S.boxes.find(b => b.status === 'open');
  const act = S.active;
  const opts = S.boxes.filter(b => b.status === 'open').map(b => b.box_no);
  if (!opts.includes(tgtBox) && tgtBox !== '__new') tgtBox = '';
  const hasItems = S.orders.some(r => r.box_no === act && r.status === 'added');
  $('boxsel').innerHTML = (opts.includes(act) ? '' : `<option value="">${bxEsc(act)} (next)</option>`) + opts.map(x => `<option value="${bxEsc(x)}"${(tgtBox || act) === x ? ' selected' : ''}>${bxEsc(x)}</option>`).join('') + (hasItems ? `<option value="__new"${tgtBox === '__new' ? ' selected' : ''}>＋ New box</option>` : '');
  $('msel').textContent = picked.size ? picked.size + ' selected' : 'Items you add go to ' + act;
  const tg = taggedOf([...picked]).length;
  $('addsel').disabled = !picked.size; $('addsel').classList.toggle('warn', armKey === '__sel'); $('addsel').textContent = armKey === '__sel' ? `${tg} tagged to another supplier — tap again to confirm they're yours` : picked.size ? `Add ${picked.size} to ${tgtBox === '__new' ? 'a new box' : (tgtBox || act)}` : 'Add selected to box';
  $('master').innerHTML = m.length ? bxGroup(m).map(g => `<div class="mc">${bxImg(g[0])}<div class="pc">${bxName(g[0])}<div class="pact">${bxDisc(g[0].product_id, {canDisc: true, discPend: discSet(), armDisc})}</div><table><thead><tr><th style="width:34px"></th><th>Variant</th><th style="text-align:center">Qty wanted</th><th style="text-align:center">You send</th><th></th></tr></thead><tbody>
      ${g.slice().sort(bxByVariant).map(r => `<tr class="mt"><td><input type="checkbox" data-pick="${bxEsc(r.id)}" ${picked.has(r.id) ? 'checked' : ''}></td><td>${bxEsc(r.variant_title)}${r.tagged_other ? '<span class="tg">⚠ Tagged to another supplier</span>' : ''}<span class="sub">Requested ${r.saved_at ? bxFmt(new Date(r.saved_at)) : ''}</span></td><td class="q">${r.qty}</td><td class="q"><span class="stp"><button data-mq="-1" data-id="${bxEsc(r.id)}" ${sendOf(r) <= 1 ? 'disabled' : ''}>−</button><b>${sendOf(r)}</b><button data-mq="1" data-id="${bxEsc(r.id)}" ${sendOf(r) >= r.qty ? 'disabled' : ''}>+</button></span></td>
        <td class="a"><button data-add="${bxEsc(r.id)}" class="${armKey === r.id ? 'warn' : ''}">${armKey === r.id ? 'Not yours? Tap again to confirm' : 'Add to ' + bxEsc(act)}</button></td></tr>`).join('')}
      </tbody></table></div></div>`).join('') : `<div class="empty">${allMaster().length ? 'Nothing tagged to you right now. Switch to “Show: all products” to see the rest.' : 'Nothing waiting on the master list right now.'}</div>`;

  const openNos = S.boxes.filter(b => b.status === 'open').map(b => b.box_no);
  const order = S.boxes.slice().sort((a, b) => (a.status === 'open' ? 0 : 1) - (b.status === 'open' ? 0 : 1) || b.seq - a.seq);
  let html = '';
  if (!openBox) html += `<div class="nextbox">Your next box is <b>${bxEsc(act)}</b>. It starts as soon as you add the first item from the master list.</div>`;
  html += order.map(b => {
    const lines = S.orders.filter(r => r.box_no === b.box_no && ['added', 'shipped', 'received'].includes(r.status));
    const isOpen = openState.has(b.box_no) ? openState.get(b.box_no) : b.status === 'open';
    return bxTile(b, lines, {rem: remOf, ro: false, open: isOpen, openBoxes: openNos, armDel, delTo, selP, lastOpen: openNos[0], canDisc: true, discPend: discSet(), armDisc});
  }).join('');
  // shipped lines from before boxes existed (no box row): show them as shipped tiles
  const known = new Set(S.boxes.map(b => b.box_no)), legacy = new Map();
  S.orders.filter(r => r.status !== 'saved' && !(r.box_no && known.has(r.box_no))).forEach(r => { const k = r.box_no || '(no box)'; if (!legacy.has(k)) legacy.set(k, []); legacy.get(k).push(r); });
  legacy.forEach((lines, k) => { const f = lines[0]; html += bxTile({box_no: k, status: f.status === 'added' ? 'open' : 'shipped', ship_date: f.ship_date, shipped_at: f.shipped_at}, lines, {ro: true, open: !!openState.get(k)}); });
  $('boxes').innerHTML = html || '<div class="empty">No boxes yet.</div>';
}

const remOf = r => S.orders.filter(x => x.status === 'saved' && !x.claimed && x.vkey === r.vkey).reduce((a, x) => a + x.qty, 0);
let busy = false;
async function load(){
  if (busy) return;
  try { S = await Store.state(); S.disc = await Store.discPending().catch(() => []); render(); }
  catch (e) { $('master').innerHTML = '<div class="empty">' + bxEsc(e.message) + '</div>'; $('mbar').hidden = true; $('boxes').innerHTML = ''; }
}
async function act(fn, okMsg){
  busy = true;
  try { const r = await fn(); if (okMsg) notify(typeof okMsg === 'function' ? okMsg(r) : okMsg, true); }
  catch (e) { notify('Failed: ' + e.message); }
  busy = false; await load();
}

function onDisc(e){
  const b = e.target.closest('[data-disc]'); if (!b) return false;
  const pid = b.getAttribute('data-disc');
  if (armDisc !== pid) { armD(pid); return true; }
  armDisc = ''; clearTimeout(armDiscT);
  act(() => Store.discontinue(pid), 'Sent to the owner to confirm it is permanently discontinued');
  return true;
}
$('master').addEventListener('click', e => {
  if (onDisc(e)) return;
  const mq = e.target.closest('[data-mq]');
  if (mq) { const r = S.orders.find(x => x.id === mq.getAttribute('data-id')); if (r) { sendQ.set(r.id, Math.max(1, Math.min(r.qty, sendOf(r) + (+mq.getAttribute('data-mq'))))); render(); } return; }
  const one = e.target.closest('[data-add]');
  if (one) {
    const id = one.getAttribute('data-add');
    if (taggedOf([id]).length && armKey !== id) { arm(id); return; }
    const conf = armKey === id; armKey = '';
    act(async () => { const b = await Store.add([id], null, conf); await saveSend([id]); return b; }, b => 'Added to ' + b);
  }
});
$('master').addEventListener('change', e => {
  const p = e.target.closest('[data-pick]'); if (!p) return;
  const id = p.getAttribute('data-pick'); p.checked ? picked.add(id) : picked.delete(id); render();
});
$('mall').addEventListener('change', () => { const m = mineRows(); if ($('mall').checked) m.forEach(r => picked.add(r.id)); else m.forEach(r => picked.delete(r.id)); render(); });
$('mfilter').addEventListener('change', () => { mf = $('mfilter').value; render(); });
$('boxsel').addEventListener('change', () => { tgtBox = $('boxsel').value; render(); });
$('addsel').addEventListener('click', () => {
  const ids = [...picked];
  if (taggedOf(ids).length && armKey !== '__sel') { arm('__sel'); return; }
  const conf = armKey === '__sel'; armKey = ''; picked.clear();
  act(async () => { let to = tgtBox || null; if (to === '__new') to = await Store.newBox(); tgtBox = ''; const b = await Store.add(ids, to, conf); await saveSend(ids); return b; }, b => ids.length + ' item' + (ids.length === 1 ? '' : 's') + ' added to ' + b);
});
$('newbox').addEventListener('click', () => act(() => Store.newBox(), b => 'Ready: ' + b));
$('refresh').addEventListener('click', load);
call('guide').then(g => { if (g && g.page) { $('guide').href = g.page; $('guide').hidden = false; $('guidepdf').href = g.pdf; $('guidepdf').hidden = false; } }).catch(() => {});
$('boxes').addEventListener('click', e => {
  if (onDisc(e)) return;
  const t = e.target;
  const q = t.closest('[data-q]');
  if (q) {
    const r = S.orders.find(x => x.id === q.getAttribute('data-id')); if (!r) return;
    const n = Math.max(0, Math.min(r.qty, bxEff(r) + (+q.getAttribute('data-q'))));
    if (n >= r.qty) r.ship_qty = null; else if (n > 0) { r.qty = n; r.ship_qty = null; } render();                       // instant feedback, then save
    act(() => Store.setQty(r.id, n)); return;
  }
  const rm = t.closest('[data-rm]');
  if (rm) { act(() => Store.remove([rm.getAttribute('data-rm')]), 'Removed from the box (back on the master list)'); return; }
  const db = t.closest('[data-delbox]');
  if (db) {
    const box = db.getAttribute('data-delbox');
    if (armDel !== box) { const sl = db.parentNode.querySelector('[data-delto]'); delTo = sl ? sl.value : ''; arm(box, 'del'); return; }
    const to = delTo || ((db.parentNode.querySelector('[data-delto]') || {}).value || ''), dest = to && to !== '__master' ? to : '';
    armDel = ''; delTo = ''; act(() => Store.deleteBox(box, dest), n => box + ' deleted' + (n ? ' · ' + n + ' item' + (n === 1 ? '' : 's') + (dest ? ' moved to ' + dest : ' back on the master list') : '')); return;
  }
  const sh = t.closest('[data-ship]');
  if (sh) {

  }
  const tk = t.closest('[data-trk]');
  if (tk) {
    const box = tk.getAttribute('data-trk'), pn = tk.closest('[data-trkbox]');
    const url = pn.querySelector('.bx-url').value.trim(), no = pn.querySelector('.bx-no').value.trim();

  }
  if (t.closest('a, input, select, button, label')) return;
  const h = t.closest('[data-bxt]');
  if (h) { const s = h.closest('.bx'), id = h.getAttribute('data-bxt'); s.classList.toggle('open'); openState.set(id, s.classList.contains('open')); }
});
$('boxes').addEventListener('change', e => {
  if (e.target.closest('[data-delto]')) { delTo = e.target.value; return; }
  const sp = e.target.closest('[data-selp]');
  if (sp) { const k = sp.getAttribute('data-selp'); sp.checked ? selP.add(k) : selP.delete(k); render(); return; }
  const mg = e.target.closest('[data-mvg]');
  if (mg) {
    if (!mg.value) return;
    const key = mg.getAttribute('data-mvg'), kind = key[0], rest = key.slice(2), to = mg.value;
    const inBox = box => S.orders.filter(r => r.box_no === box && r.status === 'added');
    let ids = [], label = '';
    if (kind === 'p') { const [box, pid] = rest.split('|'); ids = inBox(box).filter(r => String(r.product_id) === pid).map(r => r.id); label = 'Product'; }
    else if (kind === 'a') { ids = inBox(rest).map(r => r.id); label = 'Whole box'; }
    else if (kind === 's') { const keys = [...selP].filter(k => k.startsWith(rest + '|')); ids = inBox(rest).filter(r => keys.includes(rest + '|' + r.product_id)).map(r => r.id); keys.forEach(k => selP.delete(k)); label = 'Selected products'; }
    if (!ids.length) { render(); return; }
    const n = ids.length, msg = () => label + ' (' + n + ' item' + (n === 1 ? '' : 's') + ') ' + (to === '__master' ? 'sent back to the master list' : 'moved to ' + to);
    if (to === '__master') act(() => Store.remove(ids), msg); else act(() => Store.add(ids, to), msg);
    return;
  }
  const mv = e.target.closest('[data-mv]'); if (!mv || !mv.value) return;
  const id = mv.getAttribute('data-mv'), to = mv.value;
  if (to === '__master') act(() => Store.remove([id]), 'Sent back to the master list');
  else act(() => Store.add([id], to), b => 'Moved to ' + b);
});
$('theme').addEventListener('click', () => { const n = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = n; try { parent.postMessage({ type: 'restock-supplier', action: 'theme', theme: n }, '*'); } catch(e) {} });
setInterval(() => { if (document.visibilityState === 'visible' && !/^(INPUT|SELECT)$/.test((document.activeElement || {}).tagName || '')) load(); }, 60000);
load();
try { parent.postMessage({ type: 'restock-supplier', action: 'ready' }, '*'); } catch (e) {}
</script>
