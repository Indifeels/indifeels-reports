<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Google Tracked Scorecard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>

/* Charcoal Stack: charcoal raised tiles, lighter inner boxes, teal / orange / red status. */
:root{
  --bg:#E9ECE8;--fg:#232826;--muted:#6A726E;--line:#D3D8D3;--surface:#F7F8F5;--surface2:#EDF0EB;
  --tile-a:#3A403E;--tile-b:#262B29;--tile-fg:#F1F3EF;--tile-muted:#A3ABA6;--tile-edge:#555C59;--tile-track:#4A514E;
  --good:#2FCB9A;--warn:#FF9A3D;--bad:#FF6275;--none:#7C8480;
  --good-ink:#0B7A57;--warn-ink:#B25800;--bad-ink:#C42E42;
  --a1:#2FCB9A;--a2:#4DA3FF;--a3:#A98BFF;--a4:#FF9A3D;--shadow:rgba(30,36,33,.28);
  --sx-a:#F4F6F2;--sx-b:#E5E9E3;--sx-hi:rgba(255,255,255,.9);--sx-lo:rgba(0,0,0,.06);--sx-drop:rgba(30,36,33,.12)}
:root[data-theme="dark"]{
  --bg:#171B1A;--fg:#E7EAE6;--muted:#98A19C;--line:#2F3633;--surface:#202624;--surface2:#2A312E;
  --tile-a:#272B2D;--tile-b:#141617;--tile-edge:#3B4144;--tile-track:#383D40;
  --sx-a:#3C4144;--sx-b:#2E3235;--sx-hi:rgba(255,255,255,.14);--sx-lo:rgba(0,0,0,.35);--sx-drop:rgba(0,0,0,.4);
  --good-ink:#52E0B5;--warn-ink:#FFB066;--bad-ink:#FF8A98;--shadow:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 Figtree,system-ui,sans-serif;
  padding:20px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
h1,h3,.num{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:700;letter-spacing:-.01em}
h2{font:600 13px Figtree,sans-serif;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 12px}
button{font:inherit;color:inherit;cursor:pointer}
.banner{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn-ink);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.tg{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:600;font-size:13px}
.hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.hero .big{position:relative;width:132px;height:132px;flex:none}
.hero .big .v{position:absolute;inset:0;display:grid;place-items:center;font-size:40px}
.hero .t{flex:1;min-width:210px}
.hero h1{font-size:30px;margin:0 0 4px}.hero p{margin:0;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.good{background:var(--good)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.fixes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.fix{text-align:left;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--bad);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.fix.warn{border-top-color:var(--warn)}
.fix .n{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.fix b{font:700 16px/1.2 "Bricolage Grotesque",sans-serif}.fix span.b{font-size:13px;color:var(--muted)}
/* profit panel */
.panel{background:linear-gradient(155deg,var(--tile-a),var(--tile-b));color:var(--tile-fg);border-radius:20px;padding:16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -2px 0 rgba(0,0,0,.35),0 1px 0 var(--tile-edge),0 10px 0 -3px rgba(0,0,0,.28),0 16px 24px -8px var(--shadow);display:flex;flex-direction:column;gap:12px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ph h3{margin:0;font-size:18px}
.seg{display:flex;gap:6px}
.seg button{border:1px solid var(--tile-track);background:transparent;color:var(--tile-fg);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600}
.seg button.on{background:var(--tile-fg);color:#141617;border-color:var(--tile-fg)}
.pstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.pstats .sx{background:linear-gradient(135deg,#3C4144,#2E3235);color:var(--tile-fg)}
.sx{background:linear-gradient(135deg,var(--sx-a),var(--sx-b));border-radius:14px;padding:12px;min-width:0;box-shadow:inset 1px 1px 1px var(--sx-hi),inset -1px -2px 2px var(--sx-lo),3px 5px 10px var(--sx-drop)}
.sx .l{font-size:12px;color:var(--muted)}.pstats .sx .l{color:var(--tile-muted)}
.sx .v{font-size:24px;line-height:1.1;margin-top:2px}.sx .p{font-size:12px;color:var(--muted)}
.pstats .sx .p{color:var(--tile-muted)}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.lg{display:flex;gap:14px;font-size:12px;color:var(--tile-muted)}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
/* filters */
.flt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.flt button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600}
.flt button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:12px}.hero .big{width:108px;height:108px}.hero .big .v{font-size:32px}}
.tile{position:relative;text-align:left;border:0;border-radius:20px;padding:14px 14px 12px;color:var(--tile-fg);
  background:linear-gradient(155deg,var(--tile-a),var(--tile-b));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -2px 0 rgba(0,0,0,.35),0 1px 0 var(--tile-edge),0 10px 0 -3px rgba(0,0,0,.28),0 16px 24px -8px var(--shadow);
  transition:transform .15s;display:flex;flex-direction:column;gap:10px;min-width:0}
.tile *{min-width:0}
.tile:hover{transform:translateY(-3px)}.tile:active{transform:translateY(2px)}
.tile[aria-expanded="true"]{transform:translateY(2px);outline:2px solid var(--a2);outline-offset:2px}
.tile:focus-visible,.fix:focus-visible,.tg:focus-visible,button:focus-visible{outline:3px solid var(--a2);outline-offset:3px}
.tile .tp{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tile .rk{font-size:12px;color:var(--tile-muted);letter-spacing:.06em}
.tile .ring{position:relative;width:62px;height:62px;flex:none}
.tile .ring .v{position:absolute;inset:0;display:grid;place-items:center;font-size:20px}
.tile h3{margin:0;font-size:16px;line-height:1.15}
.tile .key{font-size:24px;line-height:1}
.tile .kl{font-size:12px;color:var(--tile-muted);margin-top:-4px}
.tile .viz{margin-top:auto;height:34px;padding-top:8px}.tile .viz svg{width:100%;height:34px;display:block;overflow:visible}
.tile .src{font-size:11px;color:var(--tile-muted);border:1px dashed var(--tile-track);border-radius:99px;padding:1px 7px;align-self:flex-start}
.tile .cv{display:inline-block;transition:transform .2s}.tile[aria-expanded="true"] .cv{transform:rotate(180deg)}
.xp{grid-column:1/-1;display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.xp.on{grid-template-rows:1fr}.xp>.inner{overflow:hidden;min-height:0}
.pad{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:16px;margin-block:2px 6px}
.sh{display:flex;gap:14px;align-items:center}
.sh .ring{position:relative;width:76px;height:76px;flex:none}.sh .ring .v{position:absolute;inset:0;display:grid;place-items:center;font-size:26px}
.sh h3{margin:0;font-size:22px;flex:1}.sh small{display:block;color:var(--muted);font:500 13px Figtree;margin-bottom:2px}
.x{border:1px solid var(--line);background:var(--surface2);border-radius:99px;width:40px;height:40px;font-size:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.blk{display:flex;flex-direction:column;gap:8px}.blk h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) auto;gap:10px;align-items:center;font-size:13px}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tr2{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}.row .tr2 i{display:block;height:100%;border-radius:99px}
.row .val{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;min-width:44px}
.fx{padding:10px 12px;border-left:3px solid var(--good);background:var(--surface2);border-radius:0 10px 10px 0;font-size:14px}
.how{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.foot{font-size:12px;color:var(--muted)}

/* ---- additions ---- */
.step{grid-column:1/-1;display:flex;gap:10px;align-items:baseline;margin:10px 0 -4px;flex-wrap:wrap}
.step b{font:700 18px "Bricolage Grotesque",sans-serif}.step span{font-size:13px;color:var(--muted)}
.step i{font-style:normal;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--fg);color:var(--bg);font:700 13px Figtree}
.tile .att{font-size:11px;font-weight:600;border-radius:99px;padding:1px 8px;align-self:flex-start;background:color-mix(in srgb,var(--bad) 30%,transparent);color:#FFB3BC}
.tile .att.w{background:color-mix(in srgb,var(--warn) 30%,transparent);color:#FFD2A3}
.tile .att.g{background:color-mix(in srgb,var(--good) 28%,transparent);color:#8FF0CF}
.tile .att.n{background:rgba(255,255,255,.1);color:var(--tile-muted)}
.ring.null svg circle:last-child{display:none}.ring.null svg circle:first-child{stroke-dasharray:4 5}
.seg2{display:flex;gap:6px;flex-wrap:wrap}
.seg2 button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600}
.seg2 button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chartx{overflow-x:auto;padding-bottom:4px}
.chartx svg{display:block;height:auto}
.cap{font-size:12px;color:var(--tile-muted);margin:2px 0 -2px}
details.dd{background:rgba(255,255,255,.06);border-radius:12px;padding:8px 12px}
details.dd summary{cursor:pointer;font-size:13px;font-weight:600}
.tbl{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:600;color:var(--muted);text-align:right;padding:7px 9px;font-size:12px;white-space:nowrap;background:var(--surface2);position:sticky;top:0}
td{padding:7px 9px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:200px}
.panel table{font-size:12.5px}.panel .tbl{border-color:var(--tile-track);background:transparent}
.panel th{background:rgba(255,255,255,.06);color:var(--tile-muted)}.panel td{border-top-color:var(--tile-track)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600}
.pill.good{background:color-mix(in srgb,var(--good) 28%,transparent);color:var(--good-ink)}
.pill.warn{background:color-mix(in srgb,var(--warn) 30%,transparent);color:var(--warn-ink)}
.pill.bad{background:color-mix(in srgb,var(--bad) 28%,transparent);color:var(--bad-ink)}
.pill.none{background:var(--surface2);color:var(--muted)}
.rk{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:7px;background:var(--fg);color:var(--bg);font:700 12px Figtree;margin-right:8px;padding:0 5px}
.l0 td,.l0 th{background:var(--surface2);font-weight:700}
.l1 td:first-child{padding-left:26px}.l2 td:first-child{padding-left:46px}.l3 td:first-child{padding-left:68px}
.l1 td{background:color-mix(in srgb,var(--surface2) 55%,var(--surface))}
.tg2{cursor:pointer;user-select:none}
.tg2 .cv2{display:inline-block;width:16px;transition:transform .15s}.tg2.open .cv2{transform:rotate(90deg)}
.c-g{color:#1A73E8}.c-f{color:#8E5CF7}.c-o{color:#0B9A6D}
.cell{font-weight:600}
td.gcol{background:color-mix(in srgb,#4DA3FF 12%,transparent)}td.fcol{background:color-mix(in srgb,#A98BFF 14%,transparent)}td.ocol{background:color-mix(in srgb,#2FCB9A 12%,transparent)}
.ord td:first-child{font-size:12.5px;color:var(--fg)}.ord small{display:block;color:var(--muted);font-size:11.5px;white-space:normal}
.chip2{display:inline-block;border-radius:99px;padding:0 7px;font-size:11px;font-weight:700;margin-left:6px}
.chip2.rev{background:color-mix(in srgb,var(--warn) 35%,transparent);color:var(--warn-ink)}
.chip2.ok{background:color-mix(in srgb,var(--good) 30%,transparent);color:var(--good-ink)}
.chip2.tag{background:var(--surface2);color:var(--muted)}
.cf{display:inline-flex;gap:4px;margin-top:4px}
.cf button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:2px 8px;font-size:11.5px;font-weight:600}
.cf button:hover{background:var(--fg);color:var(--bg)}
.acts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.acts li{padding:10px 12px;border-left:3px solid var(--good);background:var(--surface2);border-radius:0 10px 10px 0;font-size:14px}
.acts li.b{border-left-color:var(--bad)}.acts li.w{border-left-color:var(--warn)}
.note{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:12px;padding:10px 12px}
.nodata{border:1px dashed var(--line);border-radius:14px;padding:14px;color:var(--muted);font-size:13.5px;background:var(--surface2)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--tile-muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.kwtag{font-size:11.5px;font-weight:700}

.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:14px}
.pt{background:linear-gradient(155deg,var(--tile-a),var(--tile-b));color:var(--tile-fg);border-radius:20px;padding:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 -3px 8px rgba(0,0,0,.3),0 10px 24px var(--shadow);border:1px solid var(--tile-edge)}
.pt h3{margin:0;font:700 18px 'Bricolage Grotesque',Figtree,sans-serif}.pt .rg{font-size:12px;font-weight:700;margin:2px 0 12px;color:var(--tile-fg)}
.pm{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 10px;padding-bottom:12px;border-bottom:1px solid var(--tile-track)}
.pm b{display:block;font-size:20px;font-weight:700}.pm i{display:block;font-style:normal;font-size:12px;color:var(--tile-muted)}.pm b.neg{color:#FF8A98}
.pm small{font-size:11.5px;font-weight:700;display:inline-block;margin-right:6px}.pm small.up{color:#2FCB9A}.pm small.dn{color:#FF8A98}.pm small.nt{color:#A3ABA6}
.pt p{font-size:12.5px;margin:10px 0 0;color:var(--tile-fg)}.pt p.nt2{color:var(--tile-muted);font-size:12px}
.tile .rk{display:block;min-width:0;height:auto;padding:0;margin:0 0 4px;border-radius:0;background:none;font:600 11px Figtree;color:var(--tile-muted);letter-spacing:.08em;text-transform:uppercase}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;padding:6px 14px 16px}
.stepd{margin:14px 0;border-radius:18px;border:1px solid var(--tile-edge);background:linear-gradient(155deg,var(--tile-a),var(--tile-b));box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 -3px 8px rgba(0,0,0,.3),0 10px 24px var(--shadow);color:var(--tile-fg)}
.stepd .gh{width:100%;background:none;border:0;color:inherit;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border-radius:18px}
.stepd .gh:hover{background:rgba(255,255,255,.04)}
.stepd .gh::after{content:"▾";margin-left:auto;color:var(--tile-muted);font-size:16px;transition:transform .3s ease}.stepd.shut .gh::after{transform:rotate(-90deg)}
.stepd .gh i{font-style:normal;display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:var(--tile-fg);font:700 13px Figtree}
.stepd .gh b{font:700 18px 'Bricolage Grotesque',Figtree,sans-serif}.stepd .gh span{font-size:13px;color:var(--tile-muted)}
.stepd .gh em{font-style:normal;font-size:12px;font-weight:700;color:var(--tile-fg);background:rgba(255,255,255,.08);border-radius:99px;padding:2px 10px}
.gb{display:grid;grid-template-rows:1fr;transition:grid-template-rows .32s ease}.stepd.shut .gb{grid-template-rows:0fr}
.gbi{overflow:hidden;min-height:0}.stepd.shut .gbi{visibility:hidden;transition:visibility 0s .32s}
.tile{cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}.tile:hover{box-shadow:0 14px 28px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.14)}
.tile .src{border:0;padding:0;margin-top:6px;color:var(--tile-muted)}
.tile .opn{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;width:100%;padding:7px 10px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);font:600 12.5px Figtree;color:var(--tile-fg);transition:background .15s}
.tile:hover .opn{background:rgba(255,255,255,.15)}
.tile .opn .o2{display:none}.tile[aria-expanded="true"] .opn .o1{display:none}.tile[aria-expanded="true"] .opn .o2{display:inline}
/* ---- inner tiles + 3D charcoal grid ---- */
.it{border-radius:16px;margin:12px 0;border:1px solid rgba(255,255,255,.06);background:linear-gradient(180deg,#3E4442,#2B302E);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 -3px 8px rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.38);color:#F1F3EF}
.it>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:12px 16px}
.it>summary::-webkit-details-marker{display:none}
.it>summary::before{content:"▸";color:#A3ABA6;transition:transform .15s}.it[open]>summary::before{transform:rotate(90deg)}
.it>summary b{font:700 15px 'Bricolage Grotesque',Figtree,sans-serif}.it>summary span{font-size:12.5px;color:#A3ABA6}
.itb{padding:0 12px 14px}.itb .tbl{background:rgba(0,0,0,.18);border-color:rgba(255,255,255,.07);border-radius:12px}
.itb th{background:rgba(255,255,255,.07);color:#A3ABA6}.itb td{border-top-color:rgba(255,255,255,.07)}
.itb .note,.itb p.note{color:#A3ABA6;font-size:12.5px;margin:2px 4px 10px}
.up{color:#2FCB9A;font-weight:700}.dn{color:#FF6275;font-weight:700}
#agrid{border-collapse:separate;border-spacing:0 6px;color:#F1F3EF}
#agrid th{background:transparent;color:#A3ABA6;border:0;position:sticky;top:0;z-index:2;background:#262B29}
#agrid th.c-g{color:#6FB4FF}#agrid th.c-f{color:#B9A2FF}#agrid th.c-o{color:#2FCB9A}
#agrid td{border:0;color:#F1F3EF;background:linear-gradient(180deg,var(--g1),var(--g2));box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 -2px 4px rgba(0,0,0,.30)}
#agrid td:first-child{border-radius:12px 0 0 12px}#agrid td:last-child{border-radius:0 12px 12px 0}
#agrid tr{--g1:#3A403E;--g2:#2B302E}
#agrid tr.l0{--g1:#454B49;--g2:#303533}
#agrid tr.l1{--g1:#3C4240;--g2:#2D3230}
#agrid tr.l2{--g1:#353A38;--g2:#292D2B}
#agrid tr.l3{--g1:#2F3433;--g2:#262A29}
#agrid td.gcol{background:linear-gradient(rgba(77,163,255,.20),rgba(77,163,255,.20)),linear-gradient(180deg,var(--g1),var(--g2))}

</style></head><body>
<div class="wrap">
  <div class="banner" id="banner"></div>
  <div class="top"><span id="refr"></span><span style="display:flex;gap:8px"><button class="tg" id="theme">Light / Dark</button></span></div>
  <section><h2>Google Ads, tracked</h2><div class="pgrid" id="periods"></div></section>
  <section class="hero" id="hero"></section>
  <section><h2>Profit — daily and cumulative</h2><div class="panel" id="profit"></div></section>
  <section>
    <div class="bar2" style="margin-bottom:12px"><h2 style="margin:0">Scorecard</h2>
      <div class="seg2" id="sortseg"><button data-s="prio" class="on">By priority</button><button data-s="step">By process (step 1 → 7)</button></div></div>
    <div class="grid" id="grid"></div></section>
  <p class="foot" id="foot"></p>
</div>
<script>
const D=/*__DATA__*/null;
const $=s=>document.querySelector(s);
const fmt$=(v,d=0)=>(v<0?"−":"")+"$"+Math.abs(v).toLocaleString("en-AU",{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(v,d=0)=>(v*100).toFixed(d)+"%";
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NET=0.75/1.1, EXPERT_DAY=155/7;
const STEPS={1:["Trust the numbers","Can you believe what the reports say?"],2:["Check the money","Are we making or losing money today?"],3:["Triage campaigns","Which campaigns, ad groups and ads to scale, fix or cut"],4:["Find demand","What people search for and where we are missing it"],5:["Fix the funnel","Where visitors drop between click and purchase"],6:["Cover offline","Calls, store visits and local — about 70% of revenue"],7:["Feed & creative","Product feed and ad assets"]};
let BASIS="shopify"; // or "ads"
let OV={};try{OV=JSON.parse(localStorage.getItem("gts-confirm")||"{}")}catch(e){}
function saveOV(){try{localStorage.setItem("gts-confirm",JSON.stringify(OV))}catch(e){}}

/* ---------- orders ---------- */
const MELD=t=>new Date(t).toLocaleDateString("en-CA",{timeZone:"Australia/Melbourne"});
const MELT=t=>new Date(t).toLocaleTimeString("en-AU",{timeZone:"Australia/Melbourne",hour:"numeric",minute:"2-digit"});
const bMeta=m=>m==="GW"?"Google":m==="FW"?"Facebook":"Organic";
const META_NAME={GW:"Google Online Orders - WEB",FW:"FB Online Orders - WEB",OO:"Organic Orders",RC:"Repeat Customer",DO:"Direct order",UO:"Unknown Online",RS:"Referral SEO etc"};
function bJourney(o){if(o.js==="-")return null;const us=(o.us||"").toLowerCase(),um=(o.um||"").toLowerCase();
  if(us==="google"&&um==="cpc")return"Google";
  if(um.startsWith("tracked")||um==="paid")return"Facebook";
  return"Organic"}
const CODE_BY_ID={"24024424291":"A","24030760799":"B","24038797431":"C","24331135133":"E"};
function campCode(uc){if(!uc)return null;if(CODE_BY_ID[uc])return CODE_BY_ID[uc];
  if(uc.startsWith("Tracked_MM_Feed"))return"A";if(uc.startsWith("Tracked_MM_Sales"))return"B";if(uc.startsWith("Tracked_MM_Best"))return"C";return null}
const ORD=D.orders.map(o=>{const d=MELD(o.t);const jb=bJourney(o),mb=bMeta(o.m);
  return {...o,d,time:MELT(o.t),jb,mb,st:jb==null?"tag":(jb===mb?"match":"review")}});
const eff=o=>OV[o.n]||o.mb;
const confirmed=o=>!!OV[o.n];
const needsReview=o=>!confirmed(o)&&o.st==="review";
const gCode=o=>eff(o)==="Google"?campCode(o.uc):null;

/* ---------- ads ---------- */
const ADSROWS=D.ads;const CAMP=D.camps;
const DATES=[...new Set(ADSROWS.map(r=>r.d))].sort();
const TRACKED=["A","B","C","E"];
function adsDay(d,codes){let s=0,v=0;ADSROWS.forEach(r=>{if(r.d===d&&codes.includes(r.c)){s+=r.sp;v+=r.val}});return{s,v}}
function dayRev(d){return ORD.filter(o=>o.d===d&&eff(o)==="Google").reduce((a,o)=>a+o.a,0)}
function profitDays(){return DATES.map(d=>{const a=adsDay(d,TRACKED);const rev=BASIS==="shopify"?dayRev(d):a.v;const net=rev*NET;return{d,spend:a.s,rev,net,fixed:EXPERT_DAY,profit:net-a.s-EXPERT_DAY}})}
function campAgg(c){const rows=ADSROWS.filter(r=>r.c===c);const o={sp:0,imp:0,clk:0,conv:0,val:0};rows.forEach(r=>{o.sp+=r.sp;o.imp+=r.imp;o.clk+=r.clk;o.conv+=r.conv;o.val+=r.val});o.first=rows.length?rows[0].d:null;return o}
function campOrders(c){return ORD.filter(o=>gCode(o)===c)}
function campMetrics(c){const a=campAgg(c);const os=campOrders(c);const shop=os.reduce((s,o)=>s+o.a,0);const rev=BASIS==="shopify"?shop:a.val;
  const roas=a.sp?rev/a.sp:0;const profit=rev*NET-a.sp;
  return{...a,shop,shopN:os.length,rev,roas,profit,adsRoas:a.sp?a.val/a.sp:0,ctr:a.imp?a.clk/a.imp:0,cpc:a.clk?a.sp/a.clk:0}}
function health(m,code){if(m.sp<50)return["Hold","warn","Too little spend to judge"];
  if(m.roas>=3)return["Scale","good","ROAS "+m.roas.toFixed(1)+"x"];if(m.sp>=100&&m.roas<1.5)return["Cut","bad","ROAS "+m.roas.toFixed(1)+"x on "+fmt$(m.sp)];return["Hold","warn","ROAS "+m.roas.toFixed(1)+"x"]}

/* ---------- helpers: rings, spark ---------- */
const sc=s=>s==null?"none":s>=75?"good":s>=50?"warn":"bad";
const col=s=>s==null?"var(--none)":`var(--${sc(s)})`;
function ring(s,sz,sw,track){const r=(sz-sw)/2,c=2*Math.PI*r,v=s==null?0:s;
 return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${sw}"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${col(s)}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c*v/100} ${c}" transform="rotate(-90 ${sz/2} ${sz/2})"/></svg>`}
function spark(a,c){if(!a||a.length<2)return"";const mn=Math.min(...a),mx=Math.max(...a),n=a.length;
 const p=a.map((v,i)=>[i*(100/(n-1)),30-((v-mn)/((mx-mn)||1))*26]);
 return `<svg viewBox="0 0 100 34" preserveAspectRatio="none"><polyline points="${p.map(x=>x.join(",")).join(" ")}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`}
const pill=(t,k)=>`<span class="pill ${k}">${esc(t)}</span>`;

/* ---------- keyword gap ---------- */
const BRAND=q=>/indifeels|indi feels/.test(q), COMP=q=>/^indya$/.test(q);
function kwAction(k){if(BRAND(k.q))return["Defend","good","Brand — already #"+k.p.toFixed(1)];
  if(COMP(k.q))return["Competitor","none","Competitor brand — low priority"];
  if(k.p<=3)return["Protect","good","Strong rank; add paid only for high-margin lines"];
  if(k.p<=10&&k.i>=300)return["Paid test + title","warn","Page 1 but "+pct(k.c/k.i,1)+" CTR on "+k.i.toLocaleString()+" impressions"];
  if(k.p<=10)return["Improve title","warn","Page 1, low CTR"];
  return["New content","bad","Page 2+ — needs a collection/landing page"]}
const KW=D.gsc.map(r=>({q:r[0],c:r[1],i:r[2],p:r[3]}));

/* ---------- tiles ---------- */
const SHOP="https://admin.shopify.com/store/bvdxj3-r8/orders/";
const IT=(t,sub,body,open)=>`<details class="it" ${open?"open":""}><summary><b>${t}</b><span>${sub||""}</span></summary><div class="itb">${body}</div></details>`;
const dlt=(a,b,inv)=>{if(!isFinite(a)||!isFinite(b)||!b)return"";const x=(a-b)/Math.abs(b);const good=inv?x<0:x>0;return ` <small class="${Math.abs(x)<0.02?"":good?"up":"dn"}">${x>=0?"+":""}${Math.round(x*100)}%</small>`};
function perAgg(ds,c){const set=new Set(ds);const o={sp:0,imp:0,clk:0,conv:0,val:0};ADSROWS.forEach(r=>{if(r.c===c&&set.has(r.d)){o.sp+=r.sp;o.imp+=r.imp;o.clk+=r.clk;o.conv+=r.conv;o.val+=r.val}});
  const os=ORD.filter(x=>set.has(x.d)&&gCode(x)===c);o.n=os.length;o.shop=os.reduce((s,x)=>s+x.a,0);const rev=BASIS==="shopify"?o.shop:o.val;o.roas=o.sp?rev/o.sp:0;o.profit=rev*NET-o.sp;return o}
function perTable(n){const cur=DATES.slice(-n),prev=DATES.slice(-2*n,-n),has=prev.length===n;const cs=[...TRACKED];
  const sumA=(ds)=>{const t={sp:0,imp:0,clk:0,conv:0,val:0,n:0,shop:0,profit:0};cs.forEach(c=>{const a=perAgg(ds,c);Object.keys(t).forEach(k=>t[k]+=a[k])});const rev=BASIS==="shopify"?t.shop:t.val;t.roas=t.sp?rev/t.sp:0;return t};
  const row=(name,a,b)=>`<tr><td>${name}</td><td>${fmt$(a.sp)}${has?dlt(a.sp,b.sp,true):""}</td><td>${a.clk}${has?dlt(a.clk,b.clk):""}</td><td>${pct(a.imp?a.clk/a.imp:0,1)}</td><td>${a.clk?fmt$(a.sp/a.clk,2):"–"}</td><td>${a.conv.toFixed(0)}</td><td>${a.n}</td><td>${fmt$(a.shop)}</td><td>${a.roas.toFixed(1)}x${has?dlt(a.roas,b.roas):""}</td><td>${fmt$(a.profit)}</td></tr>`;
  const body=cs.map(c=>row(esc(CAMP[c].name.split("_Campaign")[0].slice(0,46)),perAgg(cur,c),has?perAgg(prev,c):{})).join("")+`<tr class="l0"><td><b>All tracked</b></td>${row("",sumA(cur),has?sumA(prev):{}).replace(/^<tr><td><\/td>/,"").replace(/<\/tr>$/,"")}</tr>`;
  return `<div class="tbl"><table><thead><tr><th>Campaign · ${n} days to ${DATES[DATES.length-1].slice(5)}</th><th>Spend</th><th>Clicks</th><th>CTR</th><th>CPC</th><th>Ads conv</th><th>Shopify orders</th><th>Shopify $</th><th>ROAS</th><th>Profit</th></tr></thead><tbody>${body}</tbody></table></div><p class="note">${has?"Percentages compare with the "+n+" days before.":"Only 30 days of order data are loaded, so there is no earlier period to compare."} Lifetime view needs orders back to January; not loaded yet.</p>`}
function periodIT(){return `<div class="perf" id="perbtns">${[7,15,30].map(n=>`<button data-n="${n}" class="${n===7?"on":""}">${n} days</button>`).join("")}</div><div id="pertbl">${perTable(7)}</div>`}
const LIFE=D.life;const ALLD=Object.keys(LIFE).sort();
function pStats(ds){let sp=0,cv=0,av=0,rev=0,n=0,okShop=true;
  ds.forEach(d=>{const l=LIFE[d]||[0,0,0];sp+=l[0];cv+=l[1];av+=l[2];if(d<DATES[0])okShop=false;const os=ORD.filter(o=>o.d===d&&eff(o)==="Google");rev+=os.reduce((s,o)=>s+o.a,0);n+=os.length});
  const useShop=BASIS==="shopify"&&okShop;const R=useShop?rev:av;const fee=EXPERT_DAY*ds.length;
  return{sp,cv,av,rev,n,R,fee,profit:R*NET-sp-fee,roas:sp?R/sp:0,okShop,useShop,days:ds.length}}
const arr=(a,b,inv)=>{if(!b||!isFinite(a)||!isFinite(b))return"";const x=(a-b)/Math.abs(b);const g=Math.abs(x)<0.02?"":(inv?x<0:x>0)?"up":"dn";const p=Math.abs(x)>9.99?">999%":Math.round(Math.abs(x)*100)+"%";return `<small class="${g}">${x>=0?"▲":"▼"} ${p}</small>`};
function renderPeriods(){
  const n=ALLD.length,last=ALLD[n-1];const dl=d=>{const [y,m,dd]=d.split("-").map(Number);return new Date(Date.UTC(y,m-1,dd)).toLocaleDateString("en-AU",{day:"numeric",month:"short",timeZone:"UTC"})};
  const defs=[["Yesterday","#8FA8FF",ALLD.slice(-1),ALLD.slice(-2,-1),"day before"],["Last 7 days","#B9A2FF",ALLD.slice(-7),ALLD.slice(-14,-7),"7 days before"],["Last 30 days","#2FCB9A",ALLD.slice(-30),ALLD.slice(-60,-30),"30 days before"],["Lifetime","#FF9A3D",ALLD,[],""]];
  $("#periods").innerHTML=defs.map(([t,c,ds,pv,pl])=>{const a=pStats(ds),b=pv.length===ds.length?pStats(pv):null;const cmp=b&&(a.useShop===b.useShop);
    const rv=a.useShop?"revenue":"Google revenue";
    const rev=t==="Lifetime"?pStats(ds):a;
    const note=a.useShop?`Google reports ${fmt$(a.av,0)} · ${(a.sp?a.av/a.sp:0).toFixed(2)}x · ${a.cv.toFixed(1)} conversions. Shopify matched ${a.n} order${a.n===1?"":"s"}.`:(BASIS==="shopify"?`Shopify orders are loaded for 30 days only, so this shows Google's own figures (${a.cv.toFixed(0)} conversions). Shopify match not loaded.`:`Ads-reported basis. Google counted ${a.cv.toFixed(1)} conversions.`);
    const range=ds.length===1?dl(ds[0]):dl(ds[0])+" to "+dl(ds[ds.length-1])+" 2026";
    const rvw=t==="Yesterday"?ORD.filter(o=>o.d===ds[0]&&needsReview(o)).length:0;
    return `<div class="pt"><h3 style="color:${c}">${t}</h3><div class="rg">${range}</div>
    <div class="pm"><div><b class="num">${fmt$(a.sp)}</b><i>spend</i>${cmp?arr(a.sp,b.sp,false).replace(/class="(up|dn)"/,'class="nt"'):""}</div><div><b class="num">${fmt$(a.R)}</b><i>${rv}</i>${cmp?arr(a.R,b.R):""}</div><div><b class="num">${a.roas.toFixed(2)}x</b><i>ROAS</i>${cmp?arr(a.roas,b.roas):""}</div><div><b class="num ${a.profit<0?"neg":""}">${a.profit<0?"−":""}${fmt$(Math.abs(a.profit))}</b><i>profit</i>${cmp?arr(a.profit,b.profit):""}</div></div>
    <p>${note} Profit includes ${fmt$(a.fee)} expert fee.</p>
    ${rvw?`<span class="chip2 rev">${rvw} order${rvw>1?"s":""} to review</span>`:t==="Yesterday"?`<span class="chip2 ok">No orders waiting for review</span>`:""}
    ${cmp?`<p class="nt2">Arrows compare with the ${pl}, ${dl(pv[0])}${pv.length>1?" to "+dl(pv[pv.length-1]):""}.</p>`:(t==="Lifetime"?`<p class="nt2">Since ${dl(ds[0])} 2026, the first day with tracked spend.</p>`:`<p class="nt2">No earlier Shopify orders loaded to compare.</p>`)}</div>`}).join("");
}
let TILES=[];
function build(){
  const days=profitDays();const n=days.length;
  const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
  const spend30=sum(days,d=>d.spend),rev30=sum(days,d=>d.rev),profit30=sum(days,d=>d.profit);
  const last7=days.slice(-7),prev=days.slice(0,-7);
  const spend7=sum(last7,d=>d.spend)/7,spendPrev=sum(prev,d=>d.spend)/prev.length;
  const rev7=sum(last7,d=>d.rev),prof7=sum(last7,d=>d.profit);
  const fixed30=EXPERT_DAY*n;
  const tracked=TRACKED.map(c=>({c,m:campMetrics(c)}));
  const trSpend=sum(tracked,t=>t.m.sp);
  const be=(trSpend+fixed30)/(trSpend*NET); // break-even ROAS incl. expert cost
  const roasAll=trSpend?rev30/trSpend:0;
  const cac=(()=>{const cnt=BASIS==="shopify"?ORD.filter(o=>eff(o)==="Google").length:sum(tracked,t=>t.m.conv);return cnt?trSpend/cnt:0})();
  const T=[];
  /* attribution numbers */
  const tot=ORD.length,mt=ORD.filter(o=>o.st==="match"||confirmed(o)).length,rv=ORD.filter(needsReview).length,tg=ORD.filter(o=>o.st==="tag"&&!confirmed(o)).length;
  const attrScore=Math.round(100*(mt+0.5*tg)/tot);
  const byB=b=>ORD.filter(o=>eff(o)===b);const revB=b=>byB(b).reduce((s,o)=>s+o.a,0),allRev=ORD.reduce((s,o)=>s+o.a,0);
  /* Ads vs Shopify */
  const adsConv=sum(tracked,t=>t.m.conv),adsVal=sum(tracked,t=>t.m.val);
  const shopCpc=ORD.filter(o=>o.jb==="Google");const shopCpcRev=shopCpc.reduce((s,o)=>s+o.a,0);
  const ga=D.ga4;const gpaid=ga.filter(r=>r.ch==="Paid Search"||r.ch==="Cross-network");
  const gaP=gpaid.reduce((a,r)=>({s:a.s+r.s,atc:a.atc+r.atc,co:a.co+r.co,p:a.p+r.p,rev:a.rev+r.rev}),{s:0,atc:0,co:0,p:0,rev:0});
  const site=ga.reduce((a,r)=>({s:a.s+r.s,atc:a.atc+r.atc,co:a.co+r.co,p:a.p+r.p,rev:a.rev+r.rev}),{s:0,atc:0,co:0,p:0,rev:0});
  const nt=campMetrics("D");

  /* 1. PROFIT */
  T.push({id:"profit",step:2,prio:1,w:10,t:"Net Profit",
   s:Math.round(clamp(50+(profit30/n)*1.5)),k:fmt$(profit30/n),kl:"avg profit / day · 30d · "+(BASIS==="shopify"?"Shopify-confirmed":"Ads-reported"),src:"Google Ads + Shopify",
   trend:days.slice(-14).map(d=>d.profit),att:profit30<0?["bad","Losing money"]:["g","Profitable"],
   stats:[["30-day profit",fmt$(profit30),"after ads and expert cost"],["Last 7 days",fmt$(prof7),(prof7/7>=profit30/n?"better":"worse")+" than 30d pace"],["Tracked spend",fmt$(spend30),fmt$(spend30/n,0)+"/day"],["Expert cost",fmt$(fixed30),"$155/week"]],
   acts:[
    profit30<0&&BASIS==="shopify"?["b","On Shopify-confirmed online orders alone, Google is "+fmt$(Math.abs(profit30))+" under after the expert cost. Calls and store visits (about 70% of revenue) are NOT in this number yet — add them before cutting spend."]:null,
    ["w","Switch the basis at the top of the profit chart to compare Shopify-confirmed revenue with what Google Ads reports ("+fmt$(adsVal)+" vs "+fmt$(shopCpcRev)+")."],
    ["","Profit = revenue ÷ 1.1 (GST) × 0.75 (product cost) − tracked ad spend − $155/week expert cost. Non-tracked PMax spend ("+fmt$(nt.sp)+") is excluded here."]
   ],how:"Score: $0 profit/day = 50; +$33/day = 100; −$33/day = 0. Adjust the target once you set one."});

  /* 2. SPEND & PACING */
  const jump=spendPrev?spend7/spendPrev-1:0;
  const e0=ADSROWS.filter(r=>r.c==="E").map(r=>r.d).sort()[0];
  T.push({id:"spend",step:2,prio:2,w:8,t:"Spend & Pacing",
   s:Math.round(clamp(100-80*Math.max(0,jump/1.5))),k:fmt$(spend7,0)+"/day",kl:"avg tracked spend, last 7 days",src:"Google Ads",
   trend:days.slice(-14).map(d=>d.spend),att:jump>0.5?["bad","Spend +"+Math.round(jump*100)+"%"]:["g","Steady"],
   stats:[["Last 7 days",fmt$(spend7*7),fmt$(spend7,0)+"/day"],["Before that",fmt$(spendPrev,0)+"/day","first "+prev.length+" days"],["Change",(jump>=0?"+":"")+Math.round(jump*100)+"%",""],["30-day tracked",fmt$(spend30),""]],
   acts:[
    jump>0.5?["b","Daily spend jumped from "+fmt$(spendPrev,0)+" to "+fmt$(spend7,0)+" (+"+Math.round(jump*100)+"%). The Dussehra Performance Max campaign started "+(e0||"").slice(5).replace("-","/")+" and the existing PMax campaigns also ramped. Revenue in the last 7 days: "+fmt$(rev7)+" vs spend "+fmt$(spend7*7)+"."]:null,
    ["w","No monthly budget is stored yet, so pacing can't be scored against a plan. Give me the monthly Google budget and this tile will show % used and days left."]
   ],how:"Score drops as the last-7-day daily spend rises above the earlier average (−80 points at +150%)."});

  /* 3. CAMPAIGN HEALTH (tree) */
  const ranked=[...tracked].sort((a,b)=>b.m.profit-a.m.profit);
  ranked.forEach((t,i)=>t.rank=i+1);
  const hh=ranked.map(t=>({...t,h:health(t.m,t.c)}));
  const wScore={Scale:100,Hold:60,Cut:10};
  const campScore=Math.round(sum(hh,t=>wScore[t.h[0]]*t.m.sp)/(sum(hh,t=>t.m.sp)||1));
  const cuts=hh.filter(t=>t.h[0]==="Cut"),scales=hh.filter(t=>t.h[0]==="Scale");
  function campTree(){
    let rows="";
    const head=`<tr><th>Campaign / ad group / ad</th><th>Health</th><th>Spend</th><th>Clicks</th><th>CTR</th><th>CPC</th><th>Ads conv</th><th>Ads value</th><th>Shopify orders</th><th>Shopify $</th><th>ROAS</th><th>Profit</th><th>Search IS</th></tr>`;
    hh.forEach(t=>{const m=t.m,c=CAMP[t.c];const k="c"+t.c;
      const is7=impW(t.c,"is");

function bindTables(root){
 root.querySelectorAll(".tg2").forEach(tr=>tr.onclick=e=>{if(e.target.closest("button"))return;const k=tr.dataset.k;const open=!tr.classList.contains("open");tr.classList.toggle("open",open);
   const hide=(key)=>{root.querySelectorAll(`[data-p="${key}"]`).forEach(c=>{c.hidden=true;if(c.dataset.k){c.classList.remove("open");hide(c.dataset.k)}})};
   if(open)root.querySelectorAll(`[data-p="${k}"]`).forEach(c=>c.hidden=false);else hide(k)});
 /* initial open state */
 root.querySelectorAll(".tg2.open").forEach(tr=>root.querySelectorAll(`[data-p="${tr.dataset.k}"]`).forEach(c=>{c.hidden=false}));
 root.querySelectorAll(".cf button").forEach(b=>b.onclick=e=>{e.stopPropagation();if(b.dataset.b)OV[b.dataset.o]=b.dataset.b;else delete OV[b.dataset.o];saveOV();refresh(true)});
 const pb=root.querySelector("#perbtns");if(pb)pb.querySelectorAll("button").forEach(b=>b.onclick=()=>{pb.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));root.querySelector("#pertbl").innerHTML=perTable(+b.dataset.n)});
 const rf=root.querySelector("#revf");if(rf)rf.querySelectorAll("button").forEach(b=>b.onclick=()=>{rf.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
   const tb=root.querySelector("#agrid tbody");if(b.dataset.f==="review"){tb.querySelectorAll("tr").forEach(r=>{r.hidden=true});
     tb.querySelectorAll("tr.ord").forEach(r=>{if(r.querySelector(".chip2.rev")||r.querySelector(".chip2.tag")){r.hidden=false;let p=r.dataset.p;while(p){const par=tb.querySelector(`[data-k="${p}"]`);if(!par)break;par.hidden=false;par.classList.add("open");p=par.dataset.p}}})}
   else{tb.querySelectorAll("tr").forEach(r=>{r.hidden=!!r.dataset.p});tb.querySelectorAll(".tg2").forEach(r=>r.classList.remove("open"));const first=tb.querySelector(".l0.tg2");if(first){first.classList.add("open");tb.querySelectorAll(`[data-p="${first.dataset.k}"]`).forEach(c=>c.hidden=false)}}})}
function openTile(id,scroll){
 document.querySelectorAll(".xp").forEach(x=>x.remove());
 const tiles=[...document.querySelectorAll(".tile")];tiles.forEach(t=>t.setAttribute("aria-expanded","false"));
 if(openId===id&&!scroll){openId=null;return}
 openId=id;const el=tiles.find(t=>t.dataset.id===id);if(!el)return;el.setAttribute("aria-expanded","true");
 const t=TILES.find(x=>x.id===id);
 const cols=getComputedStyle($("#grid")).gridTemplateColumns.split(" ").length;
 /* find last tile in same visual row */
 const top=el.offsetTop;let end=el;tiles.forEach(x=>{if(Math.abs(x.offsetTop-top)<4)end=x});
 const xp=document.createElement("div");xp.className="xp";
 const stats=(t.stats||[]).length?`<div class="stats">${t.stats.map(s=>`<div class="sx"><div class="l">${esc(s[0])}</div><div class="v num">${esc(String(s[1]))}</div><div class="p">${esc(s[2]||"")||"&nbsp;"}</div></div>`).join("")}</div>`:"";
 const bars=t.bars?`<div class="blk"><h4>Share of revenue</h4>${t.bars.map(b=>`<div class="row"><span class="nm">${esc(b[0])}</span><span class="tr2"><i style="width:${Math.round(b[1]*100)}%;background:var(${b[2]})"></i></span><span class="val">${Math.round(b[1]*100)}%</span></div>`).join("")}</div>`:"";
 const acts=t.acts.length?`<div class="blk"><h4>${t.s==null?"What's needed":"Do this next"}</h4><ul class="acts">${t.acts.map(a=>`<li class="${a[0]}">${a[1]}</li>`).join("")}</ul></div>`:"";
 const body=t.html?`<div class="blk"><h4>Detail</h4>${t.html()}</div>`:"";
 xp.innerHTML=`<div class="inner"><div class="pad">
  <div class="sh"><div class="ring ${t.s==null?"null":""}" style="color:${col(t.s)}">${ring(t.s,76,8,"var(--line)")}<div class="v num">${t.s==null?"–":t.s}</div></div><h3><small>${esc(STEPS[t.step][0])} · step ${t.step} · priority #${t.prio} · ${esc(t.src)}</small>${esc(t.t)}</h3><button class="x" aria-label="Close">✕</button></div>
  ${stats}${bars}${acts}${body}<div class="how">${esc(t.how)}</div></div></div>`;
 end.after(xp);xp.querySelector(".x").onclick=()=>openTile(id);bindTables(xp);
 requestAnimationFrame(()=>{xp.classList.add("on");if(scroll)setTimeout(()=>xp.scrollIntoView({behavior:"smooth",block:"start"}),60)});
}
function refresh(keepOpen){const keep=keepOpen?openId:null;build();renderHero();renderProfit();renderGrid();openId=null;if(keep)openTile(keep)}
$("#sortseg").querySelectorAll("button").forEach(b=>b.onclick=()=>{sortMode=b.dataset.s;$("#sortseg").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));openId=null;renderGrid()});
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("gts-theme",t)}catch(e){}}
let th="dark";try{th=localStorage.getItem("gts-theme")||"dark"}catch(e){}
document.documentElement.dataset.theme=th;
$("#theme").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
refresh();
</script></body></html>
