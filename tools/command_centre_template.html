<title>Indifeels Command Centre</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: sticky top bar, then one screen per node (home tiles, sub-tiles, detail), plus a separate Connections map screen */
:root{
  --bg:#22252a; --panel:#1b1e22; --tile:#262a2f; --tile2:#2f343a; --line:#3a4047;
  --ink:#eceff2; --mute:#9ba4ae; --accent:#2bb5a5;
  --g:#3dbb8a; --y:#d9a23b; --o:#e8803a; --r:#e5534b; --info:#5a9be0;
  --shadow:inset 0 -3px 0 rgba(0,0,0,.65),inset 1px 0 0 rgba(255,255,255,.05),0 2px 3px rgba(0,0,0,.6),0 12px 22px rgba(0,0,0,.5),0 26px 40px rgba(0,0,0,.35);
  --tile-grad:linear-gradient(145deg,#1d1f23 0%,#0c0d0f 50%,#050506 100%); --tile-hi:rgba(255,255,255,.13);
  --display:"Space Grotesk",system-ui,sans-serif; --body:Inter,system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-theme="dark"]{ color-scheme:dark }
:root[data-theme="light"]{
  --bg:#eceff2; --panel:#ffffff; --tile:#ffffff; --tile2:#f1f3f5; --line:#d5dade;
  --ink:#1d2227; --mute:#5f6b76; --accent:#0f8f82;
  --g:#1f9d6e; --y:#b57f14; --o:#d4691f; --r:#d23f37; --info:#2f73c0;
  --shadow:0 4px 14px rgba(20,30,40,.08);
  --tile-grad:linear-gradient(335deg,#ffffff 0%,#eef1f3 100%); --tile-hi:rgba(255,255,255,0);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);padding-block:0 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;
  gap:10px 14px;align-items:center;justify-content:space-between;padding:12px 0}
.tabs{display:flex;gap:6px}
.tabs a,.btn{padding:6px 12px;border-radius:8px;background:transparent;border:1px solid var(--line);color:var(--mute)}
.tabs a.on{background:var(--tile2);color:var(--ink);border-color:var(--tile2)}
.btn{background:var(--tile)}
.right{display:flex;gap:8px;align-items:center}
.draft{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--y);border:1px solid var(--y);border-radius:999px;padding:2px 8px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;color:var(--mute);font-size:13px;min-width:0}
.crumbs a:hover{color:var(--ink)} .crumbs b{color:var(--ink);font-weight:500}
h1{font:600 clamp(26px,5vw,38px)/1.1 var(--display);margin:18px 0 4px;text-wrap:balance}
.sub{color:var(--mute);margin:0 0 18px}
.h2{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:28px 0 10px}
.grid{display:grid;gap:12px}
.grid.cats{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.grid.subs{grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
@media(min-width:760px){.grid.cats{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;display:block;background:var(--tile-grad);border:1px solid transparent;border-radius:14px;padding:16px;
  box-shadow:inset 0 1px 0 var(--tile-hi),var(--shadow);transition:transform .15s,border-color .15s;min-width:0}
.left{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn:disabled{opacity:.35;cursor:default}
.freq{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 16px}
.fq{display:inline-flex;gap:10px;align-items:center;padding:9px 14px;border-radius:10px;background:var(--tile-grad);font-weight:500;
  box-shadow:inset 0 1px 0 var(--tile-hi),inset 0 -2px 0 rgba(0,0,0,.6),0 3px 5px rgba(0,0,0,.4),0 10px 16px rgba(0,0,0,.3);transition:transform .15s}
.fq:hover{transform:translateY(-2px)}
.fq:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fq b{color:var(--rc,var(--mute));font:700 14px var(--display);font-variant-numeric:tabular-nums}
.lnk{background:none;border:0;color:var(--mute);text-decoration:underline;font-size:11px;letter-spacing:0;text-transform:none;margin-left:8px;padding:0}
a.tile:hover{transform:translateY(-4px);box-shadow:inset 0 1px 0 var(--tile-hi),inset 0 -3px 0 rgba(0,0,0,.65),0 4px 6px rgba(0,0,0,.55),0 22px 36px rgba(0,0,0,.55)}
.tile.overall{display:flex;gap:20px;align-items:center;margin-bottom:12px}
.tile.overall .big{font:700 clamp(20px,3vw,26px)/1.15 var(--display)}
.sevs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sevb{padding:5px 14px;border-radius:999px;border:1px solid currentColor;background:transparent;font-weight:500;transition:background .15s}
.sevb:hover{background:color-mix(in srgb,currentColor 12%,transparent)}
.sevb.on{background:color-mix(in srgb,currentColor 22%,transparent)}
.sevb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sevb.red{color:var(--r)} .sevb.yel{color:var(--y)} .sevb.grn{color:var(--g)} .sevb.clr{color:var(--mute);border-color:var(--line)}
a.tile:focus-visible,.btn:focus-visible,.tabs a:focus-visible,[data-sel]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile .go{position:absolute;right:14px;top:12px;color:var(--mute);font-size:20px;line-height:1}
.tile.cat{display:flex;flex-direction:column;gap:14px;min-height:230px}
.tile.cat .top{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.tile.cat .nm{font:700 clamp(22px,3.4vw,28px)/1.1 var(--display);text-wrap:balance}
.tile.cat .top>div{min-width:0}
.alerts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
.alerts li{display:flex;gap:8px;align-items:baseline}
.alerts li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:currentColor;transform:translateY(-1px)}
.alerts .red{color:var(--r)} .alerts .yel{color:var(--y)} .alerts .grn{color:var(--g)} .alerts .none{color:var(--mute);font-weight:400}
.alerts .more{color:var(--mute);font-weight:400;font-size:12px} .alerts .more::before{display:none}
.tile.cat .go{top:auto;bottom:12px}
.tile.sub{display:flex;gap:14px;align-items:center}
.tile.sub .nm{font:600 15px/1.25 var(--display);padding-right:14px}
.tile.plan{background:transparent;box-shadow:none;border-style:dashed;border-color:var(--line)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.mute{color:var(--mute)} .small{font-size:12px}
.prev{color:var(--mute);font-size:12px;line-height:1.4;margin-top:auto}
.chip{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--tile2);color:var(--mute);white-space:nowrap}
.chip.live{color:var(--g);background:color-mix(in srgb,var(--g) 14%,transparent)}
.chip.part{color:var(--y);background:color-mix(in srgb,var(--y) 14%,transparent)}
.chip.shared{color:var(--info);background:color-mix(in srgb,var(--info) 14%,transparent)}
.ring{position:relative;width:var(--s);height:var(--s);flex:none}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font:700 calc(var(--s)*.32)/1 var(--display);font-variant-numeric:tabular-nums}
.ring.none .num{color:var(--mute);font-weight:500}
.g{--rc:var(--g)} .y{--rc:var(--y)} .o{--rc:var(--o)} .r{--rc:var(--r)}
.hero{display:flex;gap:18px;align-items:center;margin:10px 0 4px}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:18px 0 12px}
.vsep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.filters button{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mute)}
.filters button.on{background:var(--tile2);color:var(--ink)}
.cols{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.card h3{margin:0 0 8px;font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.rel{display:flex;gap:8px;padding:8px 0;border-top:1px solid var(--line);align-items:baseline}
.rel:first-of-type{border-top:0}
.rel .ar{color:var(--accent);flex:none}
.rel a{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.rel a:hover{text-decoration-color:var(--accent)}
details.card summary{cursor:pointer;font-weight:500}
.feeds{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.feeds .card{padding:12px 14px}
.feeds b{display:block;font-weight:600;margin-bottom:2px}
.note{color:var(--mute);font-size:12px;margin-top:22px}
.mapbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox text{fill:var(--ink);font-family:var(--body)}
.mapbox .nmt{font-size:13px;font-weight:600}
.mapbox .sct{font-size:11px;fill:var(--mute)}
.mapbox .nd rect{fill:var(--tile);stroke:var(--line);stroke-width:1}
.mapbox .nd.sel rect{stroke:var(--accent);stroke-width:2}
.mapbox .nd{cursor:pointer}
.mapbox .edge{fill:none;stroke:var(--mute);stroke-opacity:.35}
.mapbox .edge.out{stroke:var(--accent);stroke-opacity:1}
.mapbox .edge.in{stroke:var(--o);stroke-opacity:1}
.mapbox .cnt{fill:var(--bg);stroke:var(--line)}
.mapbox .cntt{font-size:10px;font-weight:600;text-anchor:middle}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:10px 2px;color:var(--mute);font-size:12px}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
@media(prefers-reduced-motion:reduce){.tile{transition:none}}
.quest{display:flex;flex-direction:column;gap:14px;margin-bottom:12px}
.quest .qtop{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.lvl{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;flex:none;background:radial-gradient(circle at 30% 25%,#34383e,#0a0b0d);box-shadow:inset 0 0 0 2px var(--y),0 6px 14px rgba(0,0,0,.5);font:700 24px var(--display);color:var(--y)}
.lvl small{display:block;font:600 9px var(--body);letter-spacing:.1em;color:var(--mute);margin-top:-2px;text-align:center}
.xpbar{height:10px;border-radius:99px;background:rgba(0,0,0,.45);box-shadow:inset 0 1px 2px rgba(0,0,0,.7);overflow:hidden;margin:6px 0 2px}
.xpbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--g));transition:width .5s}
.path{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--display);border:0;background:var(--tile2);color:var(--mute);box-shadow:0 2px 4px rgba(0,0,0,.5)}
.pn.done{background:var(--g);color:#06140e}
.pn.now{background:var(--y);color:#1a1200;box-shadow:0 0 0 3px color-mix(in srgb,var(--y) 35%,transparent),0 2px 4px rgba(0,0,0,.5)}
.pn:focus-visible,.go-btn:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nowm{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line)}
.nowm .t{font:600 18px/1.25 var(--display);text-wrap:balance}
.go-btn{padding:9px 18px;border-radius:10px;border:0;background:var(--y);color:#1a1200;font-weight:600;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 3px 6px rgba(0,0,0,.4)}
.go-btn:disabled{opacity:.4;cursor:default}
.xp{color:var(--y);font:700 13px var(--display)}
.qcard{background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.qcard.ok{border-color:color-mix(in srgb,var(--g) 55%,var(--line))}
.qcard .qq{font-weight:600;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.opt.on{background:var(--accent);border-color:var(--accent);color:#04201c}
.opt.park{color:var(--mute);border-style:dashed}
.opt.park.on{background:var(--tile2);color:var(--ink);border-color:var(--mute)}
.qin{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
.qin:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.qchip{color:var(--y);background:color-mix(in srgb,var(--y) 14%,transparent)}
.why{color:var(--mute);margin:6px 0 14px;max-width:70ch}
.pop{display:inline-block;animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.pop{animation:none}.xpbar i{transition:none}}
textarea.out{width:100%;min-height:140px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:12px/1.5 ui-monospace,monospace}
.opt.mic{border-color:var(--accent);color:var(--accent)}
.opt.mic.rec{background:var(--r);border-color:var(--r);color:#fff}
.lang{display:flex;gap:6px;align-items:center;margin:0 0 10px;flex-wrap:wrap}
.prog{display:flex;gap:16px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.pbar{height:10px;border-radius:99px;background:rgba(0,0,0,.45);box-shadow:inset 0 1px 2px rgba(0,0,0,.7);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--g));transition:width .6s}
.pbar.y i{background:linear-gradient(90deg,var(--y),#e8b84a)}
.prow{display:grid;grid-template-columns:18px 1fr 52px;gap:6px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.decn{display:inline-block;min-width:18px;margin-left:6px;padding:0 6px;border-radius:99px;background:var(--r);color:#fff;font:700 11px/18px var(--display);text-align:center}
.dcard{margin-bottom:12px}.dcard .dh{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.dcard .dt{font:700 16px/1.3 var(--display);margin:4px 0}.dcard .dd{margin:6px 0;font-size:14px}.dcard .dd b{color:var(--mute);font-weight:600}
.dact{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.dact button{min-height:44px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--tile2);color:var(--fg);font:700 14px var(--display);cursor:pointer}
.dact button.ok{background:var(--g);color:#06140a;border-color:transparent}.dact button[disabled]{opacity:.5;cursor:default}
.chip.rlow{color:var(--g);background:color-mix(in srgb,var(--g) 14%,transparent)}.chip.rapp{color:var(--y);background:color-mix(in srgb,var(--y) 14%,transparent)}
.prow .pb{grid-column:2/4}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mute)}
.dot.done{background:var(--g)} .dot.doing{background:var(--y);box-shadow:0 0 0 3px color-mix(in srgb,var(--y) 30%,transparent)} .dot.blocked{background:var(--r)}
.live{color:var(--g);font-size:11px}
</style>

<div class="wrap">
  <div class="bar">
    <div class="left"><nav class="tabs" aria-label="Views"><a id="tab-home" href="#home">Tiles</a><a id="tab-map" href="#map">Connections</a><a id="tab-dec" href="#decisions">Decisions<span id="decn" class="decn" hidden></span></a><a id="tab-prog" href="#progress">Progress</a></nav></div>
    <div class="right"><span class="draft">Draft · sample scores</span><button class="btn" id="theme" type="button" aria-label="Switch light or dark theme">Theme</button></div>
  </div>
  <div id="app"></div>
</div>

<script>
/* ---------- data ---------- */
const CATS=[['sales','Sales & Finance'],['stock','Stock & Supply'],['marketing','Marketing'],['web','Website & SEO'],
 ['customers','Customers & Service'],['local','Stores & Local'],['growth','Growth & Planning'],['admin','Admin & Automation']];
const N={}; const order=[];
CATS.forEach(([id,name])=>{N[id]={id,name,cat:true,parents:[],src:[],st:'cat',desc:''};order.push(id)});
function n(id,name,st,score,parents,src,rep,desc){N[id]={id,name,st,score,parents,src:src||[],rep:rep||'',desc:desc||''};order.push(id)}
const SH='Shopify',WI='Windsor.ai',SX='Semrush (scheduled email export)',SU='Supabase',MN='Manual upload',TC='tools-to-connect';

/* Sales & Finance */
n('profit-flow','Profit Flow','live',78,['sales'],[SH,WI],'Reports hub › Sales Analysis › Profit Flow','Sold, spend and what you keep per $100, by day, week or month.');
n('cash-report','Cash Report','live',85,['sales'],[SH],'Reports hub › Sales Analysis › Cash Report','Cash-paid orders since 18 Apr, refreshed after every order.');
n('order-attribution','Order Attribution','live',62,['sales','marketing','auto-opt'],[SH],'Reports hub › Sales Analysis › Order Attribution','Orders tagged Google, Facebook or Organic from the order source field.');
n('channels','Channels (18)','plan',null,['sales','marketing'],[SH,WI],'','Sales and spend across all 18 channels.');
n('pl-monthly','Monthly P&L','plan',null,['sales'],[SH,WI,MN],'','Revenue, product cost, ads, fees, shipping and returns by month.');
n('cash-flow','Cash Flow & Runway','plan',null,['sales'],[SH,MN],'','Money in and out by week, and months of runway before festival buying.');
n('gst-bas','GST & BAS','plan',null,['sales',TC],['Xero','Shopify Tax'],'','GST collected and BAS-ready figures.');
n('expenses','Expenses','plan',null,['sales'],[MN],'','Fixed and variable costs from an uploaded list.');
n('margin-poas','Margin & POAS','plan',null,['sales','marketing'],[SH,WI],'','Profit on ad spend per product and per channel.');
n('pricing','Pricing Strategy','plan',null,['sales','stock'],[SH,MN],'','Prices, floors and where you sit against competitors.');
n('sale-planner','Sale & Festival Calendar','plan',null,['sales','marketing','growth'],[SH],'','When to run big and seasonal sales.');
n('clearance','Clearance Funnel','plan',null,['sales','stock'],[SH],'','Rule-based markdowns for stock that is not selling: 30, 60 and 90 day steps.');
n('landed-cost','Landed Cost & AUD/INR','plan',null,['sales','stock'],[MN],'','Cost price, freight, duty and exchange rate per unit.');
n('seasonality','Sales Seasonality','plan',null,['sales','customers','marketing','growth'],[SH],'','Which products sell in which months and festivals.');

/* Stock & Supply */
n('restock','Restock Planner','live',71,['stock','auto-opt'],[SH,SU],'Reports hub › Stock Management › Restock Planner','Order list, packing, shipped, order boxes and PDF orders.');
n('supplier-portal','Supplier Portal','live',80,['stock'],[SU],'Reports hub › Supplier Portal','Suppliers add to boxes and ship.');
n('stock-take','Stock Take','live',74,['stock'],[SH,SU],'Reports hub › Stock Management › Stock Take','Counts, add or remove, bulk transfer, history.');
n('barcodes','Barcodes & Labels','live',76,['stock'],[SH],'Reports hub › Stock Management › Stock Take › Barcodes','Print labels and receive boxes.');
n('procurement','Procurement','live',58,['stock'],[SH,SX,'Search Console'],'Reports hub › Stock Management › Procurement','Demand by category versus options in stock.');
n('stock-health','Stock Health','live',66,['stock','sales'],[SH],'Reports hub › Stock Management › Restock Planner','Stock health % against a target of 90.');
n('dead-stock','Dead & Excess Stock','part',45,['stock','sales'],[SH],'Reports hub › Sales Analysis › Profit Flow','Not-eligible stock value and clear-out candidates.');
n('size-colour','Size & Colour Gaps','part',52,['stock'],[SH,SX],'Reports hub › Stock Management › Procurement','Sizes and colours sold versus in stock.');
n('eligibility','Stock Eligibility','part',70,['stock','sales','auto-opt'],[SH],'Reports hub › Sales Analysis › Profit Flow','Eligible versus not-eligible stock value.');
n('velocity','Product Velocity (A/B/C/D)','plan',null,['stock'],[SH],'','Fast and slow sellers by days to sell one unit.');
n('supplier-score','Supplier Scorecard','plan',null,['stock'],[SU],'','Lead time, defects and fill rate per supplier.');
n('shipping','Shipping & Couriers','plan',null,['stock',TC],['Shippit','Sendle','Australia Post'],'','Fulfilment time, cost and delays.');
n('returns','Returns & QA','plan',null,['stock','customers'],[SH],'','Return rate and reasons by product and supplier.');
n('catalog','Catalogue Quality','part',40,['stock','site-health'],[SH],'Reports hub › Stock Management › Colour Tagging Game','Missing colours, photos and product data.');
n('photo','Photography & Content','plan',null,['stock'],[MN],'','Photos, size charts and descriptions per product.');

/* Marketing */
n('google-ads','Google Ads','part',null,['marketing'],[WI],'','Campaign settings, signals and results.');

/* ---------- helpers ---------- */
const kids={}; order.forEach(id=>N[id].parents.forEach(p=>(kids[p]=kids[p]||[]).push(id)));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function leaves(id){ if(!kids[id]) return [id]; const s=new Set(); kids[id].forEach(k=>leaves(k).forEach(x=>s.add(x))); return [...s]; }
function sub(id,s=new Set()){ s.add(id); (kids[id]||[]).forEach(k=>sub(k,s)); return s; }
function root(id){ while(N[id].parents.length) id=N[id].parents[0]; return id; }
function score(id){ if(!kids[id]) return N[id].score; const v=leaves(id).map(l=>N[l].score).filter(x=>x!=null); return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null; }
function counts(id){ const ls=leaves(id); const b=ls.filter(l=>N[l].st!=='plan').length; return {built:b,plan:ls.length-b}; }
const band=s=>s==null?'':s>=80?'g':s>=60?'y':s>=40?'o':'r';
function ring(s,size,sw){
  const r=(size-sw)/2,c=2*Math.PI*r;
  if(s==null) return `<div class="ring none" style="--s:${size}px"><svg width="${size}" height="${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${sw}" stroke-dasharray="3 5"/></svg><span class="num">–</span></div>`;
  return `<div class="ring ${band(s)}" style="--s:${size}px"><svg width="${size}" height="${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--tile2)" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--rc)" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c*s/100} ${c}"/></svg><span class="num" aria-label="Score ${s} out of 100">${s}</span></div>`;
}
const stChip=st=>st==='live'?'<span class="chip live">Live</span>':st==='part'?'<span class="chip part">Partial</span>':'<span class="chip">Planned</span>';
const nl=id=>`<a href="#${id}">${esc(N[id].name)}</a>`;
function linksFor(id){ const S=sub(id); return {out:L.filter(l=>S.has(l[0])&&!S.has(l[1])), inn:L.filter(l=>S.has(l[1])&&!S.has(l[0]))}; }
function sortKids(ids){ const w={live:0,part:1,plan:2}; return ids.slice().sort((a,b)=>{const sa=kids[a]?'part':N[a].st, sb=kids[b]?'part':N[b].st; return w[sa]-w[sb]||order.indexOf(a)-order.indexOf(b)}); }

function mapView(){
  const narrow=matchMedia('(max-width:640px)').matches;
  const W=narrow?400:820, H=narrow?720:540, cx=W/2, cy=H/2, rx=narrow?138:318, ry=narrow?290:205, hw=narrow?58:76, hh=narrow?25:27;
  const outer=CATS.map(c=>c[0]).filter(x=>x!=='marketing'); const P={marketing:{x:cx,y:cy}};
  outer.forEach((id,i)=>{const a=(-90+i*360/outer.length)*Math.PI/180; P[id]={x:cx+rx*Math.cos(a),y:cy+ry*Math.sin(a)}});
  const agg={}; L.forEach(l=>{const a=root(l[0]),b=root(l[1]); if(a===b) return; const k=a+'>'+b; agg[k]=(agg[k]||0)+1;});
  const edge=(p,q)=>{const dx=q.x-p.x,dy=q.y-p.y,s=Math.min((hw+5)/Math.abs(dx||1e-9),(hh+5)/Math.abs(dy||1e-9),1);return{x:p.x+dx*s,y:p.y+dy*s}};
  let paths='',labels='';
  Object.entries(agg).sort((a,b)=>{const hi=k=>k.split('>').includes(mapSel)?1:0;return hi(a[0])-hi(b[0])}).forEach(([k,v])=>{
    const [a,b]=k.split('>'), p=P[a], q=P[b], s=edge(p,q), e=edge(q,p);
    const dx=e.x-s.x, dy=e.y-s.y, len=Math.hypot(dx,dy)||1, mx=(s.x+e.x)/2, my=(s.y+e.y)/2;
    const c={x:mx-dy/len*len*0.14, y:my+dx/len*len*0.14};
    const cls=a===mapSel?'out':b===mapSel?'in':'';
    paths+=`<path class="edge ${cls}" d="M${s.x.toFixed(1)} ${s.y.toFixed(1)} Q${c.x.toFixed(1)} ${c.y.toFixed(1)} ${e.x.toFixed(1)} ${e.y.toFixed(1)}" stroke-width="${(1+v*0.9).toFixed(1)}" marker-end="url(#ah${cls||'n'})"/>`;
    if(cls){const lx=.25*s.x+.5*c.x+.25*e.x, ly=.25*s.y+.5*c.y+.25*e.y; labels+=`<circle class="cnt" cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="9"/><text class="cntt" x="${lx.toFixed(1)}" y="${(ly+3.5).toFixed(1)}">${v}</text>`;}
  });
  const nodes=CATS.map(([id,name])=>{const p=P[id],s=score(id); const nm=name.length>(narrow?15:20)&&narrow?name.replace(' & ',' & ').slice(0,15)+'…':name;
    return `<g class="nd ${id===mapSel?'sel':''}" data-sel="${id}" tabindex="0" role="button" aria-label="${esc(name)}"><rect x="${p.x-hw}" y="${p.y-hh}" width="${hw*2}" height="${hh*2}" rx="10"/>
     <text class="nmt" x="${p.x-hw+10}" y="${p.y-2}">${esc(narrow&&name.length>14?name.split(' ').slice(0,2).join(' '):name)}</text>
     <text class="sct" x="${p.x-hw+10}" y="${p.y+14}">${s==null?'no score yet':s+' / 100'}</text></g>`;}).join('');
  const mk=(id,col)=>`<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:${col}"/></marker>`;
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Arrows between the eight areas"><defs>${mk('ahn','var(--mute)')}${mk('ahout','var(--accent)')}${mk('ahin','var(--o)')}</defs>${paths}${labels}${nodes}</svg>`;
  const {out,inn}=linksFor(mapSel), nm=N[mapSel].name;
  const rows=(arr,dir)=>arr.map(l=>`<div class="rel"><span class="ar" style="color:${dir==='out'?'var(--accent)':'var(--o)'}">${dir==='out'?'→':'←'}</span><span>${nl(l[0])} → ${nl(l[1])} <span class="mute">· ${esc(l[2])}</span></span></div>`).join('')||'<div class="mute">None yet.</div>';
  return `<h1>Connections</h1><p class="sub">Tap an area to see what feeds it and what it feeds. Numbers are how many links run along an arrow.</p>
   <div class="filters" style="margin:0 0 12px">${navBtns()}</div>
   <div class="mapbox">${svg}</div>
   <div class="legend"><span><i style="background:var(--accent)"></i>${esc(nm)} feeds</span><span><i style="background:var(--o)"></i>feeds ${esc(nm)}</span><span><i style="background:var(--mute);opacity:.5"></i>other links</span></div>
   <div class="cols"><div class="card"><h3>${esc(nm)} feeds</h3>${rows(out,'out')}</div><div class="card"><h3>Feeds ${esc(nm)}</h3>${rows(inn,'in')}</div></div>
   <p style="margin-top:14px"><a class="btn" href="#${mapSel}">Open ${esc(nm)} tiles</a></p>`;
}

/* ---------- routing ---------- */
function draw(){
  stopRec();
  const isMap=curId==='map', isProg=curId==='progress', isDec=curId==='decisions';
  document.getElementById('tab-map').classList.toggle('on',isMap);
  document.getElementById('tab-home').classList.toggle('on',!isMap&&!isProg&&!isDec);
  document.getElementById('tab-dec').classList.toggle('on',isDec);
  document.getElementById('tab-prog').classList.toggle('on',isProg);
  app.innerHTML=isMap?mapView():isProg?progressView():isDec?decisionsView():(MIS[curId]?missionView(curId):N[curId]?nodeView(curId):homeView());
  updateNav();
}
let fwdStack=[], navKind=null;
let cur=''; try{cur=decodeURIComponent((location.hash||'').slice(1));}catch(e){}
function nav(h){ cur=h; try{ if(window.top===window) history.replaceState(null,'','#'+h); }catch(e){} route(); }
function backTarget(){ if(!curId||curId==='home') return null; if(curId==='map'||curId==='progress'||curId==='decisions'||MIS[curId]) return 'home'; return trail.length>1?trail[trail.length-2]:'home'; }
function updateNav(){}
function navBtns(){ return `<button type="button" class="btn" data-nav="back" aria-label="Back one level" ${backTarget()?'':'disabled'}>‹ Back</button><button type="button" class="btn" data-nav="fwd" aria-label="Forward" ${fwdStack.length?'':'disabled'}>Forward ›</button>`; }
function route(){
  if(navKind==='keep') navKind=null; else fwdStack=[];
  const h=cur;
  const id=(h==='map'||h==='progress'||h==='decisions'||N[h]||MIS[h])?h:'home';
  if(N[id]){
    bump(id);
    let t;
    if(prevId&&N[id].parents.includes(prevId)&&trail[trail.length-1]===prevId) t=[...trail,id];
    else{ t=[id]; let c=id; while(N[c].parents.length){c=N[c].parents[0]; t.unshift(c);} }
    trail=t; prevId=id; flt='all';
  } else { trail=[]; prevId=null; }
  curId=id; draw(); window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{try{cur=decodeURIComponent(location.hash.slice(1));}catch(e){} route();});
/* Inside the hub the page runs in a srcdoc frame, where '#x' links would load the hub itself. Route in the page instead. */
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]'); if(!a) return; e.preventDefault(); nav(a.getAttribute('href').slice(1));});
app.addEventListener('click',e=>{
  if(e.target.closest('[data-fqreset]')){visits={}; saveVisits(); draw(); return;}
  const nb=e.target.closest('[data-nav]'); if(nb){ if(nb.dataset.nav==='back'){const t=backTarget(); if(t){fwdStack.push(curId); navKind='keep'; nav(t);}} else {const t=fwdStack.pop(); if(t){navKind='keep'; nav(t);}} return; }
  const sv=e.target.closest('[data-sev]'); if(sv){const k=sv.dataset.sev||null; sevFilter=(k===sevFilter)?null:k; draw(); return;}
  const f=e.target.closest('[data-flt]'); if(f){flt=f.dataset.flt; draw(); return;}
  const dc=e.target.closest('[data-dec]'); if(dc){const id=dc.dataset.dec; if(decBusy[id]) return; decBusy[id]=1; decMsg=''; draw(); try{parent.postMessage({type:'cc-q',action:'decide',req:'x'+Date.now(),id:id,status:dc.dataset.st},'*')}catch(x){delete decBusy[id]; decMsg='Not saved: no connection to the hub.'; draw();} return;}
  const op=e.target.closest('[data-open]'); if(op){try{parent.postMessage({type:'cc-open',id:op.dataset.open},'*')}catch(_){} return;}
  const lg=e.target.closest('[data-lang]'); if(lg){VL=lg.dataset.lang; try{localStorage.setItem('cc-lang',VL)}catch(x){} draw(); return;}
  const mc=e.target.closest('[data-mic]'); if(mc){startRec(mc.dataset.mic); return;}
  const mb=e.target.closest('[data-m]'); if(mb){nav(mb.dataset.m); return;}
  const an=e.target.closest('[data-ans]'); if(an){Q.a[an.dataset.ans]=an.dataset.v; delete Q.p[an.dataset.ans]; saveQ(); draw(); return;}
  const pk=e.target.closest('[data-park]'); if(pk){const k=pk.dataset.park; if(Q.p[k]) delete Q.p[k]; else Q.p[k]=1; saveQ(); draw(); return;}
  const dn=e.target.closest('[data-mdone]'); if(dn){Q.d[dn.dataset.mdone]=1; saveQ(); draw(); window.scrollTo(0,0); return;}
  if(e.target.closest('[data-mcopy]')){const ta=document.getElementById('ansout'); if(ta){ta.select(); const msg=document.getElementById('cpmsg'); try{navigator.clipboard.writeText(ta.value).then(()=>{if(msg)msg.textContent='Copied.'},()=>{if(msg)msg.textContent='Select the text and copy it.'});}catch(x){if(msg)msg.textContent='Select the text and copy it.'}} return;}
  const s=e.target.closest('[data-sel]'); if(s){mapSel=s.dataset.sel; draw();}
});
app.addEventListener('input',e=>{const t=e.target.closest('[data-txt]'); if(!t) return; const k=t.dataset.txt; Q.a[k]=t.value; if(t.value.trim()) delete Q.p[k]; saveQ(); refreshM(k.split('.')[0]);});
app.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){const s=e.target.closest('[data-sel]'); if(s){e.preventDefault(); mapSel=s.dataset.sel; draw();}}});
matchMedia('(max-width:640px)').addEventListener('change',()=>{if(curId==='map')draw();});
try{const t=localStorage.getItem('cc-theme'); if(t) document.documentElement.dataset.theme=t;}catch(e){}
document.getElementById('theme').addEventListener('click',()=>{
  const nx=document.documentElement.dataset.theme==='light'?'dark':'light';
  document.documentElement.dataset.theme=nx; try{localStorage.setItem('cc-theme',nx)}catch(e){}
});
route();
</script>
