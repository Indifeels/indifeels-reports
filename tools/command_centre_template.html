<style>
/* Layout: sticky top bar, then one screen per node (home tiles, sub-tiles, detail), plus a separate Connections map screen */
:root{
  --bg:#22252a; --panel:#1b1e22; --tile:#262a2f; --tile2:#2f343a; --line:#3a4047;
  --ink:#eceff2; --mute:#9ba4ae; --accent:#2bb5a5;
  --g:#3dbb8a; --y:#d9a23b; --o:#e8803a; --r:#e5534b; --info:#5a9be0;
  --shadow:inset 0 -3px 0 rgba(0,0,0,.65),inset 1px 0 0 rgba(255,255,255,.05),0 2px 3px rgba(0,0,0,.6),0 12px 22px rgba(0,0,0,.5),0 26px 40px rgba(0,0,0,.35);
  --tile-grad:linear-gradient(145deg,#1d1f23 0%,#0c0d0f 50%,#050506 100%); --tile-hi:rgba(255,255,255,.13);
  --display:"Space Grotesk",system-ui,sans-serif; --body:Inter,system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-theme="dark"]{ color-scheme:dark }
:root[data-theme="light"]{
  --bg:#eceff2; --panel:#ffffff; --tile:#ffffff; --tile2:#f1f3f5; --line:#d5dade;
  --ink:#1d2227; --mute:#5f6b76; --accent:#0f8f82;
  --g:#1f9d6e; --y:#b57f14; --o:#d4691f; --r:#d23f37; --info:#2f73c0;
  --shadow:0 4px 14px rgba(20,30,40,.08);
  --tile-grad:linear-gradient(335deg,#ffffff 0%,#eef1f3 100%); --tile-hi:rgba(255,255,255,0);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);padding-block:0 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;
  gap:10px 14px;align-items:center;justify-content:space-between;padding:12px 0}
.tabs{display:flex;gap:6px}
.tabs a,.btn{padding:6px 12px;border-radius:8px;background:transparent;border:1px solid var(--line);color:var(--mute)}
.tabs a.on{background:var(--tile2);color:var(--ink);border-color:var(--tile2)}
.btn{background:var(--tile)}
.right{display:flex;gap:8px;align-items:center}
.draft{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--y);border:1px solid var(--y);border-radius:999px;padding:2px 8px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;color:var(--mute);font-size:13px;min-width:0}
.crumbs a:hover{color:var(--ink)} .crumbs b{color:var(--ink);font-weight:500}
h1{font:600 clamp(26px,5vw,38px)/1.1 var(--display);margin:18px 0 4px;text-wrap:balance}
.sub{color:var(--mute);margin:0 0 18px}
.h2{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:28px 0 10px}
.grid{display:grid;gap:12px}
.grid.cats{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.grid.subs{grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}

.tile{position:relative;display:block;background:var(--tile-grad);border:1px solid transparent;border-radius:14px;padding:16px;

.left{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn:disabled{opacity:.35;cursor:default}
.freq{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 16px}
.fq{display:inline-flex;gap:10px;align-items:center;padding:9px 14px;border-radius:10px;background:var(--tile-grad);font-weight:500;

.fq b{color:var(--rc,var(--mute));font:700 14px var(--display);font-variant-numeric:tabular-nums}
.lnk{background:none;border:0;color:var(--mute);text-decoration:underline;font-size:11px;letter-spacing:0;text-transform:none;margin-left:8px;padding:0}
a.tile:hover{transform:translateY(-4px);box-shadow:inset 0 1px 0 var(--tile-hi),inset 0 -3px 0 rgba(0,0,0,.65),0 4px 6px rgba(0,0,0,.55),0 22px 36px rgba(0,0,0,.55)}
.tile.overall{display:flex;gap:20px;align-items:center;margin-bottom:12px}
.tile.overall .big{font:700 clamp(20px,3vw,26px)/1.15 var(--display)}
.sevs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sevb{padding:5px 14px;border-radius:999px;border:1px solid currentColor;background:transparent;font-weight:500;transition:background .15s}

.tile .go{position:absolute;right:14px;top:12px;color:var(--mute);font-size:20px;line-height:1}
.tile.cat{display:flex;flex-direction:column;gap:14px;min-height:230px}
.tile.cat .top{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.tile.cat .nm{font:700 clamp(22px,3.4vw,28px)/1.1 var(--display);text-wrap:balance}
.tile.cat .top>div{min-width:0}
.alerts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}

.tile.sub{display:flex;gap:14px;align-items:center}
.tile.sub .nm{font:600 15px/1.25 var(--display);padding-right:14px}
.tile.plan{background:transparent;box-shadow:none;border-style:dashed;border-color:var(--line)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.mute{color:var(--mute)} .small{font-size:12px}
.prev{color:var(--mute);font-size:12px;line-height:1.4;margin-top:auto}
.chip{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--tile2);color:var(--mute);white-space:nowrap}
.chip.live{color:var(--g);background:color-mix(in srgb,var(--g) 14%,transparent)}

.chip.shared{color:var(--info);background:color-mix(in srgb,var(--info) 14%,transparent)}
.ring{position:relative;width:var(--s);height:var(--s);flex:none}

.ring .num{position:absolute;inset:0;display:grid;place-items:center;font:700 calc(var(--s)*.32)/1 var(--display);font-variant-numeric:tabular-nums}

.g{--rc:var(--g)} .y{--rc:var(--y)} .o{--rc:var(--o)} .r{--rc:var(--r)}
.hero{display:flex;gap:18px;align-items:center;margin:10px 0 4px}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:18px 0 12px}
.vsep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}

.card{background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.card h3{margin:0 0 8px;font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.rel{display:flex;gap:8px;padding:8px 0;border-top:1px solid var(--line);align-items:baseline}
.rel:first-of-type{border-top:0}
.rel .ar{color:var(--accent);flex:none}
.rel a{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}

details.card summary{cursor:pointer;font-weight:500}
.feeds{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}

.note{color:var(--mute);font-size:12px;margin-top:22px}
.mapbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox text{fill:var(--ink);font-family:var(--body)}
.mapbox .nmt{font-size:13px;font-weight:600}
.mapbox .sct{font-size:11px;fill:var(--mute)}
.mapbox .nd rect{fill:var(--tile);stroke:var(--line);stroke-width:1}

.mapbox .nd{cursor:pointer}
.mapbox .edge{fill:none;stroke:var(--mute);stroke-opacity:.35}

.mapbox .edge.in{stroke:var(--o);stroke-opacity:1}
.mapbox .cnt{fill:var(--bg);stroke:var(--line)}
.mapbox .cntt{font-size:10px;font-weight:600;text-anchor:middle}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:10px 2px;color:var(--mute);font-size:12px}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
@media(prefers-reduced-motion:reduce){.tile{transition:none}}
</style>

/* ---------- helpers ---------- */
const kids={}; order.forEach(id=>N[id].parents.forEach(p=>(kids[p]=kids[p]||[]).push(id)));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function leaves(id){ if(!kids[id]) return [id]; const s=new Set(); kids[id].forEach(k=>leaves(k).forEach(x=>s.add(x))); return [...s]; }
function sub(id,s=new Set()){ s.add(id); (kids[id]||[]).forEach(k=>sub(k,s)); return s; }
function root(id){ while(N[id].parents.length) id=N[id].parents[0]; return id; }
function score(id){ if(!kids[id]) return N[id].score; const v=leaves(id).map(l=>N[l].score).filter(x=>x!=null); return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null; }
function counts(id){ const ls=leaves(id); const b=ls.filter(l=>N[l].st!=='plan').length; return {built:b,plan:ls.length-b}; }
const band=s=>s==null?'':s>=80?'g':s>=60?'y':s>=40?'o':'r';
function ring(s,size,sw){
  const r=(size-sw)/2,c=2*Math.PI*r;
  if(s==null) return `<div class="ring none" style="--s:${size}px"><svg width="${size}" height="${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${sw}" stroke-dasharray="3 5"/></svg><span class="num">–</span></div>`;
  return `<div class="ring ${band(s)}" style="--s:${size}px"><svg width="${size}" height="${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--tile2)" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--rc)" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c*s/100} ${c}"/></svg><span class="num" aria-label="Score ${s} out of 100">${s}</span></div>`;
}
const stChip=st=>st==='live'?'<span class="chip live">Live</span>':st==='part'?'<span class="chip part">Partial</span>':'<span class="chip">Planned</span>';
const nl=id=>`<a href="#${id}">${esc(N[id].name)}</a>`;
function linksFor(id){ const S=sub(id); return {out:L.filter(l=>S.has(l[0])&&!S.has(l[1])), inn:L.filter(l=>S.has(l[1])&&!S.has(l[0]))}; }
function sortKids(ids){ const w={live:0,part:1,plan:2}; return ids.slice().sort((a,b)=>{const sa=kids[a]?'part':N[a].st, sb=kids[b]?'part':N[b].st; return w[sa]-w[sb]||order.indexOf(a)-order.indexOf(b)}); }

  const lo=CATS.map(c=>[c[0],score(c[0])]).filter(x=>x[1]!=null).sort((a,b)=>a[1]-b[1])[0];
  return `<div class="tile overall">${ring(o,112,11)}<div style="min-width:0"><div class="big">Overall business score</div>
   <div class="mute small">Average of ${cs.length} scored areas${lo?`. Weakest: ${nl(lo[0])} (${lo[1]})`:''}</div>
   <div class="sevs" role="group" aria-label="Filter alerts">${[['red','urgent'],['yel','watch'],['grn','healthy']].map(([k,t])=>`<button type="button" class="sevb ${k} ${sevFilter===k?'on':''}" data-sev="${k}" aria-pressed="${sevFilter===k}">${cnt[k]} ${t}</button>`).join('')}${sevFilter?'<button type="button" class="sevb clr" data-sev="">Show all</button>':''}</div></div></div>`;

const FQ_KEY='cc-visits';
function loadVisits(){ try{return JSON.parse(localStorage.getItem(FQ_KEY))||{}}catch(e){return {}} }
function saveVisits(){ try{localStorage.setItem(FQ_KEY,JSON.stringify(visits))}catch(e){} }
let visits=loadVisits();
function bump(id){ if(N[id].cat) return; const v=visits[id]||{c:0,t:0}; v.c++; v.t=Date.now(); visits[id]=v; saveVisits(); }
function freqView(){
  const used=Object.entries(visits).filter(([id])=>N[id]&&!N[id].cat).sort((a,b)=>b[1].c-a[1].c||b[1].t-a[1].t).slice(0,6).map(x=>x[0]);
  const sample=!used.length, ids=sample?['restock','profit-flow','ga-scorecard','stock-take','seo-report','fb-tracked']:used;
  const head=sample?'Frequently used · suggested until you open a few':'Frequently used <button type="button" class="lnk" data-fqreset="1">Reset</button>';
  const btns=ids.map(id=>{const s=score(id); return `<a class="fq ${band(s)}" href="#${id}">${esc(N[id].name)}${s==null?'':` <b>${s}</b>`}</a>`;}).join('');
  return `<div class="h2" style="margin-top:6px">${head}</div><div class="freq">${btns}</div>`;
}

function homeView(){

      <div class="top"><div><div class="nm">${esc(name)}</div><div class="meta"><span class="chip live">${c.built} built</span><span class="chip">${c.plan} planned</span></div></div>${ring(score(id),88,9)}</div>
      <ul class="alerts">${li}${more}</ul></a>`;}).join('');
  const feeds=[['Shopify','Live. Orders, stock, customers.'],['Windsor.ai','Live. Google Ads, Meta, GA4, Search Console, Business Profile.'],

function subTile(id,parent){
  const nd=N[id], has=!!kids[id], st=has?'part':nd.st, sc=score(id);
  const others=nd.parents.filter(p=>p!==parent).map(p=>N[root(p)].name).filter((v,i,a)=>a.indexOf(v)===i&&v!==N[root(parent)].name);
  const sh=others.length?`<span class="chip shared" title="Also under: ${esc(others.join(', '))}">Also in ${esc(others[0])}${others.length>1?' +'+(others.length-1):''}</span>`:'';
  const cnt=has?`<span class="chip">${kids[id].length} items</span>`:'';
  return `<a class="tile sub ${st==='plan'?'plan':''}" href="#${id}"><span class="go" aria-hidden="true">›</span>${ring(sc,56,6)}
    <div style="min-width:0"><div class="nm">${esc(nd.name)}</div><div class="meta">${stChip(st)}${cnt}${sh}</div></div></a>`;
}

function connSection(id){
  const {out,inn}=linksFor(id); if(!out.length&&!inn.length) return '';
  const row=(l,dir)=>`<div class="rel"><span class="ar">${dir==='out'?'→':'←'}</span><span>${dir==='out'?'Feeds':'Fed by'} ${nl(dir==='out'?l[1]:l[0])} <span class="mute">· ${esc(l[2])}</span>${dir==='out'?'':` <span class="mute small">(from ${nl(l[0])})</span>`}</span></div>`;
  const rows=out.map(l=>`<div class="rel"><span class="ar">→</span><span>${nl(l[0])} feeds ${nl(l[1])} <span class="mute">· ${esc(l[2])}</span></span></div>`).join('')
    +inn.map(l=>`<div class="rel"><span class="ar" style="color:var(--o)">←</span><span>${nl(l[1])} fed by ${nl(l[0])} <span class="mute">· ${esc(l[2])}</span></span></div>`).join('');
  return `<div class="h2">Connections</div><details class="card" ${kids[id]?'':'open'}><summary>${out.length} outgoing · ${inn.length} incoming</summary><div style="margin-top:8px">${rows}</div></details>`;
}

function nodeView(id){
  const nd=N[id], has=!!kids[id], sc=score(id), c=counts(id);
  const crumbs=['<a href="#home">Home</a>',...trail.map((t,i)=>i===trail.length-1?`<b>${esc(N[t].name)}</b>`:nl(t))].join(' <span>›</span> ');
  let h=`<div class="crumbs">${crumbs}</div>
   <div class="hero">${ring(sc,96,10)}<div style="min-width:0"><h1 style="margin:0">${esc(nd.name)}</h1>
   <div class="meta">${has||nd.cat?'':stChip(nd.st)}<span class="chip live">${c.built} built</span><span class="chip">${c.plan} planned</span></div></div></div>`;
  if(nd.desc) h+=`<p class="sub" style="margin-top:12px">${esc(nd.desc)}</p>`;
  if(has){
    const f=k=>{ if(flt==='all') return true; const built=kids[k]?counts(k).built>0:N[k].st!=='plan'; return flt==='live'?built:!built; };
    const list=sortKids(kids[id]).filter(f);
    h+=`<div class="filters" role="group" aria-label="Navigate and filter tiles">${navBtns()}<span class="vsep"></span>${[['all','All'],['live','Built'],['plan','Planned']].map(([v,t])=>`<button type="button" data-flt="${v}" class="${flt===v?'on':''}">${t}</button>`).join('')}</div>
        <div class="grid subs">${list.map(k=>subTile(k,id)).join('')||'<p class="mute">Nothing here yet.</p>'}</div>`;
  } else {
    const ps=nd.parents.map(nl).join(' ');
    h+=`<div class="filters" style="margin-top:18px">${navBtns()}</div><div class="cols">
     <div class="card"><h3>Report</h3>${nd.rep?`<div>${esc(nd.rep)}</div>${HUB[id]?`<p style="margin:10px 0 0"><button type="button" class="btn" data-open="${HUB[id]}">Open this report</button></p>`:`<div class="mute small" style="margin-top:4px">Not linked to a hub report yet.</div>`}`:'<div class="mute">Not built yet. Planned for future.</div>'}</div>
     <div class="card"><h3>Data sources</h3><div class="pills">${nd.src.map(s=>`<span class="chip">${esc(s)}</span>`).join('')||'<span class="mute">To decide</span>'}</div></div>
     <div class="card"><h3>Lives under</h3><div class="pills">${nd.parents.map(p=>`<a class="chip shared" href="#${p}">${esc(N[p].name)}</a>`).join('')}</div></div></div>`;
  }
  h+=connSection(id);
  return h;
}

function mapView(){
  const narrow=matchMedia('(max-width:640px)').matches;
  const W=narrow?400:820, H=narrow?720:540, cx=W/2, cy=H/2, rx=narrow?138:318, ry=narrow?290:205, hw=narrow?58:76, hh=narrow?25:27;
  const outer=CATS.map(c=>c[0]).filter(x=>x!=='marketing'); const P={marketing:{x:cx,y:cy}};
  outer.forEach((id,i)=>{const a=(-90+i*45)*Math.PI/180; P[id]={x:cx+rx*Math.cos(a),y:cy+ry*Math.sin(a)}});
  const agg={}; L.forEach(l=>{const a=root(l[0]),b=root(l[1]); if(a===b) return; const k=a+'>'+b; agg[k]=(agg[k]||0)+1;});
  const edge=(p,q)=>{const dx=q.x-p.x,dy=q.y-p.y,s=Math.min((hw+5)/Math.abs(dx||1e-9),(hh+5)/Math.abs(dy||1e-9),1);return{x:p.x+dx*s,y:p.y+dy*s}};
  let paths='',labels='';
  Object.entries(agg).sort((a,b)=>{const hi=k=>k.split('>').includes(mapSel)?1:0;return hi(a[0])-hi(b[0])}).forEach(([k,v])=>{
    const [a,b]=k.split('>'), p=P[a], q=P[b], s=edge(p,q), e=edge(q,p);
    const dx=e.x-s.x, dy=e.y-s.y, len=Math.hypot(dx,dy)||1, mx=(s.x+e.x)/2, my=(s.y+e.y)/2;
    const c={x:mx-dy/len*len*0.14, y:my+dx/len*len*0.14};
    const cls=a===mapSel?'out':b===mapSel?'in':'';
    paths+=`<path class="edge ${cls}" d="M${s.x.toFixed(1)} ${s.y.toFixed(1)} Q${c.x.toFixed(1)} ${c.y.toFixed(1)} ${e.x.toFixed(1)} ${e.y.toFixed(1)}" stroke-width="${(1+v*0.9).toFixed(1)}" marker-end="url(#ah${cls||'n'})"/>`;
    if(cls){const lx=.25*s.x+.5*c.x+.25*e.x, ly=.25*s.y+.5*c.y+.25*e.y; labels+=`<circle class="cnt" cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="9"/><text class="cntt" x="${lx.toFixed(1)}" y="${(ly+3.5).toFixed(1)}">${v}</text>`;}
  });
  const nodes=CATS.map(([id,name])=>{const p=P[id],s=score(id); const nm=name.length>(narrow?15:20)&&narrow?name.replace(' & ',' & ').slice(0,15)+'…':name;
    return `<g class="nd ${id===mapSel?'sel':''}" data-sel="${id}" tabindex="0" role="button" aria-label="${esc(name)}"><rect x="${p.x-hw}" y="${p.y-hh}" width="${hw*2}" height="${hh*2}" rx="10"/>
     <text class="nmt" x="${p.x-hw+10}" y="${p.y-2}">${esc(narrow&&name.length>14?name.split(' ').slice(0,2).join(' '):name)}</text>
     <text class="sct" x="${p.x-hw+10}" y="${p.y+14}">${s==null?'no score yet':s+' / 100'}</text></g>`;}).join('');
  const mk=(id,col)=>`<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:${col}"/></marker>`;
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Arrows between the nine areas"><defs>${mk('ahn','var(--mute)')}${mk('ahout','var(--accent)')}${mk('ahin','var(--o)')}</defs>${paths}${labels}${nodes}</svg>`;
  const {out,inn}=linksFor(mapSel), nm=N[mapSel].name;
  const rows=(arr,dir)=>arr.map(l=>`<div class="rel"><span class="ar" style="color:${dir==='out'?'var(--accent)':'var(--o)'}">${dir==='out'?'→':'←'}</span><span>${nl(l[0])} → ${nl(l[1])} <span class="mute">· ${esc(l[2])}</span></span></div>`).join('')||'<div class="mute">None yet.</div>';
  return `<h1>Connections</h1><p class="sub">Tap an area to see what feeds it and what it feeds. Numbers are how many links run along an arrow.</p>
   <div class="filters" style="margin:0 0 12px">${navBtns()}</div>
   <div class="mapbox">${svg}</div>
   <div class="legend"><span><i style="background:var(--accent)"></i>${esc(nm)} feeds</span><span><i style="background:var(--o)"></i>feeds ${esc(nm)}</span><span><i style="background:var(--mute);opacity:.5"></i>other links</span></div>
   <div class="cols"><div class="card"><h3>${esc(nm)} feeds</h3>${rows(out,'out')}</div><div class="card"><h3>Feeds ${esc(nm)}</h3>${rows(inn,'in')}</div></div>
   <p style="margin-top:14px"><a class="btn" href="#${mapSel}">Open ${esc(nm)} tiles</a></p>`;
}

/* ---------- routing ---------- */
function draw(){
  const isMap=curId==='map';
  document.getElementById('tab-map').classList.toggle('on',isMap);
  document.getElementById('tab-home').classList.toggle('on',!isMap);
  app.innerHTML=isMap?mapView():(N[curId]?nodeView(curId):homeView());
  updateNav();
}
let fwdStack=[], navKind=null;
let cur=''; try{cur=decodeURIComponent((location.hash||'').slice(1));}catch(e){}
function nav(h){ cur=h; try{ if(window.top===window) history.replaceState(null,'','#'+h); }catch(e){} route(); }
function backTarget(){ if(!curId||curId==='home') return null; if(curId==='map') return 'home'; return trail.length>1?trail[trail.length-2]:'home'; }
function updateNav(){}
function navBtns(){ return `<button type="button" class="btn" data-nav="back" aria-label="Back one level" ${backTarget()?'':'disabled'}>‹ Back</button><button type="button" class="btn" data-nav="fwd" aria-label="Forward" ${fwdStack.length?'':'disabled'}>Forward ›</button>`; }
function route(){
  if(navKind==='keep') navKind=null; else fwdStack=[];
  const h=cur;
  const id=(h==='map'||N[h])?h:'home';
  if(N[id]){
    bump(id);
    let t;
    if(prevId&&N[id].parents.includes(prevId)&&trail[trail.length-1]===prevId) t=[...trail,id];
    else{ t=[id]; let c=id; while(N[c].parents.length){c=N[c].parents[0]; t.unshift(c);} }
    trail=t; prevId=id; flt='all';
  } else { trail=[]; prevId=null; }
  curId=id; draw(); window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{try{cur=decodeURIComponent(location.hash.slice(1));}catch(e){} route();});
/* Inside the hub the page runs in a srcdoc frame, where '#x' links would load the hub itself. Route in the page instead. */
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]'); if(!a) return; e.preventDefault(); nav(a.getAttribute('href').slice(1));});
app.addEventListener('click',e=>{
  if(e.target.closest('[data-fqreset]')){visits={}; saveVisits(); draw(); return;}
  const op=e.target.closest('[data-open]'); if(op){try{parent.postMessage({type:'cc-open',id:op.dataset.open},'*')}catch(_){} return;}
  const nb=e.target.closest('[data-nav]'); if(nb){ if(nb.dataset.nav==='back'){const t=backTarget(); if(t){fwdStack.push(curId); navKind='keep'; nav(t);}} else {const t=fwdStack.pop(); if(t){navKind='keep'; nav(t);}} return; }
  const sv=e.target.closest('[data-sev]'); if(sv){const k=sv.dataset.sev||null; sevFilter=(k===sevFilter)?null:k; draw(); return;}
  const f=e.target.closest('[data-flt]'); if(f){flt=f.dataset.flt; draw(); return;}
  const s=e.target.closest('[data-sel]'); if(s){mapSel=s.dataset.sel; draw();}
});
app.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){const s=e.target.closest('[data-sel]'); if(s){e.preventDefault(); mapSel=s.dataset.sel; draw();}}});
matchMedia('(max-width:640px)').addEventListener('change',()=>{if(curId==='map')draw();});
try{const t=localStorage.getItem('cc-theme'); if(t) document.documentElement.dataset.theme=t;}catch(e){}
document.getElementById('theme').addEventListener('click',()=>{
  const nx=document.documentElement.dataset.theme==='light'?'dark':'light';
  document.documentElement.dataset.theme=nx; try{localStorage.setItem('cc-theme',nx)}catch(e){}
});
