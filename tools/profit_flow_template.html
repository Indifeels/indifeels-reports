<script>
(function(){
var D=JSON.parse(document.getElementById("data").textContent),ROWS=D.rows,CFG=D.cfg,TODAY="__TODAY__",GST=1/11;
var DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],MF=["January","February","March","April","May","June","July","August","September","October","November","December"];
function dim(s){var a=s.split("-");return new Date(+a[0],+a[1],0).getDate()}
function money(n){var r=Math.round(n);return(r<0?"-":"")+"$"+Math.abs(r).toLocaleString("en-AU")}
function addDays(s,n){var d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function dow(s){return new Date(s+"T00:00:00Z").getUTCDay()}
function monday(s){return addDays(s,-((dow(s)+6)%7))}
function pd(s){var a=s.split("-");return(+a[2])+" "+MN[+a[1]-1]}
var FIRST=ROWS.length?ROWS[0].d:TODAY;
var LIST={day:[],week:[],month:[]};
(function(){
  for(var d=TODAY;d>=FIRST;d=addDays(d,-1))LIST.day.push({from:d,to:d,label:DN[dow(d)]+" "+pd(d)+(d===TODAY?" (today)":"")});
  for(var m=monday(TODAY);addDays(m,6)>=FIRST;m=addDays(m,-7)){var e=addDays(m,6);if(e>TODAY)e=TODAY;LIST.week.push({from:m<FIRST?FIRST:m,to:e,label:pd(m)+" – "+pd(addDays(m,6))+(m===monday(TODAY)?" (now)":"")})}
  var y=+TODAY.slice(0,4),mo=+TODAY.slice(5,7);
  while(true){var f=y+"-"+(mo<10?"0":"")+mo+"-01",l=y+"-"+(mo<10?"0":"")+mo+"-"+dim(f);if(l<FIRST)break;
    LIST.month.push({from:f<FIRST?FIRST:f,to:l>TODAY?TODAY:l,label:MF[mo-1]+" "+y+(f===TODAY.slice(0,8)+"01"?" (now)":"")});mo--;if(mo<1){mo=12;y--}}
})();
var CH=[["G","Google"],["F","Facebook"],["O","Organic & other"]];
function calc(from,to){
  var rs=ROWS.filter(function(r){return r.d>=from&&r.d<=to});
  var c={days:rs.length,ch:{},g:0,m:0};
  CH.forEach(function(x){c.ch[x[0]]={card:0,cash:0}});
  var fl=CFG.fixed_monthly.filter(function(f){return f.amount!=null}),fixed=fl.map(function(f){return{name:f.name,v:0}});
  rs.forEach(function(r){c.g+=r.g;c.m+=r.m;CH.forEach(function(x){c.ch[x[0]].card+=r[x[0]][0];c.ch[x[0]].cash+=r[x[0]][1]});
    fl.forEach(function(f,i){fixed[i].v+=f.amount/dim(r.d)})});
  c.sales=0;c.gst=0;c.prod=0;
  CH.forEach(function(x){var h=c.ch[x[0]];h.sales=h.card+h.cash;h.gst=h.card*GST;h.prod=h.sales*CFG.product_cost_pct;
    h.ad=x[0]==="G"?c.g:x[0]==="F"?c.m:0;h.profit=h.sales-h.gst-h.prod-h.ad;
    c.sales+=h.sales;c.gst+=h.gst;c.prod+=h.prod});
  c.fixed=fixed;c.fx=fixed.reduce(function(a,b){return a+b.v},0);
  c.net=c.sales-c.gst-c.prod-c.g-c.m-c.fx;

  h+='<div class="ft t"><span>'+(cum?"So far":"Total")+'</span><span class="e">'+f(tt.e)+bp(tt.e,tt)+'</span><span class="n">'+f(tt.n)+bp(tt.n,tt)+'</span>'+pl(share(tt))+'</div>';
  document.getElementById("sftable").innerHTML=h;
  document.getElementById("sfnote").innerHTML=(cum?"<b>Cumulative:</b> running total from the first month. ":"")+esc(v==="intro"?SFN.intro:SFN[v][u])+" "+(SF.fy?"Tap All years to go back.":"Tap a year to see its months.")+(rows.some(function(r){return r.p.part})?" * part year.":"")+" Eligible = under "+F.maxDts+" days per unit sold (Restock Planner rule); products published in the last "+F.testDays+" days count as eligible. Each product keeps today’s status across all years. Shopify keeps no past stock levels.";

var CP=(CFG.clearance||{horizon_months:12,max_discount:.5,step:.05,elasticity:2,rate_days:90});
try{var cq=JSON.parse(localStorage.getItem("pf-cp2")||"null");if(cq){CP.horizon_months=cq.h||CP.horizon_months;CP.max_discount=cq.m||CP.max_discount}}catch(e){}
function plan(r){
  /* Smallest discount step that should sell the product out within the horizon, assuming units sold grow by (1/(1-d))^elasticity.
     Products already selling fast enough get 0%. Capped at the max discount. No sales in the last rate_days = max discount, flagged. */
  var stock=r[6],price=r[12],days=r[14]||1,win=Math.min(CP.rate_days,days),rate=win>0?r[13]/win:0,H=CP.horizon_months*30.4;
  var need=stock/H,d=0,none=rate<=0;
  if(none)d=CP.max_discount;
  else if(rate>=need)d=0;
  else{d=1-Math.pow(need/rate,-1/CP.elasticity);d=Math.min(CP.max_discount,Math.ceil(d/CP.step-1e-9)*CP.step)}
  var mult=Math.pow(1/(1-d),CP.elasticity),units=none?0:Math.min(stock,rate*mult*H),base=none?0:Math.min(stock,rate*H);
  return{d:d,price:price,np:Math.round(price*(1-d)),cash:units*price*(1-d),units:units,base:base*price,ok:units>=stock-1e-6,none:none,stock:stock}
}
function trail12(){var n=F&&F.n&&F.n.sv?F.n.sv:[],t=0;for(var i=Math.max(0,n.length-12);i<n.length;i++)t+=n[i];return t}

/* ---- per-product sale price: slider + approve (pushes to Shopify through the hub) ---- */
var PX={},PD={},PW={},REQ=0,PEND={};
function origOf(r){return Math.round(r[15]>0?r[15]:r[12])}
function loOf(r){return Math.ceil(origOf(r)*0.5)}
function stops(r){var o=origOf(r),lo=loOf(r),a=[],p=Math.ceil(lo/5)*5;if(lo<p&&lo<o)a.push(lo);for(;p<o;p+=5)a.push(p);a.push(o);return a}
function nearest5(r,v){var o=origOf(r);v=Math.round(v/5)*5;return Math.max(loOf(r),Math.min(o,v))}
function livePrice(r){var o=PD[r[16]];return o?o.np:Math.round(r[12])}
function selPrice(r){var k=r[16];if(PX[k]!=null)return PX[k];if(PD[k]||r[15]>r[12])return livePrice(r);var pl=plan(r);return pl.d>0?nearest5(r,pl.np):origOf(r)}
function pctOf(r,p){var o=origOf(r);return Math.round((1-p/o)*100)}
function priceBlock(r){
  if(!r[12])return"";
  if(r[4]||r[6]<=0)return'Price <b>$'+Math.round(r[12])+'</b>';
  var k=r[16],o=origOf(r),sp=selPrice(r),live=livePrice(r),pl=plan(r),w=PW[k],msg="",st=stops(r);
  var sug=pl.d>0?'Suggested <span class="sp">-'+Math.round(pl.d*100)+'% = $'+pl.np+'</span>'+(pl.none?" · no sales in "+CP.rate_days+" days":(pl.ok?"":" · won’t fully clear")):'Selling fast enough: no discount needed';
  var idx=0,bd=1e9;for(var i=0;i<st.length;i++){var dd=Math.abs(st[i]-sp);if(dd<bd){bd=dd;idx=i}}
  var btn=w==="busy"?'<button class="ap" disabled>Updating…</button>':w==="confirm"?'<button class="ap go" data-k="'+k+'">Tap again: set $'+sp+'</button>':sp===live?(live<o?'<button class="ap" disabled>Live ✓</button>':'<button class="ap" disabled>Approve</button>'):sp>=o?'<button class="ap" data-k="'+k+'">Revert to $'+o+'</button>':'<button class="ap" data-k="'+k+'">Approve</button>';
  if(w&&w.err)msg='<div class="m" style="color:var(--red)">'+esc(w.err)+'</div>';
  return'<div class="sl"><div class="m">'+sug+'</div><div class="slr"><input type="range" min="0" max="'+(st.length-1)+'" step="1" value="'+idx+'" data-k="'+k+'"><span class="slv">$<input type="text" inputmode="numeric" class="pin" value="'+sp+'" data-k="'+k+'" aria-label="Sale price"></span></div>'
    +'<div class="m" data-v="'+k+'">'+(sp<o?"-"+pctOf(r,sp)+"% off $"+o:"Original price")+' · Now <b>$'+live+'</b>'+(o>live?' <s>$'+o+'</s>':"")+'</div>'+btn+msg+'</div>'
}
function rowOf(k){for(var i=0;i<PL.rows.length;i++)if(String(PL.rows[i][16])===String(k))return PL.rows[i]}
window.addEventListener("message",function(e){var d=e.data||{};if(d.type!=="profit-flow-price-result"||!PEND[d.req])return;
  var p=PEND[d.req];delete PEND[d.req];clearTimeout(p.t);var r=rowOf(p.k);
  if(d.ok){PD[p.k]={np:p.revert?origOf(r):p.price};delete PX[p.k];PW[p.k]=null}else PW[p.k]={err:d.error||"Couldn’t change the price"};
  renderPl()});
function sendPrice(k,pr,rv){
  var id=++REQ;PW[k]="busy";PEND[id]={k:k,price:pr,revert:rv,t:setTimeout(function(){if(PEND[id]){delete PEND[id];PW[k]={err:"No answer. Open this report inside the Indifeels app to change prices."};renderPl()}},20000)};
