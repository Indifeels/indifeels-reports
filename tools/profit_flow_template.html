<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style><title>Profit Flow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap">
<style>
:root{--bg:#f5f2ff;--surface:#fff;--fg:#1a1640;--muted:#655f8f;--line:#e2dcfa;--green:#1fa968;--red:#e5484d;
--glow1:rgba(255,77,141,.2);--glow2:rgba(76,110,245,.2);--glow3:rgba(18,184,134,.18);
--display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--body:"Figtree",ui-sans-serif,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111214;--surface:#1c1d20;--fg:#f5f5f6;--muted:#bec0c5;--line:#3c3d40;--green:#3ddc84;--red:#ff7b7f;color-scheme:dark}}
:root[data-theme=dark]{--bg:#111214;--surface:#1c1d20;--fg:#f5f5f6;--muted:#bec0c5;--line:#3c3d40;--green:#3ddc84;--red:#ff7b7f;color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(60rem 38rem at 8% -8%,var(--glow1),transparent 62%),radial-gradient(52rem 38rem at 100% 6%,var(--glow2),transparent 62%),radial-gradient(56rem 40rem at 45% 108%,var(--glow3),transparent 62%);background-attachment:fixed;color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;padding:28px 16px 48px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,7vw,3.4rem);line-height:1;letter-spacing:-.02em;background:linear-gradient(90deg,#ff4d8d,#ff9d5c 45%,#ffd23f);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:6px 0 0;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;border-radius:22px;padding:14px 16px;color:#f5f5f6;display:flex;flex-direction:column;gap:3px;min-width:0;background:linear-gradient(145deg,#424347,#2a2b2e 40%,#161719);box-shadow:14px 16px 20px -8px rgba(0,0,0,.75),5px 6px 8px -4px rgba(0,0,0,.5),inset 10px 10px 18px -12px rgba(255,255,255,.16),inset -12px -12px 20px -12px rgba(0,0,0,.6);outline:2px solid transparent;transition:transform .12s}
.tile:active{transform:scale(.98)}
.tile:focus-visible{outline-color:#35d0e6}
.tile[aria-pressed=true]{outline:2px solid #ffb347;box-shadow:0 0 0 4px rgba(255,179,71,.18),14px 16px 20px -8px rgba(0,0,0,.75)}
.tile .k{font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#bec0c5}
.tile .v{font-family:var(--display);font-weight:800;font-size:clamp(1.15rem,4.6vw,1.8rem);line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .s{font-size:.78rem;color:#bec0c5;font-variant-numeric:tabular-nums}
.tile .s b{font-weight:700}.pos{color:#3ddc84}.neg{color:#ff7b7f}
.box{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;min-width:0}
.ptitle{margin:2px 4px 10px;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sc{}
svg{display:block;width:100%;max-width:560px;margin:0 auto;height:auto}
svg text{font-family:var(--body);fill:var(--fg);paint-order:stroke;stroke:var(--surface);stroke-width:3.5px;stroke-linejoin:round}
.nm{font-size:12px;font-weight:700}.vl{font-size:12px;font-weight:500;fill:var(--muted)}.big{font-size:14px;font-weight:800}
.fr{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px solid var(--line);font-size:.9rem}.fr b{font-variant-numeric:tabular-nums}.posbg b{color:var(--green)}.negbg b{color:var(--red)}
table.ct{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.86rem}table.ct th,table.ct td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}table.ct th:first-child{text-align:left;font-weight:700}table.ct thead th{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}table.ct tr.tot th,table.ct tr.tot td{font-weight:800;border-bottom:0}table.ct .pos{color:var(--green)}table.ct .neg{color:var(--red)}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin:4px 4px 0}.hero span{font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}.hero b{font-family:var(--display);font-size:clamp(1.7rem,8vw,2.4rem);font-variant-numeric:tabular-nums;line-height:1.1}
.pos{color:var(--green)}.neg{color:var(--red)}.sub2{margin:6px 4px 14px;font-size:1.05rem}
.bar{display:flex;height:26px;border-radius:13px;overflow:hidden;margin:0 4px 12px}.bar i{display:block;min-width:3px}
.lg{display:grid;grid-template-columns:14px 1fr auto 56px;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line)}.lg i{width:12px;height:12px;border-radius:4px}.lg b{font-variant-numeric:tabular-nums}.lg em{font-style:normal;color:var(--muted);font-size:.85rem;text-align:right}
.cd{background:var(--bg);border-radius:14px;padding:12px 14px;margin:0 4px 10px}.cn{font-family:var(--display);font-weight:800;font-size:1.05rem;margin-bottom:6px}.cd .row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:.95rem}.cd .row span{color:var(--muted)}.cd .row b{font-variant-numeric:tabular-nums;text-align:right}
.fr.tot{border-bottom:0}.fr.tot span,.fr.tot b{font-weight:800;font-size:1.05rem}
.vgs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 4px 6px}.vg{background:var(--bg);border-radius:14px;padding:10px 6px 8px}.vbs{display:flex;align-items:flex-end;justify-content:center;gap:10px;height:250px}
.vc{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:44%;height:100%}.vt{display:flex;flex-direction:column;align-items:center;margin-bottom:4px;line-height:1.15}.vt b{font-size:.92rem;font-variant-numeric:tabular-nums}.vt u{text-decoration:none;font-size:.74rem;font-weight:700;background:color-mix(in srgb,var(--fg) 10%,transparent);border-radius:8px;padding:1px 7px;margin-top:2px}
.vbr{width:100%;border-radius:8px 8px 0 0}.vl2{font-size:.72rem;color:var(--muted);margin-top:5px}.vn{text-align:center;font-family:var(--display);font-weight:800;margin-top:6px}.vnote{margin:0 4px 12px;font-size:.76rem;color:var(--muted);text-align:center}
.el{margin:0 4px 14px;background:var(--bg);border-radius:14px;padding:10px 12px}.elh{font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.elr{display:grid;grid-template-columns:12px 1fr auto;gap:2px 8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.elr:last-of-type{border-bottom:0}.elr i{width:12px;height:12px;border-radius:4px}.elr .n{font-weight:700}.elr .n small{color:var(--muted);font-weight:500;margin-left:4px}.elr b{font-variant-numeric:tabular-nums;font-size:1.05rem;text-align:right}
.elr .d{grid-column:2/4;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}.elr .d b{font-size:inherit;font-weight:700}.elt{font-size:.74rem;color:var(--muted);margin-top:6px}.elt b{color:var(--fg);font-variant-numeric:tabular-nums}
.note{margin:10px 4px 2px;font-size:.76rem;color:var(--muted)}
.sum{margin-top:12px}
.pill{border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.85rem;color:var(--muted)}
.pill b{display:block;font-size:1.05rem;color:var(--fg);font-variant-numeric:tabular-nums}

.pick{display:grid;grid-template-columns:110px 1fr;gap:8px;margin:0}.pick select{font:inherit;font-weight:700;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;min-width:0;width:100%}
.ch2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 4px 8px}.col{display:flex;flex-direction:column;align-items:stretch}.col .ct{text-align:center;font-weight:800;font-family:var(--display);margin-bottom:6px}.stk{display:flex;flex-direction:column-reverse;height:340px;border-radius:12px;overflow:hidden;background:var(--bg)}
.seg{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#101214;font-size:.7rem;line-height:1.2;overflow:hidden;min-height:2px;padding:0 3px}.seg b{font-size:.74rem;font-variant-numeric:tabular-nums}.seg.keep{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0 6px,transparent 6px 12px)}
.tg{display:flex;flex-wrap:wrap;gap:8px;margin:0 4px 12px}.sg{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}.sg button{all:unset;cursor:pointer;padding:7px 14px;font-weight:700;font-size:.85rem;color:var(--muted)}.sg button[aria-pressed=true]{background:var(--fg);color:var(--surface)}
.tr{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}.tl{width:100%;height:auto;display:block}.ax{font-size:10px;fill:var(--muted);font-family:var(--body)}.lgd{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted);margin-top:2px}.lgd i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.lgd em{margin-left:auto;font-style:normal}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin:2px 4px 0}.chip i{width:10px;height:10px;border-radius:3px}#leg{text-align:center;margin-bottom:4px}.tt{text-align:center;font-size:.8rem;color:var(--muted);margin-top:6px}.tt b{color:var(--fg)}
</style></head><body>
<div class="wrap">
  <header><h1>Profit Flow</h1><p class="sub">Indifeels Australia · AUD · Melbourne time · as at __UPDATED__</p></header>
  <section class="tiles" id="tiles" aria-label="Quick periods"></section>
  <div class="pick"><select id="pm" aria-label="Period type"><option value="day">Day</option><option value="week">Week</option><option value="month">Month</option></select><select id="pv" aria-label="Choose period"></select></div>
  <section class="box"><h2 class="ptitle" id="ptitle"></h2><div id="hero"></div><div class="ch2" id="ch2"></div><div id="leg"></div></section>
  <section class="box"><h2 class="ptitle">Is each channel worth it?</h2><div class="tg" id="tg"><div class="sg" id="gran"><button data-v="day">Days</button><button data-v="month">Months</button><button data-v="year">Years</button></div><div class="sg" id="ser"><button data-v="s">Spend</button><button data-v="sr">Spend + Return</button></div></div><div id="cards"></div></section>
  <section class="box"><h2 class="ptitle">The maths</h2><div id="wf"></div><p class="note" id="note"></p></section>
</div>
<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
var D=JSON.parse(document.getElementById("data").textContent),ROWS=D.rows,CFG=D.cfg,TODAY="__TODAY__",GST=1/11;
var DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],MF=["January","February","March","April","May","June","July","August","September","October","November","December"];
function dim(s){var a=s.split("-");return new Date(+a[0],+a[1],0).getDate()}
function money(n){var r=Math.round(n);return(r<0?"-":"")+"$"+Math.abs(r).toLocaleString("en-AU")}
function addDays(s,n){var d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function dow(s){return new Date(s+"T00:00:00Z").getUTCDay()}
function monday(s){return addDays(s,-((dow(s)+6)%7))}
function pd(s){var a=s.split("-");return(+a[2])+" "+MN[+a[1]-1]}
var FIRST=ROWS.length?ROWS[0].d:TODAY;
var LIST={day:[],week:[],month:[]};
(function(){
  for(var d=TODAY;d>=FIRST;d=addDays(d,-1))LIST.day.push({from:d,to:d,label:DN[dow(d)]+" "+pd(d)+(d===TODAY?" (today)":"")});
  for(var m=monday(TODAY);addDays(m,6)>=FIRST;m=addDays(m,-7)){var e=addDays(m,6);if(e>TODAY)e=TODAY;LIST.week.push({from:m<FIRST?FIRST:m,to:e,label:pd(m)+" – "+pd(addDays(m,6))+(m===monday(TODAY)?" (now)":"")})}
  var y=+TODAY.slice(0,4),mo=+TODAY.slice(5,7);
  while(true){var f=y+"-"+(mo<10?"0":"")+mo+"-01",l=y+"-"+(mo<10?"0":"")+mo+"-"+dim(f);if(l<FIRST)break;
    LIST.month.push({from:f<FIRST?FIRST:f,to:l>TODAY?TODAY:l,label:MF[mo-1]+" "+y+(f===TODAY.slice(0,8)+"01"?" (now)":"")});mo--;if(mo<1){mo=12;y--}}
})();
var CH=[["G","Google"],["F","Facebook"],["O","Organic & other"]];
function calc(from,to){
  var rs=ROWS.filter(function(r){return r.d>=from&&r.d<=to});
  var c={days:rs.length,ch:{},g:0,m:0};
  CH.forEach(function(x){c.ch[x[0]]={card:0,cash:0}});
  var fl=CFG.fixed_monthly.filter(function(f){return f.amount!=null}),fixed=fl.map(function(f){return{name:f.name,v:0}});
  rs.forEach(function(r){c.g+=r.g;c.m+=r.m;CH.forEach(function(x){c.ch[x[0]].card+=r[x[0]][0];c.ch[x[0]].cash+=r[x[0]][1]});
    fl.forEach(function(f,i){fixed[i].v+=f.amount/dim(r.d)})});
  c.sales=0;c.gst=0;c.prod=0;
  CH.forEach(function(x){var h=c.ch[x[0]];h.sales=h.card+h.cash;h.gst=h.card*GST;h.prod=h.sales*CFG.product_cost_pct;
    h.ad=x[0]==="G"?c.g:x[0]==="F"?c.m:0;h.profit=h.sales-h.gst-h.prod-h.ad;
    c.sales+=h.sales;c.gst+=h.gst;c.prod+=h.prod});
  c.fixed=fixed;c.fx=fixed.reduce(function(a,b){return a+b.v},0);
  c.net=c.sales-c.gst-c.prod-c.g-c.m-c.fx;
  return c;
}
var QUICK=[{id:"day",label:"Today",from:TODAY,to:TODAY},{id:"week",label:"This week",from:monday(TODAY)<FIRST?FIRST:monday(TODAY),to:TODAY},{id:"month",label:"This month",from:TODAY.slice(0,8)+"01",to:TODAY}];
var pm=document.getElementById("pm"),pv=document.getElementById("pv"),sel={mode:"day",i:0};
try{var sv=JSON.parse(localStorage.getItem("pf-sel")||"null");if(sv&&LIST[sv.mode]&&LIST[sv.mode][sv.i])sel=sv}catch(e){}
function fillValues(){pv.innerHTML=LIST[sel.mode].map(function(x,i){return'<option value="'+i+'">'+x.label+'</option>'}).join("");pv.value=sel.i;pm.value=sel.mode}
function range(){return LIST[sel.mode][sel.i]}
function save(){try{localStorage.setItem("pf-sel",JSON.stringify(sel))}catch(e){}}
pm.onchange=function(){sel={mode:pm.value,i:0};fillValues();save();renderAll()};
pv.onchange=function(){sel.i=+pv.value;save();renderAll()};
var tilesEl=document.getElementById("tiles");
function renderTiles(){
  var r=range();tilesEl.innerHTML="";
  QUICK.forEach(function(q){
    var c=calc(q.from,q.to),b=document.createElement("button");b.type="button";b.className="tile";
    b.setAttribute("aria-pressed",sel.mode===q.id&&sel.i===0);
    b.innerHTML='<span class="k">'+q.label+'</span><span class="v">'+money(c.sales)+'</span><span class="s">Net <b class="'+(c.net>=0?"pos":"neg")+'">'+money(c.net)+'</b></span>';
    b.onclick=function(){sel={mode:q.id,i:0};fillValues();save();renderAll()};tilesEl.appendChild(b)});
}
var COL={G:"#ffb703",F:"#4c6ef5",O:"#12b886",gst:"#9b8cc9",prod:"#f08c4a",ads:"#ffb703",meta:"#6f86ff",fixed:"#ff6b6b",net:"#2fbf71",loss:"#e5484d"};
function roas(a,b){return b>0?"$"+(a/b).toFixed(2).replace(/\.00$/,"")+" back per $1":"no ad spend"}
function pcs(v,S){return(v/S*100).toFixed(0)+"%"}
function split(from,to){
  var t=0,e=0,sl=0;
  ROWS.forEach(function(r){if(r.d>=from&&r.d<=to){t+=r.t||0;e+=r.e||0}});
  var c=calc(from,to);sl=c.sales;
  if(!(t>0)||!(sl>0))return null;
  var sh=Math.min(1,e/t);return{sales:sl,e:sl*sh,n:sl*(1-sh),sh:sh};
}
function prevRange(r){
  var f,t;
  if(sel.mode==="day"){f=t=addDays(r.from,-1)}
  else if(sel.mode==="week"){f=addDays(r.from,-7);t=addDays(r.to,-7)}
  else{var a=r.from.split("-"),y=+a[0],m=+a[1]-1;if(m<1){m=12;y--}
    var ps=y+"-"+(m<10?"0":"")+m+"-01",n=Math.round((new Date(r.to+"T00:00:00Z")-new Date(r.from+"T00:00:00Z"))/864e5)+1;
    f=ps;t=addDays(ps,Math.min(n,dim(ps))-1)}
  return t<FIRST?null:{from:f<FIRST?FIRST:f,to:t};
}
function chg(a,b,badUp){
  if(!(b>0))return'';
  var p=(a-b)/b*100,up=p>=0,good=badUp?!up:up;
  return'<b class="'+(Math.abs(p)<0.5?"":good?"pos":"neg")+'">'+(up?"▲ ":"▼ ")+Math.abs(p).toFixed(0)+'%</b> · '+(up?"+":"-")+money(Math.abs(a-b)).replace("-","");
}
function eligBlock(r){
  var cur=split(r.from,r.to);
  if(!cur)return"";
  var pr=prevRange(r),pv_=pr?split(pr.from,pr.to):null,ytd=split(FIRST,TODAY);
  var word=sel.mode==="day"?"yesterday":sel.mode==="week"?"last week":"last month";
  function row(name,col,v,sh,pvv,badUp){
    return'<div class="elr"><i style="background:'+col+'"></i><span class="n">'+name+'<small>'+(sh*100).toFixed(0)+'%</small></span><b>'+money(v)+'</b>'
      +'<span class="d">'+(pvv==null?"":chg(v,pvv,badUp)+" vs "+word)+'</span></div>';
  }
  var h='<div class="el">'+row("Eligible","#12b886",cur.e,cur.sh,pv_?pv_.e:null,false)+row("Not eligible","#f08c4a",cur.n,1-cur.sh,pv_?pv_.n:null,true);
  if(ytd)h+='<div class="elt">Since '+pd(FIRST)+': <b>'+(ytd.sh*100).toFixed(0)+'%</b> eligible</div>';
  return h+'</div>';
}
function draw(){
  var r=range(),c=calc(r.from,r.to),loss=c.net<0,S=Math.max(c.sales,1);
  document.getElementById("ptitle").textContent=r.label+(c.days>1?" · "+c.days+" days":"");
  document.getElementById("hero").innerHTML='<div class="hero"><span>Sold</span><b>'+money(c.sales)+'</b><span>You keep</span><b class="'+(loss?"neg":"pos")+'">'+money(c.net)+'</b></div><p class="sub2">Out of every $100 sold, you keep <b class="'+(loss?"neg":"pos")+'">$'+(c.net/S*100).toFixed(0)+'</b>.</p>'+eligBlock(r);
  var spend=[["Product cost",c.prod,COL.prod],["GST",c.gst,COL.gst],["Google Ads",c.g,COL.ads],["Facebook Ads",c.m,COL.meta],["Fixed costs",c.fx,COL.fixed]];
  if(!loss)spend.push(["You keep",c.net,COL.net,"keep"]);
  var ret=[["Google",c.ch.G.sales,COL.G],["Facebook",c.ch.F.sales,COL.F],["Organic & other",c.ch.O.sales,COL.O]];
  var total=Math.max(spend.reduce(function(a,x){return a+x[1]},0),c.sales,1);
  function stack(arr){return'<div class="stk">'+arr.map(function(x){var h=x[1]/total*340,t=h>=36?'<span>'+x[0]+'</span><b>'+money(x[1])+' · '+pcs(x[1],S)+'</b>':h>=17?'<b>'+x[0]+' '+pcs(x[1],S)+'</b>':'';
    return'<div class="seg'+(x[3]?" "+x[3]:"")+'" style="height:'+h+'px;background-color:'+x[2]+'">'+t+'</div>'}).join("")+'</div>'}
  document.getElementById("ch2").innerHTML='<div class="col"><div class="ct">Spend</div>'+stack(spend)+'<div class="tt">Costs <b>'+money(c.costs=c.sales-c.net)+'</b></div></div><div class="col"><div class="ct">Return</div>'+stack(ret)+'<div class="tt">Sales <b>'+money(c.sales)+'</b></div></div>';
  document.getElementById("leg").innerHTML=spend.concat(ret).filter(function(x){return x[1]/total*340<17&&x[1]>0}).map(function(x){return'<span class="chip"><i style="background:'+x[2]+'"></i>'+x[0]+' '+money(x[1])+' · '+pcs(x[1],S)+'</span>'}).join("");
  function card(name,h,color,ads,k){var good=h.profit>=0;
    return'<div class="cd" style="border-left:6px solid '+color+'"><div class="cn">'+name+'</div>'+
      (ads?'<div class="row"><span>Spent on ads</span><b>'+money(h.ad)+'</b></div>':'')+
      '<div class="row"><span>Sales it brought</span><b>'+money(h.sales)+'</b></div>'+
      (ads?'<div class="row"><span>Return</span><b>'+roas(h.sales,h.ad)+'</b></div>':'')+
      '<div class="row"><span>'+(ads?'Left after product, GST and ads':'Left after product and GST')+'</span><b class="'+(good?"pos":"neg")+'">'+money(h.profit)+'</b></div><div class="tr" id="tr-'+k+'"></div></div>'}
  document.getElementById("cards").innerHTML=card("Google Ads",c.ch.G,COL.G,true,"G")+card("Meta (Facebook) Ads",c.ch.F,COL.F,true,"F")+card("Everything else (organic, calls, repeat)",c.ch.O,COL.O,false,"O");
  drawTrends();
  var rows=[["Sales",c.sales,""],["– Product cost",-c.prod,""],["– GST (card sales)",-c.gst,""],["– Google Ads",-c.g,""],["– Meta Ads",-c.m,""]].concat(c.fixed.map(function(f){return["– "+f.name,-f.v,"fx"]}));
  document.getElementById("wf").innerHTML=rows.map(function(x){return'<div class="fr '+x[2]+'"><span>'+x[0]+'</span><b>'+money(x[1])+'</b></div>'}).join("")+'<div class="fr tot"><span>You keep</span><b class="'+(loss?"neg":"pos")+'">'+money(c.net)+'</b></div>';
  var unset=CFG.fixed_monthly.filter(function(f){return f.amount==null}).map(function(f){return f.name});
  document.getElementById("note").textContent="Percentages are shares of sales. Product cost is a flat "+Math.round(CFG.product_cost_pct*100)+"% of sales for now. GST only on card sales. Google sales = Google web orders plus part of Google store visits; Facebook = all Facebook orders; the rest is organic and other. Fixed costs are today's monthly amounts spread per day."+(unset.length?" Not set yet: "+unset.join(", ")+".":"");
}

var TR={gran:"month",ser:"sr"};
try{var tv=JSON.parse(localStorage.getItem("pf-tr")||"null");if(tv&&tv.gran&&tv.ser)TR=tv}catch(e){}
function buckets(){
  var keyf=TR.gran==="year"?function(d){return d.slice(0,4)}:TR.gran==="month"?function(d){return d.slice(0,7)}:function(d){return d};
  var rs=TR.gran==="day"?ROWS.slice(-30):ROWS,out=[],idx={};
  rs.forEach(function(r){var k=keyf(r.d),b=idx[k];if(!b){b=idx[k]={k:k,G:0,F:0,O:0,g:0,m:0};out.push(b)}
    b.G+=r.G[0]+r.G[1];b.F+=r.F[0]+r.F[1];b.O+=r.O[0]+r.O[1];b.g+=r.g;b.m+=r.m});
  return out;
}
function blabel(k){if(k.length===4)return k;if(k.length===7)return MN[+k.slice(5)-1]+" "+k.slice(2,4);return pd(k)}
function line(pts,color,xs,y){return pts.length?'<path d="M'+pts.map(function(v,i){return xs[i].toFixed(1)+","+y(v).toFixed(1)}).join("L")+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+pts.map(function(v,i){return'<circle cx="'+xs[i].toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="'+(pts.length>45?0:3)+'" fill="'+color+'"><title>'+money(v)+'</title></circle>'}).join(""):""}
function drawTrends(){
  var bs=buckets(),n=bs.length;
  [["G","g"],["F","m"],["O",null]].forEach(function(t){
    var el=document.getElementById("tr-"+t[0]);if(!el)return;
    var ret=bs.map(function(b){return b[t[0]]}),sp=t[1]?bs.map(function(b){return b[t[1]]}):null;
    var showRet=TR.ser==="sr"||!sp,showSp=!!sp;
    var all=[].concat(showRet?ret:[],showSp?sp:[]),mx=Math.max.apply(null,all.concat([1]));
    var W=320,H=150,L=6,R=6,T=16,B=22,xs=bs.map(function(b,i){return n===1?W/2:L+i*(W-L-R)/(n-1)});
    function y(v){return T+(1-v/mx)*(H-T-B)}
    var svg='<svg viewBox="0 0 '+W+' '+H+'" class="tl"><line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="var(--line)"/><line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(mx/2)+'" y2="'+y(mx/2)+'" stroke="var(--line)" stroke-dasharray="3 4"/><text x="'+L+'" y="11" class="ax">'+money(mx)+'</text>';
    svg+=(showRet?line(ret,COL.net,xs,y):"")+(showSp?line(sp,COL.loss,xs,y):"");
    var li=[0,Math.floor((n-1)/2),n-1].filter(function(v,i,a){return a.indexOf(v)===i});
    li.forEach(function(i){svg+='<text x="'+xs[i]+'" y="'+(H-6)+'" text-anchor="'+(i===0&&n>1?"start":i===n-1&&n>1?"end":"middle")+'" class="ax">'+blabel(bs[i].k)+'</text>'});
    svg+='</svg>';
    var lg='<div class="lgd">'+(showSp?'<span><i style="background:'+COL.loss+'"></i>Spend '+money(sp[n-1])+'</span>':'')+(showRet?'<span><i style="background:'+COL.net+'"></i>Return '+money(ret[n-1])+'</span>':'')+'<em>latest '+(TR.gran==="year"?"year":TR.gran==="month"?"month":"day")+'</em></div>';
    el.innerHTML=svg+lg;
  });
}
function syncTg(){[["gran","gran"],["ser","ser"]].forEach(function(p){var g=document.getElementById(p[0]);Array.prototype.forEach.call(g.children,function(b){b.setAttribute("aria-pressed",b.getAttribute("data-v")===TR[p[1]])})})}
["gran","ser"].forEach(function(id){document.getElementById(id).addEventListener("click",function(e){var v=e.target.getAttribute&&e.target.getAttribute("data-v");if(!v)return;TR[id]=v;try{localStorage.setItem("pf-tr",JSON.stringify(TR))}catch(x){}syncTg();drawTrends()})});
function renderAll(){renderTiles();draw();syncTg()}
fillValues();renderAll();
})();
</script></body></html>
