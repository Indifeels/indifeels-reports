<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style><title>Profit Flow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap">
<style>
:root{--bg:#f5f2ff;--surface:#fff;--fg:#1a1640;--muted:#655f8f;--line:#e2dcfa;--green:#1fa968;--red:#e5484d;
--glow1:rgba(255,77,141,.2);--glow2:rgba(76,110,245,.2);--glow3:rgba(18,184,134,.18);
--display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--body:"Figtree",ui-sans-serif,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111214;--surface:#1c1d20;--fg:#f5f5f6;--muted:#bec0c5;--line:#3c3d40;--green:#3ddc84;--red:#ff7b7f;color-scheme:dark}}
:root[data-theme=dark]{--bg:#111214;--surface:#1c1d20;--fg:#f5f5f6;--muted:#bec0c5;--line:#3c3d40;--green:#3ddc84;--red:#ff7b7f;color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(60rem 38rem at 8% -8%,var(--glow1),transparent 62%),radial-gradient(52rem 38rem at 100% 6%,var(--glow2),transparent 62%),radial-gradient(56rem 40rem at 45% 108%,var(--glow3),transparent 62%);background-attachment:fixed;color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;padding:28px 16px 48px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,7vw,3.4rem);line-height:1;letter-spacing:-.02em;background:linear-gradient(90deg,#ff4d8d,#ff9d5c 45%,#ffd23f);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:6px 0 0;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;border-radius:22px;padding:14px 16px;color:#f5f5f6;display:flex;flex-direction:column;gap:3px;min-width:0;background:linear-gradient(145deg,#424347,#2a2b2e 40%,#161719);box-shadow:14px 16px 20px -8px rgba(0,0,0,.75),5px 6px 8px -4px rgba(0,0,0,.5),inset 10px 10px 18px -12px rgba(255,255,255,.16),inset -12px -12px 20px -12px rgba(0,0,0,.6);outline:2px solid transparent;transition:transform .12s}
.tile:active{transform:scale(.98)}
.tile:focus-visible{outline-color:#35d0e6}
.tile[aria-pressed=true]{outline:2px solid #ffb347;box-shadow:0 0 0 4px rgba(255,179,71,.18),14px 16px 20px -8px rgba(0,0,0,.75)}
.tile .k{font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#bec0c5}
.tile .v{font-family:var(--display);font-weight:800;font-size:clamp(1.15rem,4.6vw,1.8rem);line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .s{font-size:.78rem;color:#bec0c5;font-variant-numeric:tabular-nums}
.tile .s b{font-weight:700}.pos{color:#3ddc84}.neg{color:#ff7b7f}
.box{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;min-width:0}
.ptitle{margin:2px 4px 10px;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sc{}
svg{display:block;width:100%;max-width:560px;margin:0 auto;height:auto}
svg text{font-family:var(--body);fill:var(--fg);paint-order:stroke;stroke:var(--surface);stroke-width:3.5px;stroke-linejoin:round}
.nm{font-size:12px;font-weight:700}.vl{font-size:12px;font-weight:500;fill:var(--muted)}.big{font-size:14px;font-weight:800}
.fr{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px solid var(--line);font-size:.9rem}.fr b{font-variant-numeric:tabular-nums}.posbg b{color:var(--green)}.negbg b{color:var(--red)}
table.ct{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.86rem}table.ct th,table.ct td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}table.ct th:first-child{text-align:left;font-weight:700}table.ct thead th{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}table.ct tr.tot th,table.ct tr.tot td{font-weight:800;border-bottom:0}table.ct .pos{color:var(--green)}table.ct .neg{color:var(--red)}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin:4px 4px 0}.hero span{font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}.hero b{font-family:var(--display);font-size:clamp(1.7rem,8vw,2.4rem);font-variant-numeric:tabular-nums;line-height:1.1}
.pos{color:var(--green)}.neg{color:var(--red)}.sub2{margin:6px 4px 14px;font-size:1.05rem}
.bar{display:flex;height:26px;border-radius:13px;overflow:hidden;margin:0 4px 12px}.bar i{display:block;min-width:3px}
.lg{display:grid;grid-template-columns:14px 1fr auto 56px;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line)}.lg i{width:12px;height:12px;border-radius:4px}.lg b{font-variant-numeric:tabular-nums}.lg em{font-style:normal;color:var(--muted);font-size:.85rem;text-align:right}
.cd{background:var(--bg);border-radius:14px;padding:12px 14px;margin:0 4px 10px}.cn{font-family:var(--display);font-weight:800;font-size:1.05rem;margin-bottom:6px}.cd .row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:.95rem}.cd .row span{color:var(--muted)}.cd .row b{font-variant-numeric:tabular-nums;text-align:right}
.fr.tot{border-bottom:0}.fr.tot span,.fr.tot b{font-weight:800;font-size:1.05rem}
.note{margin:10px 4px 2px;font-size:.76rem;color:var(--muted)}
.sum{margin-top:12px}
.pill{border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.85rem;color:var(--muted)}
.pill b{display:block;font-size:1.05rem;color:var(--fg);font-variant-numeric:tabular-nums}
</style></head><body>
<div class="wrap">
  <header><h1>Profit Flow</h1><p class="sub">Indifeels Australia · AUD · Melbourne time · as at __UPDATED__</p></header>
  <section class="tiles" id="tiles" aria-label="Choose period"></section>
  <section class="box"><h2 class="ptitle" id="ptitle"></h2><div id="hero"></div><div class="bar" id="bar"></div><div id="leg"></div></section>
  <section class="box"><h2 class="ptitle">Is each channel worth it?</h2><div id="cards"></div></section>
  <section class="box"><h2 class="ptitle">The maths</h2><div id="wf"></div><p class="note" id="note"></p></section>
</div>
<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
var D=JSON.parse(document.getElementById("data").textContent),ROWS=D.rows,CFG=D.cfg,TODAY="__TODAY__";
var GST=1/11;
function dim(s){var a=s.split("-");return new Date(+a[0],+a[1],0).getDate()}
function money(n){var r=Math.round(n);return(r<0?"-":"")+"$"+Math.abs(r).toLocaleString("en-AU")}
function addDays(s,n){var d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function monday(s){var d=new Date(s+"T00:00:00Z");return addDays(s,-((d.getUTCDay()+6)%7))}
var PERIODS=[{id:"today",label:"Today",from:TODAY},{id:"week",label:"This week",from:monday(TODAY)},{id:"month",label:"This month",from:TODAY.slice(0,8)+"01"}];
var CH=[["G","Google"],["F","Facebook"],["O","Organic & other"]];
function calc(from){
  var rs=ROWS.filter(function(r){return r.d>=from&&r.d<=TODAY});
  var c={days:rs.length,ch:{},g:0,m:0};
  CH.forEach(function(x){c.ch[x[0]]={card:0,cash:0}});
  var fl=CFG.fixed_monthly.filter(function(f){return f.amount!=null}),fixed=fl.map(function(f){return{name:f.name,v:0}});
  rs.forEach(function(r){c.g+=r.g;c.m+=r.m;CH.forEach(function(x){c.ch[x[0]].card+=r[x[0]][0];c.ch[x[0]].cash+=r[x[0]][1]});
    fl.forEach(function(f,i){fixed[i].v+=f.amount/dim(r.d)})});
  c.sales=0;c.gst=0;c.prod=0;
  CH.forEach(function(x){var h=c.ch[x[0]];h.sales=h.card+h.cash;h.gst=h.card*GST;h.prod=h.sales*CFG.product_cost_pct;
    h.ad=x[0]==="G"?c.g:x[0]==="F"?c.m:0;h.profit=h.sales-h.gst-h.prod-h.ad;
    c.sales+=h.sales;c.gst+=h.gst;c.prod+=h.prod});
  c.card=CH.reduce(function(a,x){return a+c.ch[x[0]].card},0);c.cash=c.sales-c.card;
  c.fixed=fixed;c.fx=fixed.reduce(function(a,b){return a+b.v},0);
  c.pbf=c.sales-c.gst-c.prod-c.g-c.m;c.net=c.pbf-c.fx;c.costs=c.gst+c.prod+c.g+c.m+c.fx;
  return c;
}
var cur="today",tilesEl=document.getElementById("tiles");
try{var s=localStorage.getItem("pf-period");if(s&&PERIODS.some(function(p){return p.id===s}))cur=s}catch(e){}
function renderTiles(){
  tilesEl.innerHTML="";
  PERIODS.forEach(function(p){
    var c=calc(p.from),b=document.createElement("button");b.type="button";b.className="tile";b.setAttribute("aria-pressed",p.id===cur);
    b.innerHTML='<span class="k">'+p.label+'</span><span class="v">'+money(c.sales)+'</span><span class="s">Net <b class="'+(c.net>=0?"pos":"neg")+'">'+money(c.net)+'</b></span>';
    b.onclick=function(){cur=p.id;try{localStorage.setItem("pf-period",cur)}catch(e){}renderTiles();draw()};
    tilesEl.appendChild(b)});
}
var COL={G:"#ffb703",F:"#4c6ef5",O:"#12b886",gst:"#9b8cc9",prod:"#f08c4a",ads:"#ffb703",fixed:"#ff6b6b",net:"#2fbf71",loss:"#e5484d"};
function roas(a,b){return b>0?"$"+(a/b).toFixed(2).replace(/\.00$/,"")+" back per $1":"no ad spend"}
function draw(){
  var p=PERIODS.filter(function(x){return x.id===cur})[0],c=calc(p.from),loss=c.net<0,S=Math.max(c.sales,1);
  document.getElementById("ptitle").textContent=p.label+(c.days>1?" · "+c.days+" days":"");
  var keep=c.net/S*100;
  document.getElementById("hero").innerHTML='<div class="hero"><span>Sold</span><b>'+money(c.sales)+'</b><span>You keep</span><b class="'+(loss?"neg":"pos")+'">'+money(c.net)+'</b></div><p class="sub2">Out of every $100 sold, you keep <b class="'+(loss?"neg":"pos")+'">$'+keep.toFixed(0)+'</b>.</p>';
  var parts=[["Product cost",c.prod,COL.prod],["GST",c.gst,COL.gst],["Ads",c.g+c.m,COL.ads],["Fixed costs",c.fx,COL.fixed],[loss?"Loss":"You keep",Math.abs(c.net),loss?COL.loss:COL.net]];
  var tot=parts.reduce(function(a,x){return a+x[1]},0)||1;
  document.getElementById("bar").innerHTML=parts.map(function(x){return'<i style="width:'+(x[1]/tot*100)+'%;background:'+x[2]+'"></i>'}).join("");
  document.getElementById("leg").innerHTML=parts.map(function(x){return'<div class="lg"><i style="background:'+x[2]+'"></i><span>'+x[0]+'</span><b>'+money(x[1])+'</b><em>$'+(x[1]/S*100).toFixed(0)+'</em></div>'}).join("");
  function card(name,h,color,ads){
    var good=h.profit>=0;
    return'<div class="cd" style="border-left:6px solid '+color+'"><div class="cn">'+name+'</div>'+
      (ads?'<div class="row"><span>Spent on ads</span><b>'+money(h.ad)+'</b></div>':'')+
      '<div class="row"><span>Sales it brought</span><b>'+money(h.sales)+'</b></div>'+
      (ads?'<div class="row"><span>Return</span><b>'+roas(h.sales,h.ad)+'</b></div>':'')+
      '<div class="row"><span>'+(ads?'Left after product, GST and ads':'Left after product and GST')+'</span><b class="'+(good?"pos":"neg")+'">'+money(h.profit)+'</b></div></div>'}
  document.getElementById("cards").innerHTML=card("Google Ads",c.ch.G,COL.G,true)+card("Meta (Facebook) Ads",c.ch.F,COL.F,true)+card("Everything else (organic, calls, repeat)",c.ch.O,COL.O,false);
  var rows=[["Sales",c.sales,""],["– Product cost",-c.prod,""],["– GST (card sales)",-c.gst,""],["– Google Ads",-c.g,""],["– Meta Ads",-c.m,""]].concat(c.fixed.map(function(f){return["– "+f.name,-f.v,"fx"]}));
  document.getElementById("wf").innerHTML=rows.map(function(r){return'<div class="fr '+r[2]+'"><span>'+r[0]+'</span><b>'+money(r[1])+'</b></div>'}).join("")+'<div class="fr tot"><span>You keep</span><b class="'+(loss?"neg":"pos")+'">'+money(c.net)+'</b></div>';
  var unset=CFG.fixed_monthly.filter(function(f){return f.amount==null}).map(function(f){return f.name});
  document.getElementById("note").textContent="Product cost is a flat "+Math.round(CFG.product_cost_pct*100)+"% of sales for now. GST only on card sales. Google sales = Google web orders plus part of Google store visits; Meta = all Facebook orders; everything else is the rest. Fixed costs are monthly amounts spread per day."+(unset.length?" Not set yet: "+unset.join(", ")+".":"");
}
renderTiles();draw();
})();
</script></body></html>
