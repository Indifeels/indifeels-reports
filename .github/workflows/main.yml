name: Refresh Google Tracked report

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/manual-refresh-google-tracked.txt"
  schedule:
    # Candidate UTC hours cover Sydney 20:00 and 06:00 across AEST/AEDT.
    - cron: "0 9,10,19,20 * * *"

permissions:
  contents: write

concurrency:
  group: indifeels-google-tracked
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Sydney time gate
        id: gate
        run: |
          HM=$(TZ=Australia/Sydney date +%H%M)
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          elif { [ "$HM" -ge 2000 ] && [ "$HM" -le 2045 ]; } || { [ "$HM" -ge 0600 ] && [ "$HM" -le 0645 ]; }; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "Not within Sydney 20:00-20:45 or 06:00-06:45 ($HM); skipping"
            echo "go=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout reports
        if: steps.gate.outputs.go == '1'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.gate.outputs.go == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        if: steps.gate.outputs.go == '1'
        run: pip install cryptography

      - name: Set Sydney report cutoff
        if: steps.gate.outputs.go == '1'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os
          from datetime import datetime, timedelta, time
          from zoneinfo import ZoneInfo
          tz=ZoneInfo("Australia/Sydney")
          now=datetime.now(tz)
          event=os.environ.get("EVENT_NAME","")
          if now.hour == 6 or (event != "schedule" and now.hour < 12):
              day=now.date()-timedelta(days=1)
              cutoff=datetime.combine(day,time(23,59,59),tzinfo=tz)
          else:
              cutoff=now
          print("REPORT_NOW="+cutoff.isoformat())
          PY

      - name: Validate report contract
        if: steps.gate.outputs.go == '1'
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          GOOGLE_TRACKED_KEY: ${{ secrets.GOOGLE_TRACKED_KEY }}
        run: python3 tools/report_preflight.py --phase pre google-tracked

      - name: Fetch live Google Ads data
        if: steps.gate.outputs.go == '1'
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          WINDSOR_GOOGLE_ACCOUNT: "788-887-6041"
        run: |
          mkdir -p .refresh/google
          python3 tools/fetch_google_tracked.py .refresh/google/data.json

      - name: Build live Google report
        if: steps.gate.outputs.go == '1'
        run: |
          python3 tools/google_tracked.py \
            .refresh/google/data.json \
            .refresh/google/google-tracked.html \
            .refresh/google/google-tracked.meta.json

      - name: Encrypt Google report
        if: steps.gate.outputs.go == '1'
        env:
          GOOGLE_TRACKED_KEY: ${{ secrets.GOOGLE_TRACKED_KEY }}
        run: |
          python3 - <<'PY'
          import base64, gzip, json, os, secrets
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          key=base64.b64decode(os.environ["GOOGLE_TRACKED_KEY"].strip())
          if len(key) != 32:
              raise SystemExit("GOOGLE_TRACKED_KEY must decode to 32 bytes")

          def enc(data):
              iv=secrets.token_bytes(12)
              return iv + AESGCM(key).encrypt(iv, gzip.compress(data,9), None)

          html=open(".refresh/google/google-tracked.html","rb").read()
          meta=open(".refresh/google/google-tracked.meta.json","rb").read()
          os.makedirs(".refresh/out",exist_ok=True)
          open(".refresh/out/google-tracked.bin","wb").write(enc(html))
          open(".refresh/out/google-tracked.meta.bin","wb").write(enc(meta))
          PY
          test -s .refresh/out/google-tracked.bin
          test -s .refresh/out/google-tracked.meta.bin

      - name: Publish Google report
        if: steps.gate.outputs.go == '1'
        run: |
          cp .refresh/out/google-tracked.bin r/google-tracked.bin
          cp .refresh/out/google-tracked.meta.bin r/google-tracked.meta.bin
          python3 tools/report_preflight.py --phase post google-tracked
          python3 tools/status.py r google-tracked ok

          git config user.name "github-actions[bot]"
          git config user.email "41898273+github-actions[bot]@users.noreply.github.com"
          git add r/google-tracked.bin r/google-tracked.meta.bin r/status.json

          if git diff --cached --quiet; then
            echo "No Google report changes"
          else
            git commit -m "Refresh Google tracked report"
            for i in 1 2 3; do
              git pull --rebase -q origin main
              git push -q origin HEAD:main && exit 0
              sleep 5
            done
            exit 1
          fi

      - name: Record failed Google refresh
        if: failure() && steps.gate.outputs.go == '1'
        run: |
          python3 tools/status.py r google-tracked fail "Google tracked refresh failed; check GitHub Actions"
          git config user.name "github-actions[bot]"
          git config user.email "41898273+github-actions[bot]@users.noreply.github.com"
          git add r/status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record failed Google tracked refresh"
          for i in 1 2 3; do
            git pull --rebase -q origin main
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 0
