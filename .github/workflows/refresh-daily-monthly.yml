name: Refresh Daily and Monthly reports

run-name: "${{ github.event.action == 'report-schedule' && format('Schedule {0}', github.event.client_payload.schedule_group) || github.workflow }}"

on:
  repository_dispatch:
    types: [report-schedule]
  workflow_dispatch:
  push:
    paths:
      - ".github/manual-refresh-daily-monthly.txt"

permissions:
  contents: write

concurrency:
  # Per-workflow lock: prevents duplicate runs of this workflow from cancelling unrelated report refreshes.
  group: ${{ github.event.action == 'report-schedule' && !(contains(github.event.client_payload.report_ids, 'daily') || contains(github.event.client_payload.report_ids, 'monthly')) && format('ignored-{0}', github.event.client_payload.schedule_group) || 'indifeels-daily-monthly' }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event.action != 'report-schedule' || (contains(github.event.client_payload.report_ids, 'daily') || contains(github.event.client_payload.report_ids, 'monthly'))
    runs-on: ubuntu-latest

    steps:
      - name: Schedule Panel dispatch gate
        id: gate
        run: |
          echo "go=1" >> "$GITHUB_OUTPUT"

      - name: Checkout reports
        if: steps.gate.outputs.go == '1'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.gate.outputs.go == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.go == '1'
        run: pip install cryptography pillow

      - name: Set Sydney report cutoff
        if: steps.gate.outputs.go == '1'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os
          from datetime import datetime, timedelta, time
          from zoneinfo import ZoneInfo
          tz=ZoneInfo("Australia/Melbourne")
          now=datetime.now(tz)
          event=os.environ.get("EVENT_NAME","")
          # Morning scheduled run, or a manual/push recovery before noon:
          # publish the previous completed Sydney day to the front tiles.
          if now.hour == 6 or (event != "schedule" and now.hour < 12):
              yesterday=now.date()-timedelta(days=1)
              cutoff=datetime.combine(yesterday,time(23,59,59),tzinfo=tz)
          else:
              # 8 PM preview and afternoon/evening manual refreshes:
              # current Sydney day through refresh time.
              cutoff=now
          print("REPORT_NOW="+cutoff.isoformat())
          PY

      - name: Validate report contract
        if: steps.gate.outputs.go == '1'
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          SYNC_READ_TOKEN: ${{ secrets.SYNC_READ_TOKEN }}
        run: python3 tools/report_preflight.py --phase pre daily monthly

      - name: Fetch live read-only inputs
        if: steps.gate.outputs.go == '1'
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          SHOPIFY_SHOP: bvdxj3-r8.myshopify.com
        run: |
          mkdir -p .refresh/data .refresh/hub .refresh/sum .refresh/out
          python3 tools/fetch_reports.py .refresh/data

      - name: Reconcile Shopify attribution
        if: steps.gate.outputs.go == '1'
        env:
          SYNC_READ_TOKEN: ${{ secrets.SYNC_READ_TOKEN }}
        run: python3 tools/reconcile_order_attribution.py .refresh/data

      - name: Build existing reports
        if: steps.gate.outputs.go == '1'
        env:
          SUMMARY_DIR: .refresh/sum
        run: |
          python3 - <<'PYCODE'
          import json,os,subprocess
          event=json.load(open(os.environ['GITHUB_EVENT_PATH']))
          ids=event.get('client_payload',{}).get('report_ids',['daily','monthly'])
          for rid,script in [('daily','build.py'),('monthly','monthly.py')]:
              if rid in ids: subprocess.run(['python3','tools/'+script,'.refresh/data','.refresh/hub/'+rid+'.html'],check=True)
          PYCODE

      - name: Retrieve existing report keys and encrypt
        if: steps.gate.outputs.go == '1'
        env:
          SYNC_READ_TOKEN: ${{ secrets.SYNC_READ_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          url="https://yrigvovwyfpaybibfjva.supabase.co/rest/v1/rpc/sync_get_report_keys"
          key="sb_publishable_8xv46B6mvnAN2McGDc4VEg_pNF0qHvD"
          event=json.load(open(os.environ['GITHUB_EVENT_PATH']))
          ids=[x for x in event.get('client_payload',{}).get('report_ids',['daily','monthly']) if x in ['daily','monthly']]
          body=json.dumps({"p_token":os.environ["SYNC_READ_TOKEN"],"p_report_ids":ids}).encode()
          req=urllib.request.Request(url,data=body,headers={"apikey":key,"Content-Type":"application/json"})
          rows=json.load(urllib.request.urlopen(req,timeout=60))
          keys={r["report_id"]:r["key_b64"] for r in rows}
          if set(keys)!=set(ids):
              raise RuntimeError("Missing existing report encryption key")
          json.dump(keys,open(".refresh/keys.json","w"))
          PY

          python3 tools/encrypt.py \
            .refresh/keys.json \
            .refresh/sum \
            .refresh/hub \
            .refresh/out

          python3 - <<'PYCODE'
          import json,os,pathlib
          event=json.load(open(os.environ['GITHUB_EVENT_PATH']))
          ids=event.get('client_payload',{}).get('report_ids',['daily','monthly'])
          for rid in ['daily','monthly']:
              if rid in ids:
                  for suffix in ['.bin','.meta.bin']:
                      p=pathlib.Path('.refresh/out/'+rid+suffix)
                      assert p.exists() and p.stat().st_size>0,'Missing encrypted output: '+str(p)
          PYCODE

      - name: Publish only after successful validation
        if: steps.gate.outputs.go == '1'
        run: |
          python3 - <<'PYCODE'
          import json,os,shutil,subprocess
          event=json.load(open(os.environ['GITHUB_EVENT_PATH']))
          ids=event.get('client_payload',{}).get('report_ids',['daily','monthly'])
          for rid in ['daily','monthly']:
              if rid not in ids: continue
              for suffix in ['.bin','.meta.bin']:
                  shutil.copyfile('.refresh/out/'+rid+suffix,'r/'+rid+suffix)
              subprocess.run(['python3','tools/report_preflight.py','--phase','post',rid],check=True)
              subprocess.run(['python3','tools/status.py','r',rid,'ok'],check=True)
          PYCODE

          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"

          git add \
            r/daily.bin \
            r/daily.meta.bin \
            r/monthly.bin \
            r/monthly.meta.bin \
            r/status.json

          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "Refresh Daily and Monthly reports"
            for i in 1 2 3; do
              git pull --rebase -q origin main
              git push -q origin HEAD:main && exit 0
              sleep 5
            done
            exit 1
          fi

      - name: Record failed refresh
        if: failure() && steps.gate.outputs.go == '1'
        run: |
          python3 - <<'PYCODE'
          import json,os,subprocess
          event=json.load(open(os.environ['GITHUB_EVENT_PATH']))
          ids=event.get('client_payload',{}).get('report_ids',['daily','monthly'])
          for rid in ['daily','monthly']:
              if rid in ids: subprocess.run(['python3','tools/status.py','r',rid,'fail','Daily/Monthly workflow failed; check GitHub Actions'],check=True)
          PYCODE

          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add r/status.json

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Record failed Daily and Monthly refresh"
          for i in 1 2 3; do
            git pull --rebase -q origin main
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 0

