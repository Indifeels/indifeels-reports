name: Refresh Daily and Monthly reports

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/manual-refresh-daily-monthly.txt"
  schedule:
    # GitHub cron is UTC. These four UTC candidates cover Sydney standard/daylight time.
    # The Sydney-time gate below allows only 20:00 and 06:00 local.
    - cron: "0 9,10,19,20 * * *"

permissions:
  contents: write

concurrency:
  # Shared repository write lock: prevents report workflows from changing r/* and status.json at the same time.
  group: indifeels-reports-repo-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Sydney time gate
        id: gate
        run: |
          H=$(TZ=Australia/Sydney date +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$H" = "20" ] || [ "$H" = "06" ]; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "Not a Sydney 20:00/06:00 run hour ($H); skipping"
            echo "go=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout reports
        if: steps.gate.outputs.go == '1'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.gate.outputs.go == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.go == '1'
        run: pip install cryptography

      - name: Set Sydney report cutoff
        if: steps.gate.outputs.go == '1'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os
          from datetime import datetime, timedelta, time
          from zoneinfo import ZoneInfo
          tz=ZoneInfo("Australia/Sydney")
          now=datetime.now(tz)
          if now.hour == 6:
              # 6 AM final: freeze the previous completed Sydney day.
              yesterday=now.date()-timedelta(days=1)
              cutoff=datetime.combine(yesterday,time(23,59,59),tzinfo=tz)
          else:
              # 8 PM preview and other manual refreshes: current Sydney day through refresh time.
              cutoff=now
          print("REPORT_NOW="+cutoff.isoformat())
          PY

      - name: Fetch live read-only inputs
        if: steps.gate.outputs.go == '1'
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          SHOPIFY_SHOP: bvdxj3-r8.myshopify.com
        run: |
          mkdir -p .refresh/data .refresh/hub .refresh/sum .refresh/out
          python3 tools/fetch_reports.py .refresh/data

      - name: Build existing reports
        if: steps.gate.outputs.go == '1'
        env:
          SUMMARY_DIR: .refresh/sum
        run: |
          python3 tools/build.py .refresh/data .refresh/hub/daily.html
          python3 tools/monthly.py .refresh/data .refresh/hub/monthly.html

      - name: Retrieve existing report keys and encrypt
        if: steps.gate.outputs.go == '1'
        env:
          SYNC_READ_TOKEN: ${{ secrets.SYNC_READ_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          url="https://yrigvovwyfpaybibfjva.supabase.co/rest/v1/rpc/sync_get_report_keys"
          key="sb_publishable_8xv46B6mvnAN2McGDc4VEg_pNF0qHvD"
          body=json.dumps({"p_token":os.environ["SYNC_READ_TOKEN"],"p_report_ids":["daily","monthly"]}).encode()
          req=urllib.request.Request(url,data=body,headers={"apikey":key,"Content-Type":"application/json"})
          rows=json.load(urllib.request.urlopen(req,timeout=60))
          keys={r["report_id"]:r["key_b64"] for r in rows}
          if set(keys)!= {"daily","monthly"}:
              raise RuntimeError("Missing existing report encryption key")
          json.dump(keys,open(".refresh/keys.json","w"))
          PY

          python3 tools/encrypt.py \
            .refresh/keys.json \
            .refresh/sum \
            .refresh/hub \
            .refresh/out

          test -s .refresh/out/daily.bin
          test -s .refresh/out/daily.meta.bin
          test -s .refresh/out/monthly.bin
          test -s .refresh/out/monthly.meta.bin

      - name: Publish only after successful validation
        if: steps.gate.outputs.go == '1'
        run: |
          cp .refresh/out/daily.bin r/daily.bin
          cp .refresh/out/daily.meta.bin r/daily.meta.bin
          cp .refresh/out/monthly.bin r/monthly.bin
          cp .refresh/out/monthly.meta.bin r/monthly.meta.bin

          python3 tools/status.py r daily ok
          python3 tools/status.py r monthly ok

          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"

          git add \
            r/daily.bin \
            r/daily.meta.bin \
            r/monthly.bin \
            r/monthly.meta.bin \
            r/status.json

          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "Refresh Daily and Monthly reports"
            for i in 1 2 3; do
              git pull --rebase -q origin main
              git push -q origin HEAD:main && exit 0
              sleep 5
            done
            exit 1
          fi

      - name: Record failed refresh
        if: failure() && steps.gate.outputs.go == '1'
        run: |
          python3 tools/status.py r daily fail "Daily/Monthly workflow failed; check GitHub Actions"
          python3 tools/status.py r monthly fail "Daily/Monthly workflow failed; check GitHub Actions"

          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add r/status.json

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Record failed Daily and Monthly refresh"
          for i in 1 2 3; do
            git pull --rebase -q origin main
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 0
