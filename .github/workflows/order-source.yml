name: Refresh Order Source report

run-name: "${{ github.event.action == 'report-schedule' && format('Schedule {0}', github.event.client_payload.schedule_group) || github.workflow }}"

on:
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-order-source, report-schedule]
  push:
    paths:
      - ".github/manual-refresh-order-source.txt"

permissions:
  contents: write

concurrency:
  group: indifeels-order-source
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event.action != 'report-schedule' || (contains(github.event.client_payload.report_ids, 'order-source'))
    runs-on: ubuntu-latest

    steps:
      - name: Schedule Panel dispatch gate
        id: gate
        run: |
          echo "go=1" >> "$GITHUB_OUTPUT"

      - name: Checkout reports
        if: steps.gate.outputs.go == '1'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.gate.outputs.go == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        if: steps.gate.outputs.go == '1'
        run: pip install cryptography

      - name: Load Order Source encryption key
        if: steps.gate.outputs.go == '1'
        env:
          SYNC_READ_TOKEN: ${{ secrets.SYNC_READ_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, urllib.request

          cfg = open("config.js", encoding="utf-8").read()
          url = re.search(r'url:\s*"([^"]+)"', cfg).group(1)
          anon = re.search(r'key:\s*"([^"]+)"', cfg).group(1)
          req = urllib.request.Request(
              url + "/rest/v1/rpc/sync_get_report_keys",
              method="POST",
              data=json.dumps({
                  "p_token": os.environ["SYNC_READ_TOKEN"],
                  "p_report_ids": ["order-source"],
              }).encode(),
              headers={"apikey": anon, "Content-Type": "application/json"},
          )
          rows = json.load(urllib.request.urlopen(req, timeout=60))
          if not rows or not rows[0].get("key_b64"):
              raise SystemExit("Order Source encryption key is unavailable in Supabase")
          key = rows[0]["key_b64"].strip()
          if len(base64.b64decode(key)) != 32:
              raise SystemExit("Order Source encryption key is invalid")
          print("::add-mask::" + key)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("ORDER_SOURCE_KEY=" + key + "\n")
          print("Order Source encryption key loaded")
          PY

      - name: Validate report contract
        if: steps.gate.outputs.go == '1'
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
        run: python3 tools/report_preflight.py --phase pre order-source

      - name: Fetch Meta, Google Ads, GMB and Shopify data (data only, no calculation)
        if: steps.gate.outputs.go == '1'
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
        run: |
          mkdir -p .refresh/os
          python3 tools/fetch_order_source.py .refresh/os/data.json

      - name: Build and validate Order Source report (template comes from this checkout of main; validation failure stops publishing)
        if: steps.gate.outputs.go == '1'
        run: |
          python3 tools/order_source.py \
            .refresh/os/data.json \
            .refresh/os/order-source.html \
            .refresh/os/order-source.meta.json

      - name: Validate generated report renders (JS syntax + DOM smoke test; failure stops publishing)
        if: steps.gate.outputs.go == '1'
        run: |
          LEAD=$(python3 -c "import json;m=json.load(open('.refresh/os/order-source.meta.json'));print('Today' if m['stats'][0][1].endswith(' today') else 'Yesterday')")
          mkdir -p .refresh/jsdom
          (cd .refresh/jsdom && npm init -y >/dev/null && npm install jsdom --no-audit --no-fund --silent)
          echo "NODE_PATH=$PWD/.refresh/jsdom/node_modules" >> "$GITHUB_ENV"
          NODE_PATH="$PWD/.refresh/jsdom/node_modules" node tools/validate_order_source.js .refresh/os/order-source.html "$LEAD"
          echo "ORDER_SOURCE_LEAD=$LEAD" >> "$GITHUB_ENV"

      - name: Encrypt Order Source report
        if: steps.gate.outputs.go == '1'
        run: |
          python3 - <<'PY'
          import base64, gzip, json, os, secrets
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          key=base64.b64decode(os.environ["ORDER_SOURCE_KEY"].strip())
          if len(key) != 32:
              raise SystemExit("ORDER_SOURCE_KEY must decode to 32 bytes")

          def enc(data):
              iv=secrets.token_bytes(12)
              return iv + AESGCM(key).encrypt(iv, gzip.compress(data,9), None)

          html=open(".refresh/os/order-source.html","rb").read()
          meta=open(".refresh/os/order-source.meta.json","rb").read()
          os.makedirs(".refresh/out",exist_ok=True)
          open(".refresh/out/order-source.bin","wb").write(enc(html))
          open(".refresh/out/order-source.meta.bin","wb").write(enc(meta))
          PY
          test -s .refresh/out/order-source.bin
          test -s .refresh/out/order-source.meta.bin

      - name: Validate the ENCRYPTED report decrypts to a page that renders
        if: steps.gate.outputs.go == '1'
        run: |
          python3 - <<'PY'
          import base64, gzip, os
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          key=base64.b64decode(os.environ["ORDER_SOURCE_KEY"].strip())
          raw=open(".refresh/out/order-source.bin","rb").read()
          open(".refresh/os/roundtrip.html","wb").write(gzip.decompress(AESGCM(key).decrypt(raw[:12], raw[12:], None)))
          PY
          node tools/validate_order_source.js .refresh/os/roundtrip.html "$ORDER_SOURCE_LEAD"

      - name: Publish Order Source report
        if: steps.gate.outputs.go == '1'
        run: |
          cp .refresh/out/order-source.bin r/order-source.bin
          cp .refresh/out/order-source.meta.bin r/order-source.meta.bin
          python3 tools/report_preflight.py --phase post order-source
          python3 tools/status.py r order-source ok

          git config user.name "github-actions[bot]"
          git config user.email "41898273+github-actions[bot]@users.noreply.github.com"
          git add r/order-source.bin r/order-source.meta.bin r/status.json

          if git diff --cached --quiet; then
            echo "No Order Source report changes"
          else
            git commit -m "Refresh Order Source report"
            for i in 1 2 3; do
              git pull --rebase -q origin main
              git push -q origin HEAD:main && exit 0
              sleep 5
            done
            exit 1
          fi

      - name: Record failed Order Source refresh
        if: failure() && steps.gate.outputs.go == '1'
        run: |
          python3 tools/status.py r order-source fail "Order Source refresh failed; check GitHub Actions"
          git config user.name "github-actions[bot]"
          git config user.email "41898273+github-actions[bot]@users.noreply.github.com"
          git add r/status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record failed Order Source refresh"
          for i in 1 2 3; do
            git pull --rebase -q origin main
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 0

