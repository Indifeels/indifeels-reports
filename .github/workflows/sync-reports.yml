name: Sync reports from Supabase

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indifeels-reports-repo-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull manifest-owned files from Supabase outbox
        env:
          SYNC_READ_TOKEN: ${{ secrets.SYNC_READ_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, re, urllib.request

          cfg = open("config.js", encoding="utf-8").read()
          url = re.search(r'url:\s*"([^"]+)"', cfg).group(1)
          key = re.search(r'key:\s*"([^"]+)"', cfg).group(1)
          endpoint = url + "/rest/v1/rpc/sync_get_files"
          req = urllib.request.Request(
              endpoint,
              method="POST",
              data=json.dumps({"p_token": os.environ["SYNC_READ_TOKEN"]}).encode(),
              headers={"apikey": key, "Content-Type": "application/json"},
          )
          rows = json.load(urllib.request.urlopen(req, timeout=60))

          manifest = json.load(open("reports-manifest.json"))
          sync_reports = [r for r in manifest["reports"] if r.get("supabase_sync")]
          allowed_paths = {p for r in sync_reports for p in r.get("outputs", [])}
          status_ids = {r["id"] for r in sync_reports}

          state_path = ".github/sync_state.json"
          state = json.load(open(state_path)) if os.path.exists(state_path) else {}
          batches, n = set(), 0

          for r in rows:
              path = r["path"]
              assert path.startswith("r/") and "/" not in path[2:] and ".." not in path, path
              if path != "r/status.json" and path not in allowed_paths:
                  print("skip path not owned by Supabase sync:", path)
                  continue
              if state.get(path) == r["sha256"]:
                  continue

              raw = base64.b64decode(r["content_b64"])
              assert hashlib.sha256(raw).hexdigest() == r["sha256"], "checksum " + path
              os.makedirs("r", exist_ok=True)

              if path == "r/status.json":
                  new = json.loads(raw)
                  cur = json.load(open(path)) if os.path.exists(path) else {}
                  for report_id in status_ids:
                      if report_id in new:
                          cur[report_id] = new[report_id]
                  json.dump(cur, open(path, "w"), indent=1, sort_keys=True)
              else:
                  open(path, "wb").write(raw)

              state[path] = r["sha256"]
              batches.add(r["batch"])
              n += 1

          json.dump(state, open(state_path, "w"), indent=1, sort_keys=True)
          open(os.environ["GITHUB_ENV"], "a").write(
              "BATCH=" + " / ".join(sorted(batches)) + "\n"
          )
          print(f"new files: {n} of {len(rows)}")
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add r .github/sync_state.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "${BATCH:-Report sync}"
            for i in 1 2 3; do
              git pull --rebase -q origin main
              git push -q origin HEAD:main && exit 0
              sleep 5
            done
            exit 1
          fi
