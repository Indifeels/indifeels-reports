name: Restock Planner

# Restock Planner (owner view + supplier mirror): lifetime sales and stock per variant, migration-aware.
# Runs from the Schedule Panel or by hand. Supplier orders live in Supabase (restock_orders), not in this build.
run-name: "${{ github.event.action == 'report-schedule' && format('Schedule {0}', github.event.client_payload.schedule_group) || github.workflow }}"

on:
  repository_dispatch:
    types: [report-schedule]
  workflow_dispatch:

concurrency:
  # Per-workflow lock: prevents duplicate runs of this workflow from cancelling unrelated report refreshes.
  group: ${{ github.event.action == 'report-schedule' && !(contains(github.event.client_payload.report_ids, 'restock-plan')) && format('ignored-{0}', github.event.client_payload.schedule_group) || 'indifeels-restock-plan' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    if: (github.event.action != 'report-schedule' || (contains(github.event.client_payload.report_ids, 'restock-plan')))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Schedule Panel dispatch gate
        id: gate
        run: |
          echo "go=1" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == '1'
        with:
          ref: main

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == '1'
        with:
          python-version: "3.12"

      - name: Install report dependency
        if: steps.gate.outputs.go == '1'
        run: pip install cryptography

      - name: Validate report contract
        if: steps.gate.outputs.go == '1'
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          STOCK_KEY: ${{ secrets.STOCK_KEY }}
        run: python3 tools/report_preflight.py --phase pre restock-plan

      - name: Build Restock Planner
        if: steps.gate.outputs.go == '1'
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          SHOPIFY_SHOP: bvdxj3-r8.myshopify.com
          STOCK_KEY: ${{ secrets.STOCK_KEY }}
          SYNC_READ_TOKEN: ${{ secrets.SYNC_READ_TOKEN }}
        run: python3 tools/restock_plan.py

      - name: Verify report files
        if: steps.gate.outputs.go == '1'
        run: |
          test -s r/restock-plan.bin
          test -s r/restock-plan.meta.bin
          grep -q '"restock-plan"' r/status.json

      - name: Publish report
        if: always() && steps.gate.outputs.go == '1'
        run: |
          python3 tools/report_preflight.py --phase post restock-plan
          git config user.name "Indifeels restock planner bot"
          git config user.email "actions@users.noreply.github.com"
          git add r/status.json
          [ -f r/restock-plan.bin ] && git add r/restock-plan.bin || true
          [ -f r/restock-plan.meta.bin ] && git add r/restock-plan.meta.bin || true
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Restock Planner (${{ github.event.client_payload.order || github.event_name }})"
          for i in 1 2 3; do
            git pull --rebase -q origin main
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

