name: Refresh Facebook Tracked report

run-name: "${{ github.event.action == 'report-schedule' && format('Schedule {0}', github.event.client_payload.schedule_group) || github.workflow }}"

on:
  repository_dispatch:
    types: [report-schedule]
  workflow_dispatch:
  push:
    paths:
      - ".github/manual-refresh-facebook-tracked.txt"

permissions:
  contents: write

concurrency:
  group: ${{ github.event.action == 'report-schedule' && !(contains(github.event.client_payload.report_ids, 'facebook-tracked')) && format('ignored-{0}', github.event.client_payload.schedule_group) || 'indifeels-facebook-tracked' }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event.action != 'report-schedule' || (contains(github.event.client_payload.report_ids, 'facebook-tracked'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout reports
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install cryptography

      - name: Set report cutoff
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os
          from datetime import datetime, timedelta, time
          from zoneinfo import ZoneInfo
          tz=ZoneInfo("Australia/Melbourne")
          now=datetime.now(tz)
          event=os.environ.get("EVENT_NAME","")
          # Morning run (or a manual/push recovery before noon): previous completed day.
          # Afternoon/evening runs: current day through refresh time.
          if now.hour == 6 or (event != "schedule" and now.hour < 12):
              cutoff=datetime.combine(now.date()-timedelta(days=1),time(23,59,59),tzinfo=tz)
          else:
              cutoff=now
          print("REPORT_NOW="+cutoff.isoformat())
          PY

      - name: Validate report contract
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          SYNC_READ_TOKEN: ${{ secrets.SYNC_READ_TOKEN }}
        run: python3 tools/report_preflight.py --phase pre facebook-tracked

      - name: Fetch Meta tracked campaign data (read only)
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
        run: |
          mkdir -p .refresh/data .refresh/hub .refresh/sum .refresh/out
          python3 tools/fetch_fb_tracked.py .refresh/data

      - name: Build report
        env:
          SUMMARY_DIR: .refresh/sum
        run: python3 tools/fb_tracked.py .refresh/data .refresh/hub/facebook-tracked.html

      - name: Retrieve report key and encrypt
        env:
          SYNC_READ_TOKEN: ${{ secrets.SYNC_READ_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          url="https://yrigvovwyfpaybibfjva.supabase.co/rest/v1/rpc/sync_get_report_keys"
          key="sb_publishable_8xv46B6mvnAN2McGDc4VEg_pNF0qHvD"
          body=json.dumps({"p_token":os.environ["SYNC_READ_TOKEN"],"p_report_ids":["facebook-tracked"]}).encode()
          req=urllib.request.Request(url,data=body,headers={"apikey":key,"Content-Type":"application/json"})
          rows=json.load(urllib.request.urlopen(req,timeout=60))
          keys={r["report_id"]:r["key_b64"] for r in rows}
          if set(keys)!={"facebook-tracked"}:
              raise RuntimeError("Missing report encryption key for facebook-tracked")
          json.dump(keys,open(".refresh/keys.json","w"))
          PY
          python3 tools/encrypt.py .refresh/keys.json .refresh/sum .refresh/hub .refresh/out
          test -s .refresh/out/facebook-tracked.bin
          test -s .refresh/out/facebook-tracked.meta.bin

      - name: Publish only after successful validation
        run: |
          cp .refresh/out/facebook-tracked.bin r/facebook-tracked.bin
          cp .refresh/out/facebook-tracked.meta.bin r/facebook-tracked.meta.bin
          python3 tools/report_preflight.py --phase post facebook-tracked
          python3 tools/status.py r facebook-tracked ok

          git config user.name "github-actions[bot]"
          git config user.email "41898273+github-actions[bot]@users.noreply.github.com"
          git add r/facebook-tracked.bin r/facebook-tracked.meta.bin r/status.json

          if git diff --cached --quiet; then
            echo "No Facebook tracked report changes"
          else
            git commit -m "Refresh Facebook tracked report"
            for i in 1 2 3; do
              git pull --rebase -q origin main
              git push -q origin HEAD:main && exit 0
              sleep 5
            done
            exit 1
          fi

      - name: Record failed refresh
        if: failure()
        run: |
          python3 tools/status.py r facebook-tracked fail "Facebook tracked refresh failed; check GitHub Actions"
          git config user.name "github-actions[bot]"
          git config user.email "41898273+github-actions[bot]@users.noreply.github.com"
          git add r/status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record failed Facebook tracked refresh"
          for i in 1 2 3; do
            git pull --rebase -q origin main
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 0
