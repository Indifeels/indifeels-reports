name: Stock report refresh

# Moves 1 unit Backup -> Shop location for variants that hit 0 at Shop location, logs the moves for the
# app's tick list, and rebuilds the "Shop restock from Backup" report.
# Runs after every new order (Shopify Flow -> repository_dispatch "shopify-order"), at 7am, 3pm and 8pm
# Sydney time (each scheduled run starts about 6:40am / 2:40pm / 7:40pm so it's done by the hour; it also
# does the full website ST-number check), or by hand from the Actions tab.
# Cron is UTC, so both the AEST and AEDT hours are listed and the "Sydney time gate" step keeps only the right one.
on:
  repository_dispatch:
    types: [shopify-order]
  schedule:
    - cron: "40 19,20,3,4,8,9 * * *"
  workflow_dispatch:

concurrency:
  group: stock-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sydney time gate
        id: gate
        run: |
          H=$(TZ=Australia/Sydney date +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$H" = "06" ] || [ "$H" = "14" ] || [ "$H" = "19" ]; then echo "go=1" >> $GITHUB_OUTPUT; else echo "Not a Sydney run hour ($H), skipping"; echo "go=0" >> $GITHUB_OUTPUT; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == '1'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == '1'
        with:
          python-version: "3.12"
      - run: pip install cryptography
        if: steps.gate.outputs.go == '1'
      - name: Build stock report
        if: steps.gate.outputs.go == '1'
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          SHOPIFY_SHOP: bvdxj3-r8.myshopify.com
          STOCK_KEY: ${{ secrets.STOCK_KEY }}
          ORDER: ${{ github.event.client_payload.order || github.event_name }}
          FULL_CHECK: ${{ github.event_name != 'repository_dispatch' && '1' || '0' }}
        run: python3 tools/stock_fetch.py
      - name: Publish
        if: always() && steps.gate.outputs.go == '1'
        run: |
          git config user.name "Indifeels stock bot"
          git config user.email "actions@users.noreply.github.com"
          git add r/stock.bin r/stock.meta.bin r/stock_moves.bin r/status.json
          git diff --cached --quiet && exit 0
          git commit -m "Stock report (order ${{ github.event.client_payload.order || 'manual' }})"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
