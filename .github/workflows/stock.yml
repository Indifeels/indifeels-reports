name: Stock report refresh

# Handles three Shopify/reporting jobs:
# 1) after a new order, update stock movement/report;
# 2) auto-fill paid campaign attribution from Shopify Customer Journey UTMs;
# 3) after a manual attribution choice, sync it back to Shopify.
# It also runs stock/attribution checks at 7am, 3pm and 8pm Sydney time.
run-name: "${{ github.event.action == 'report-schedule' && format('Schedule {0}', github.event.client_payload.schedule_group) || github.workflow }}"

on:
  repository_dispatch:
    types: [shopify-order, order-attribution-update, report-schedule]
  workflow_dispatch:
  push:
    paths:
      - ".github/manual-refresh-stock.txt"

concurrency:
  # Per-workflow lock: prevents duplicate runs of this workflow from cancelling unrelated report refreshes.
  group: ${{ github.event.action == 'report-schedule' && !(contains(github.event.client_payload.report_ids, 'stock')) && format('ignored-{0}', github.event.client_payload.schedule_group) || 'indifeels-stock' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    if: (github.event.action != 'report-schedule' || (contains(github.event.client_payload.report_ids, 'stock'))) && github.event.action != 'shopify-order'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Schedule Panel dispatch gate
        id: gate
        run: |
          echo "go=1" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == '1'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == '1'
        with:
          python-version: "3.12"
      - run: pip install cryptography
        if: steps.gate.outputs.go == '1' && (github.event_name != 'repository_dispatch' || github.event.action == 'report-schedule')

      - name: Validate report contract
        if: steps.gate.outputs.go == '1' && (github.event_name != 'repository_dispatch' || github.event.action == 'report-schedule')
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          STOCK_KEY: ${{ secrets.STOCK_KEY }}
        run: python3 tools/report_preflight.py --phase pre stock

      - name: Refresh and auto-fill ad attribution
        if: steps.gate.outputs.go == '1' && (github.event_name != 'repository_dispatch' || github.event.action == 'report-schedule')
        continue-on-error: true
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          SYNC_READ_TOKEN: ${{ secrets.SYNC_READ_TOKEN }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          SHOPIFY_SHOP: bvdxj3-r8.myshopify.com
          WINDSOR_FACEBOOK_ACCOUNT: "1634084963432990"
          WINDSOR_GOOGLE_ACCOUNT: "788-887-6041"
        run: python3 tools/refresh_attribution_catalog.py

      - name: Build stock report
        if: steps.gate.outputs.go == '1' && (github.event_name != 'repository_dispatch' || github.event.action == 'report-schedule')
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          SHOPIFY_SHOP: bvdxj3-r8.myshopify.com
          STOCK_KEY: ${{ secrets.STOCK_KEY }}
          ORDER: ${{ github.event.client_payload.order || github.event_name }}
          FULL_CHECK: ${{ (github.event_name != 'repository_dispatch' || github.event.action == 'report-schedule') && '1' || '0' }}
        run: python3 tools/stock_fetch.py

      - name: Sync order attribution to Shopify
        if: steps.gate.outputs.go == '1' && github.event_name == 'repository_dispatch' && github.event.action == 'order-attribution-update'
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          SHOPIFY_SHOP: bvdxj3-r8.myshopify.com
          ORDER_ID: ${{ github.event.client_payload.order_id }}
          ORDER_SOURCE: ${{ github.event.client_payload.source }}
          ORDER_EMAIL: ${{ github.event.client_payload.email }}
          ORDER_PHONE: ${{ github.event.client_payload.phone }}
          CAMPAIGN_PLATFORM: ${{ github.event.client_payload.campaign_platform }}
          CAMPAIGN_ID: ${{ github.event.client_payload.campaign_id }}
          CAMPAIGN_NAME: ${{ github.event.client_payload.campaign_name }}
          ADSET_ID: ${{ github.event.client_payload.adset_id }}
          ADSET_NAME: ${{ github.event.client_payload.adset_name }}
          CALLBACK_TOKEN: ${{ github.event.client_payload.callback_token }}
        run: python3 tools/order_attribution_sync.py

      - name: Publish stock changes
        if: always() && steps.gate.outputs.go == '1' && (github.event_name != 'repository_dispatch' || github.event.action == 'report-schedule')
        run: |
          python3 tools/report_preflight.py --phase post stock
          git config user.name "Indifeels stock bot"
          git config user.email "actions@users.noreply.github.com"
          git add r/stock.bin r/stock.meta.bin r/stock_moves.bin r/status.json
          git diff --cached --quiet && exit 0
          git commit -m "Stock report (order ${{ github.event.client_payload.order || 'manual' }})"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1

