name: Product visibility report

# Unlisted in-stock products + active in-stock products with sales channels switched off.
run-name: "${{ github.event.action == 'report-schedule' && format('Schedule {0}', github.event.client_payload.schedule_group) || github.workflow }}"

on:
  repository_dispatch:
    types: [product-visibility-fix, report-schedule]
  workflow_dispatch:

concurrency:
  # Per-workflow lock: prevents duplicate runs of this workflow from cancelling unrelated report refreshes.
  group: ${{ github.event.action == 'report-schedule' && !(contains(github.event.client_payload.report_ids, 'product-visibility')) && format('ignored-{0}', github.event.client_payload.schedule_group) || 'indifeels-product-visibility' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.action != 'report-schedule' || (contains(github.event.client_payload.report_ids, 'product-visibility'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Schedule Panel dispatch gate
        id: gate
        run: |
          echo "go=1" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == '1'
        with:
          ref: main

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == '1'
        with:
          python-version: "3.12"

      - name: Install report dependency
        if: steps.gate.outputs.go == '1'
        run: pip install cryptography

      - name: Validate report contract
        if: steps.gate.outputs.go == '1'
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          STOCK_KEY: ${{ secrets.STOCK_KEY }}
        run: python3 tools/report_preflight.py --phase pre product-visibility

      - name: Fix Shopify product visibility
        if: steps.gate.outputs.go == '1' && github.event_name == 'repository_dispatch' && github.event.action == 'product-visibility-fix'
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          SHOPIFY_SHOP: bvdxj3-r8.myshopify.com
          FIX_ACTION: ${{ github.event.client_payload.action }}
          PRODUCT_ID: ${{ github.event.client_payload.product_id }}
        run: python3 tools/product_visibility_fix.py

      - name: Build product visibility report
        if: steps.gate.outputs.go == '1'
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          SHOPIFY_SHOP: bvdxj3-r8.myshopify.com
          STOCK_KEY: ${{ secrets.STOCK_KEY }}
        run: python3 tools/product_visibility.py

      - name: Verify report files
        if: steps.gate.outputs.go == '1'
        run: |
          test -s r/product-visibility.bin
          test -s r/product-visibility.meta.bin
          grep -q '"product-visibility"' r/status.json

      - name: Record visibility fix failure
        if: failure() && steps.gate.outputs.go == '1' && github.event_name == 'repository_dispatch'
        run: python3 tools/status.py r product-visibility fail "Visibility fix failed; check Shopify write scopes and the Actions log"

      - name: Publish report
        if: always() && steps.gate.outputs.go == '1'
        run: |
          python3 tools/report_preflight.py --phase post product-visibility
          git config user.name "Indifeels visibility bot"
          git config user.email "actions@users.noreply.github.com"
          git add r/status.json
          [ -f r/product-visibility.bin ] && git add r/product-visibility.bin || true
          [ -f r/product-visibility.meta.bin ] && git add r/product-visibility.meta.bin || true
          git diff --cached --quiet && exit 0
          git commit -m "Refresh product visibility report"
          for i in 1 2 3; do
            git pull --rebase -q origin main
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

