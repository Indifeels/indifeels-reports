name: Restock report

# Sold-variant restock list (7/15/30 day sales vs current stock).
# Rebuilds after every Shopify order (so a new sale is added straight away) and at 7am, 3pm and 8pm.
# Items deleted/confirmed in the report are remembered in Supabase (restock_cleared); only newer sales are counted for them.
run-name: "${{ github.event.action == 'report-schedule' && format('Schedule {0}', github.event.client_payload.schedule_group) || github.workflow }}"

on:
  repository_dispatch:
    types: [shopify-order, report-schedule]
  workflow_dispatch:

concurrency:
  # Per-workflow lock: prevents duplicate runs of this workflow from cancelling unrelated report refreshes.
  group: indifeels-restock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    if: (github.event.action != 'report-schedule' || (contains(github.event.client_payload.report_ids, 'restock'))) && github.event.action != 'shopify-order'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Schedule Panel dispatch gate
        id: gate
        run: |
          echo "go=1" >> "$GITHUB_OUTPUT"

      - name: Let the new order settle in Shopify
        if: steps.gate.outputs.go == '1' && github.event_name == 'repository_dispatch'
        run: sleep 45

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == '1'
        with:
          ref: main

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == '1'
        with:
          python-version: "3.12"

      - name: Install report dependency
        if: steps.gate.outputs.go == '1'
        run: pip install cryptography

      - name: Validate report contract
        if: steps.gate.outputs.go == '1'
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          STOCK_KEY: ${{ secrets.STOCK_KEY }}
          SYNC_READ_TOKEN: ${{ secrets.SYNC_READ_TOKEN }}
        run: python3 tools/report_preflight.py --phase pre restock

      - name: Build restock report
        if: steps.gate.outputs.go == '1'
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          SHOPIFY_SHOP: bvdxj3-r8.myshopify.com
          STOCK_KEY: ${{ secrets.STOCK_KEY }}
          SYNC_READ_TOKEN: ${{ secrets.SYNC_READ_TOKEN }}
        run: python3 tools/restock.py

      - name: Verify report files
        if: steps.gate.outputs.go == '1'
        run: |
          test -s r/restock.bin
          test -s r/restock.meta.bin
          grep -q '"restock"' r/status.json

      - name: Publish report
        if: always() && steps.gate.outputs.go == '1'
        run: |
          python3 tools/report_preflight.py --phase post restock
          git config user.name "Indifeels restock bot"
          git config user.email "actions@users.noreply.github.com"
          git add r/status.json
          [ -f r/restock.bin ] && git add r/restock.bin || true
          [ -f r/restock.meta.bin ] && git add r/restock.meta.bin || true
          git diff --cached --quiet && exit 0
          git commit -m "Refresh restock report (${{ github.event.client_payload.order || github.event_name }})"
          for i in 1 2 3; do
            git pull --rebase -q origin main
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

